takeholder has power merely because the decision affects them.\n- Do not introduce stakeholder theory, ethical frameworks, legal standards, or AI governance tools.\n- Do not preview later lessons.\n- Do not complete the Canvas task for the student; guide analysis while preserving the student’s responsibility for the final map.\n- Do not overemphasize the most obvious stakeholder conflict before checking for indirect or silent stakeholders.\n- Do not minimize losses to low-power stakeholders without evidence.\n\n## Student teaching preferences summary\n\n- No specific learning preferences are recorded.\n- Use a practical, interactive, scenario-based approach with structured tables and concise prompts.\n- Favor concrete examples and outcome-oriented language.\n- Allow independent drafting first, followed by targeted prompts and revision.\n- Check understanding through application rather than extended lecture.\n\n## Teaching instructions\n\nIntroduce the Canvas assignment as an applied stakeholder-analysis challenge. Briefly explain the required columns and model how to distinguish a stakeholder’s interest, power, vulnerability, and concrete gain or loss without completing the student’s task.\n\nPresent a business decision with both obvious and less obvious affected parties. Ask the student to identify stakeholders independently, then prompt them to look beyond the direct transaction for silent or indirect stakeholders. Have them draft the map with a minimum of three rows, including at least one stakeholder with no direct power.\n\nCoach precision by asking:\n- “What specific outcome does this stakeholder want?”\n- “What could they gain or lose?”\n- “Can they change the decision, or are they mainly exposed to its consequences?”\n- “Who is affected but absent from the decision?”\n\nThen ask the student to compare the rows and identify a conflict that would not have been visible from the obvious parties alone. Require a brief explanation of why that conflict is ethically significant, focusing on concrete consequences and power or vulnerability.\n\nFinish by asking the student to reframe the original business decision from the less obvious stakeholder’s perspective. Review the final Canvas submission for the required table structure, minimum stakeholder count, inclusion of a low-power stakeholder, concrete interests and gains or losses, a hidden conflict, and a clear stakeholder-based reframing.", "scores": {"section_structure": 1, "golden_similarity": 0.9126576829185981, "instruction_adherence": 1, "golden_agreement": 0.93, "retrieval_grounding": 0.9, "pairwise_preference": 0.75}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan precisely implements the Canvas task format: a stakeholder map with one row per stakeholder, columns for name/role, interest, and power/vulnerability, a minimum of three stakeholders including at least one with no direct power, followed by short analysis of the most ethically significant conflict and a reframing. It also respects all forbidden topics.", "golden_agreement": "The candidate reproduces nearly all reference decisions: identical mastery outcomes, the same table structure with ≥3 stakeholders including a powerless one, the same forbidden ethics/governance/AI scope, outcome-linked interests, independent drafting before feedback, hidden-conflict identification, and reframing from the silent stakeholder's perspective. Minor deviations are the added 'ethical significance' emphasis (slightly beyond scope), and omission of the reference's recall opener and closing reflection on how the silent stakeholder changed the perceived right action.", "retrieval_grounding": "Nearly all claims about the student trace to the summaries: strong stakeholder identification and intermediate power-vs-consequences (2026-08-26 lesson), recognition of indirect stakeholders (residents, suppliers), needing prompting for the drivers' interest statement, and the note that no learning preferences are recorded. The only slight overreach is claiming the student identified 'traffic' as a concrete effect—summaries actually flag noise/traffic externalities as something the student struggled to foresee, not something they demonstrated.", "pairwise_preference": "Both orders agreed (0.75 / 0.75). Both plans satisfy the eight-section format and copy the mastery outcomes verbatim, but Plan A's forbidden list is more complete, and its personalisation is more precisely grounded in the retrieved summaries (e.g., the scaffolding gap on interest statements, power-vs-impact confusion). Plan B's teaching instructions read as a more literal step-by-step lesson sequence, edging closer to the forbidden level of detail, while offering less scope protection."}}, "nano": {"output": "1. **Topics**\n   - Stakeholder map construction (stakeholder + primary interest + power/vulnerability)\n   - Structured stakeholder conflict identification (hidden conflict of interest)\n   - Reframing a “straightforward” decision using a less-obvious stakeholder’s perspective\n\n2. **Scope Envelope**\n   - **Allowed:**\n     - Complete a structured stakeholder analysis for a business decision (name stakeholders; identify each one’s interest; identify power or vulnerability; state what they gain/lose)\n     - Use the stakeholder map to identify a conflict of interest that wouldn’t be visible if only the most obvious parties were considered\n     - Reframe a business decision by surfacing a less-obvious stakeholder’s perspective\n     - Canvas task format: stakeholder map table (one row per stakeholder; columns for name/role, primary interest, and power or vulnerability) + short ethical conflict analysis\n     - Minimum of three stakeholders; include at least one stakeholder with no direct power\n   - **Forbidden:**\n     - Any topics not needed to perform stakeholder maps, stakeholder conflicts of interest, and decision reframing for the Canvas task\n\n3. **Mastery Outcomes**\n   - Complete a structured stakeholder analysis for a business decision: identify each stakeholder, their interest, their power, and what they stand to gain or lose.\n   - Use the stakeholder map to identify a conflict of interest that would not be visible if only the most obvious parties were considered.\n   - Reframe a business decision that initially seemed straightforward by surfacing a less obvious stakeholder's perspective.\n\n4. **New Concepts Introduced**\n   - None beyond the mastery-outcome-required stakeholder-map structure and the two reasoning moves (hidden conflict + reframing).  \n   - (If the student needs a reminder) “Power vs. vulnerability” is treated as: *who can influence the decision vs. who mainly bears consequences without direct influence*.\n\n5. **General remarks / tips**\n   - Keep stakeholder interests **outcome-oriented** (e.g., predictable income, revenue, safety, reputation), not generic (“they want the company to do well”).\n   - When the student lists stakeholders, require an immediate follow-up: “So what do they gain or lose if this decision goes through?”\n   - When identifying power, separate **strategic decision power** from **general importance** (the student previously tended to conflate these).\n   - For conflicts: aim for a conflict that involves a **less-obvious stakeholder** (not just company vs. most direct customers).\n\n6. **Things to Avoid**\n   - Don’t reinforce or re-teach stakeholder analysis from scratch; focus on applying the Canvas task format correctly and producing the ethical conflict + reframing.\n   - Don’t allow generic interests without a specific “gain/lose” consequence.\n   - Don’t treat “no direct power” as “not important”—force at least one vulnerable/low-power stakeholder to have a meaningful gain/lose line.\n   - Don’t jump straight to general ethical opinions; the student must point to a stakeholder map row/rows and use them to justify the conflict and reframing.\n\n7. **Student teaching preferences summary**\n   - No stated learning preferences.\n   - Practical, structured output format works well (tables/registers).\n   - The student benefits from prompting that converts stakeholder labels into **interest + mechanism of gain/lose**.\n   - Likely friction points to address with gentle checks:\n     - interests phrased too generally\n     - power mislabeled as “impact” rather than decision influence\n     - conflicts that ignore less-obvious (silent/vulnerable) stakeholders\n\n8. **Teaching instructions**\n   - Present the Canvas task requirements and verify they match the required format:\n     - Stakeholder map table with **one row per stakeholder**\n     - Columns: **name/role**, **primary interest**, **power or vulnerability**\n     - Minimum **3 stakeholders**, including **at least one with no direct power**\n     - Follow-on: short analysis identifying **which conflict of interest is most ethically significant and why**\n   - Give the student one business decision scenario (the same decision they’ll use for the Canvas submission, or supply a single consistent scenario for this lesson).\n   - Guide the student through an “input-check” pass before writing:\n     - Stakeholder coverage: direct + indirect/silent if relevant\n     - For each stakeholder row: interest is stated as a concrete outcome\n     - Power/vulnerability is stated as influence on the decision vs. exposure to consequences\n   - Then guide the student to:\n     - Identify at least one stakeholder conflict that would not be obvious if they only considered the “most obvious parties”\n     - Select the **most ethically significant** conflict (ethical significance should be tied to what is at stake for the involved stakeholders, especially the vulnerable/low-power one)\n   - Finally, require a reframing step:\n     - Start with the initial decision framing (“this seems straightforward”)\n     - Rewrite it using a **less-obvious stakeholder’s perspective** and state what changes (or what condition should be added) to address their gain/lose.\n   - End with a quick self-review checklist tied to grading:\n     - table has ≥3 stakeholders and includes a no-power/vulnerable stakeholder\n     - every row has interest + power/vulnerability\n     - conflict section names the relevant stakeholders from the map\n     - reframing explicitly uses a less-obvious stakeholder’s perspective", "scores": {"section_structure": 1, "golden_similarity": 0.8951534749754971, "instruction_adherence": 1, "pairwise_preference": 0, "retrieval_grounding": 1, "golden_agreement": 0.7}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan precisely implements the Canvas task format: a stakeholder map with one row per stakeholder, columns for name/role, primary interest, and power/vulnerability, a minimum of three stakeholders including at least one with no direct power, plus a short analysis of which stakeholder conflict is most ethically significant and why. All lesson-specific directives are reflected and enforced via checklists.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A violates two hard requirements: its forbidden list is a vague catch-all rather than an explicit, complete list, and its Teaching Instructions descend into detailed step-by-step lesson scripting with checklists. Plan B has a compliant 2-5 item allowed list, an explicit forbidden list of out-of-scope topics, high-level teaching guidance, and grounds its personalisation in the summaries.", "retrieval_grounding": "Every claim about the student traces to the summaries: prior stakeholder analysis lessons justify not re-teaching from scratch, the power-vs-importance conflation and generic-interest phrasing gaps are explicitly documented, difficulty spotting less-obvious/silent stakeholder conflicts appears in the summaries, and comfort with structured tables/registers is well evidenced. No unsupported mastery or preference claims are made.", "golden_agreement": "The candidate matches the reference's topics, mastery outcomes, allowed scope, table format requirements, and most tips (outcome-linked interests, power vs importance, silent stakeholders), but its forbidden list is vague rather than explicitly excluding ethical frameworks/governance/AI ethics, it declines to introduce the reference's new concepts, and its guided 'input-check' scaffolding plus 'most ethically significant conflict' emphasis slightly contradicts the reference's independent-drafting and no-ethical-analysis decisions."}}, "haiku": {"output": "# Lesson Plan: Challenge: Stakeholder Analysis in Practice\n\n## Topics\n\n- Structured stakeholder mapping with four dimensions: name/role, primary interest, power/vulnerability, and what each stakeholder stands to gain or lose\n- Identifying conflicts of interest that emerge only when multiple stakeholders are mapped together\n- Reframing business decisions by centering a less obvious stakeholder's perspective\n- Distinguishing between stakeholders who hold decision-making power and those who bear consequences without power\n\n---\n\n## Scope Envelope\n\n**Allowed:**\n- Stakeholder identification and mapping (taught 2026-08-26T15:02:48.943Z; reinforced multiple times)\n- Power-versus-consequences analysis (taught 2026-08-26T15:02:48.943Z)\n- Stakeholder interest articulation using concrete, outcome-oriented language (practiced 2026-07-20T13:42:53.289Z; 2026-05-04T15:20:28.290Z)\n- Conflict identification between stakeholders with competing interests (taught 2026-08-26T15:02:48.943Z; practiced 2026-08-04T16:25:26.104Z)\n- Silent/indirect stakeholders and second-order effects (taught 2026-08-26T15:02:48.943Z; reinforced 2026-05-04T15:20:28.290Z)\n\n**Forbidden:**\n- Ethical frameworks (consequentialism, deontology, virtue ethics, stakeholder theory) — these belong to Unit 2, which has not yet been taught\n- Trade-off analysis as a formal structured method — introduced in Unit 1 but not the focus of this challenge; this lesson emphasizes stakeholder mapping, not trade-off reasoning\n- Governance, compliance, or regulatory mechanisms — Unit 4 content\n- AI ethics components (bias, fairness, privacy, transparency, accountability) — Unit 3 content\n- Professional communication techniques or formal argument structure — Unit 5 content\n- Any assessment of whether a decision is \"legal\" or \"compliant\" — outside scope\n\n---\n\n## Mastery Outcomes\n\n- Complete a structured stakeholder analysis for a business decision: identify each stakeholder, their interest, their power, and what they stand to gain or lose.\n- Use the stakeholder map to identify a conflict of interest that would not be visible if only the most obvious parties were considered.\n- Reframe a business decision that initially seemed straightforward by surfacing a less obvious stakeholder's perspective.\n\n---\n\n## New Concepts Introduced\n\n- **Conflict of interest (in stakeholder context)**: A situation where two or more stakeholders' interests directly oppose each other in a way that creates a moral or practical dilemma. This lesson focuses on surfacing *hidden* conflicts—those involving stakeholders not immediately obvious to decision-makers.\n- **Silent/invisible stakeholder**: A party affected by a decision who has no voice in the decision-making process and whose interests may be overlooked or underweighted because they are not at the table.\n- **Reframing via stakeholder perspective**: The practice of restating a business problem or decision by starting from the viewpoint of a less powerful or less obvious stakeholder, revealing new moral dimensions of the decision.\n\n---\n\n## General Remarks / Tips\n\n1. **Build on existing competence**: The student has completed stakeholder identification (2026-08-26T15:02:48.943Z) and demonstrated intermediate confidence with stakeholder maps, power analysis, and interest articulation. This lesson should deepen rather than reteach those skills.\n\n2. **Address known gaps directly**: The student tends to:\n   - Conflate \"influence\" with general importance or customer-facing visibility (e.g., mistakenly labeling operational roles as high-power). When reviewing the student's work, press on *decision-making power* vs. operational impact.\n   - Write generic interest statements (\"their company and customers\") rather than concrete, outcome-oriented ones (\"steady stream of nearby orders\" vs. \"good income\"). Model sharp interest language; ask for revision if language is vague.\n   - Initially struggle to formulate stakeholder interests independently. Provide scaffolding (e.g., \"What does X want to happen? Why?\") before accepting answers.\n\n3. **Emphasize hidden conflicts**: The key intellectual move in this lesson is recognizing that conflicts become visible *only when you map all stakeholders*. The student has seen this in prior lessons (e.g., tension between customers' desire for fast/cheap delivery and drivers' need for fair pay), but this challenge requires them to do it independently and explain why an initially \"straightforward\" decision becomes complicated.\n\n4. **Leverage the delivery-app context**: The student has already worked with a delivery-app scenario (2026-08-26T15:02:48.943Z). Reusing or extending that context may feel natural, though a fresh scenario is equally valid. Either way, ensure at least one stakeholder is genuinely non-obvious (e.g., local residents, suppliers, or city planners, not just customers and drivers).\n\n5. **Canvas task format reminder**: The deliverable is a stakeholder map with one row per stakeholder, columns for name/role, primary interest, and power or vulnerability, followed by short analysis of which stakeholder conflict is most ethically significant and why. The map must include at least three stakeholders, including at least one with no direct power.\n\n---\n\n## Things to Avoid\n\n- Do not introduce ethical frameworks or ask the student to evaluate the decision against a named framework (e.g., consequentialism, deontology). This is Unit 2 material.\n- Do not ask for trade-off analysis in the formal sense (mapping gains and costs for each option). Stakeholder mapping is the tool; trade-off reasoning comes later.\n- Do not shift into governance or compliance evaluation (e.g., \"Is this decision legal?\"). Stay focused on who is affected and what they stand to gain or lose.\n- Do not accept vague or generic interest statements without pressing for specificity. \"They want the best outcome\" is not actionable; \"They want to reduce unpaid waiting time\" is.\n- Do not allow the student to shortcut power analysis by conflating visibility with decision-making power. Cooks and delivery drivers in a restaurant app are highly visible but have little power over the system's design.\n- Do not over-scaffold. The student has intermediate competence; provide hints and structure only if the student requests help or makes a conceptual error.\n\n---\n\n## Student Teaching Preferences Summary\n\nNo specific learning preferences are documented. Teach with clear scaffolding for interest articulation (where the student has shown gaps), and model sharp, outcome-oriented language. Allow space for independent work; the student can build stakeholder maps without constant coaching.\n\n---\n\n## Teaching Instructions\n\n1. **Open with the core intellectual move**: Review the distinction between stakeholders who are *obvious* (e.g., company, customers) and those who are *silent* or *indirect* (e.g., local residents, suppliers, affected workers). Remind the student that conflicts often become visible only when you map the full stakeholder ecosystem. Ask: \"What conflicts did you miss in your first read of a prior scenario before you mapped all the stakeholders?\"\n\n2. **Introduce the \"conflict of interest\" concept**: Explain that a conflict of interest arises when two or more stakeholders want mutually incompatible outcomes, and that some conflicts are hidden because one or more stakeholders have no voice in the room. Emphasize: this is not about illegality or deception; it is about whose interests are being weighed.\n\n3. **Present a business decision scenario** (either a fresh case or an extension of the delivery-app case the student has seen). Ensure the scenario initially appears straightforward (e.g., \"Should we launch this AI-powered feature to speed up order assignment?\") but contains at least one non-obvious stakeholder whose interests conflict with the obvious parties.\n\n4. **Guide stakeholder identification**: Ask the student to list all parties affected by this decision. Use prompts like:\n   - \"Who directly makes money or saves money?\"\n   - \"Who has to carry out the decision (workers, partners, vendors)?\"\n   - \"Who is affected indirectly (neighbors, third parties, future users)?\"\n   - \"Who has no voice in this decision room but bears consequences?\"\n   \n   Model the move of identifying silent stakeholders; do not accept \"everyone is represented\" without evidence.\n\n5. **Build the stakeholder map collaboratively, then independently**: \n   - For the first two stakeholders, work through the four columns together: name/role, primary interest (using concrete language), power (high/low or a brief description), and what they stand to gain or lose.\n   - Model sharp interest language: \"Delivery drivers want predictable, fair-paid orders assigned efficiently\" is better than \"Drivers want good outcomes.\"\n   - For subsequent stakeholders, ask the student to complete the map independently. Require revision if interests are vague or power analysis conflates visibility with decision-making authority.\n\n6. **Surface the hidden conflict**: Once the map is complete, ask: \"Which two or three stakeholders have incompatible interests? What is each one trying to achieve? Why do their goals conflict?\" Guide the student to articulate the conflict *concretely*. For example: \"Company wants to maximize order throughput; drivers want consistent, nearby orders; customers want speed—these three goals conflict because maximizing speed may mean breaking up drivers' geographic routes, reducing their predictability.\"\n\n7. **Reframe the decision from a silent stakeholder's view**: Select the least obvious stakeholder from the map and ask: \"What does this decision look like from their perspective? Does it still seem straightforward, or does it raise new concerns?\" For example: \"From the perspective of restaurant owners who depend on the app but have no voice in its design, the speed optimization might invisibly de-prioritize smaller restaurants, reducing their visibility and revenue.\"\n\n8. **Check the written analysis**: The student's short analysis should clearly state which conflict is most ethically significant *and why*. Significance should be justified by impact (who bears the cost, how severe) and power asymmetry (who has decision-making authority vs. who bears consequences). Avoid accepting \"it's significant because ethics matters\"; press for specificity.\n\n9. **Reinforce the lesson principle**: Conclude by reinforcing that this move—mapping all stakeholders, identifying conflicts, and reframing from a non-obvious perspective—is a foundational analytical practice. It is not the end of ethical reasoning; it is the beginning. (In subsequent units, frameworks will be introduced to help decide *which* conflict matters most and *how* to act.)\n\n---", "scores": {"section_structure": 1, "golden_similarity": 0.8374743694931461, "instruction_adherence": 1, "golden_agreement": 0.9, "retrieval_grounding": 1, "pairwise_preference": 0}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan's Canvas task format precisely matches the required stakeholder map (one row per stakeholder; columns for name/role, primary interest, power/vulnerability), the minimum of three stakeholders including at least one with no direct power, and the follow-up analysis of which conflict is most ethically significant and why. It reinforces these constraints in multiple sections and stays within scope.", "golden_agreement": "The candidate matches the reference on virtually all substantive decisions: identical topics and mastery outcomes, same scope exclusions (frameworks, trade-offs, governance, AI ethics), same new concepts (silent stakeholder, hidden conflicts, reframing lens), same pitfalls (power vs. visibility, vague interests), and the same lesson flow. The only notable deviation is that the candidate builds the first two map rows collaboratively, slightly contradicting the reference's decision that the student draft the table unaided before feedback.", "retrieval_grounding": "Every claim about the student—prior stakeholder identification and mapping (2026-08-26, 2026-07-20, 2026-05-04), power-vs-consequences analysis, conflict identification practice, the delivery-app scenario context, and the specific gaps (conflating influence with visibility, vague interest statements, needing scaffolding for interest articulation)—traces directly to the retrieved summaries. The plan also correctly notes no documented learning preferences rather than inventing any.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A's Teaching Instructions are a nine-step, scripted walkthrough with example dialogue and modeled answers — exactly the step-by-step detail the instructions forbid — while Plan B stays high-level, covers all eight sections in order, lists all three outcomes verbatim, and grounds its personalisation (interest specificity gaps, power-vs-importance confusion) in the retrieved summaries with far less padding."}}}}, {"id": "76e41ba0-70a8-4bd4-a5a3-9ad0146ee2fc", "course": "Project management", "fingerprint": "e0028ae57e18", "production": "### Topics\n- Purpose of a plain-language planning summary  \n- Translating technical artifacts (scope statement, WBS, time estimates) into stakeholder benefits  \n- Picking one or two methodology choices to spotlight for a non-technical audience  \n- Framing content around stakeholder interests and concerns  \n\n### Scope Envelope\nAllowed:  \n1. Scope statements and scope boundaries  \n2. Work Breakdown Structure fundamentals and deliverable hierarchy  \n3. Duration estimation outputs (analogous & three-point results only, not formulas)  \n4. Basic methodology labels (waterfall, agile, hybrid) and why they matter to stakeholders  \n5. Audience-first communication techniques (plain language, benefits-oriented framing)\n\nForbidden (must NOT appear):  \n- Task sequencing, dependencies, Gantt charts, or scheduling tools  \n- Critical path, float, or network diagrams  \n- Resource allocation, leveling, or capacity planning  \n- Cost estimation, budgeting, or variance analysis  \n- Risk registers, risk triggers, or response strategies  \n- Project tracking boards, sprints, or agile artifacts beyond simply naming “agile”  \n- Quality management, acceptance testing, or closure activities  \n- Any content from Units 3–5 or later lessons in Unit 2\n\n### Mastery Outcomes\n- Summarize the planning work completed so far — scope statement, WBS, and time estimates — into a clear overview for a non-technical stakeholder  \n- Select which methodology-driven planning choices to highlight based on the audience's interests and earlier stakeholder analysis  \n- Adapt your framing to what stakeholders care about  \n\n### New Concepts Introduced\n- The “translation layer” concept: converting technical planning details into stakeholder-relevant language (e.g., “Member onboarding journey” instead of “Deliverable 1”)  \n- The 3-Q framing check: “What do they care about? Why does this detail matter? What decision or reassurance does it enable?”  \n- A one-page briefing structure: headline, three planning bullets (scope, work packages, timelines), one methodology note, and a closing ask/next step  \n\n### General remarks / tips\n- Re-anchor all examples in the CrossTown Fitness pilot (three deliverables, two sites, 8-week / $18 k constraint).  \n- Have the student verbally map each briefing line back to a stakeholder concern identified earlier (e.g., cost → Sam, speed → the Board).  \n- Use recent wins from skills memory (clear deliverable names, WBS hierarchy) to build confidence before introducing new “translation layer” ideas.  \n- Keep math minimal: present final duration numbers only, not the calculation steps, to stay stakeholder-friendly.  \n- Encourage editing for plain language—short sentences, familiar terms, no acronyms unless defined.\n\n### Things to Avoid\n- Any deep dive into formulas (PERT, three-point math) or charts; only final numbers may appear.  \n- Introducing scheduling or resource topics that belong to later lessons.  \n- Jargon such as “float,” “baseline variance,” or “risk trigger.”  \n- Critiquing spelling/grammar; focus strictly on planning content.  \n\n### Student teaching preferences summary\nNo explicit preferences recorded; proceed with balanced explanation + guided practice. Student shows stronger recognition skills than free-form creation—provide scaffolds, then require independent writing.\n\n### Teaching instructions\n1. Begin with a quick recall quiz (verbal) on their own scope statement, WBS levels, and total estimated effort to warm up prior knowledge.  \n2. Introduce the “translation layer” idea and display a mocked-up one-page briefing; deconstruct each section with the student.  \n3. Guide the student to draft their briefing in a new Canvas document titled “Planning Summary,” using the CrossTown scenario.  \n4. Prompt them to choose ONE methodology point that will resonate most with Sam (e.g., hybrid allows feedback loops in an 8-week pilot) and justify the pick in one sentence.  \n5. Review their draft aloud, checking each sentence against the 3-Q framing check; have the student edit live for clarity and stakeholder focus.  \n6. Close by asking the student to name two stakeholder questions their briefing answers and one it leaves open, setting up curiosity for the next lesson.", "lessonTitle": "Presenting your plan: a stakeholder checkpoint", "unitTitle": "Planning the work", "masteryOutcomes": ["Summarize the planning work completed so far — scope statement, WBS, and time estimates — into a clear overview for a non-technical stakeholder", "Select which methodology-driven planning choices to highlight based on the audience's interests and earlier stakeholder analysis", "Adapt your framing to what stakeholders care about"], "instructions": {"unit": "Use this scenario throughout the unit. The CrossTown Fitness pilot project (from Unit 1) now enters planning. The learner is the PM and must plan the delivery of 3 deliverables across 2 pilot locations within 8 weeks and $18,000. The team: Maria Chen (Regional Operations Manager, can dedicate only 10 hours/week), Andre (Front Desk Lead, skeptical), Zoe (Marketing Coordinator, part-time across all 6 locations), Jordan (flagship manager, protective of current processes), and Riley (newest location manager, eager but her staff is inexperienced). Key constraints to work with: Maria's limited availability, Zoe's part-time schedule, and two pilot locations with different operating hours and staff cultures. Stakeholders: CEO Sam (wants fast results, watches budget), the Board (gates the 7th location decision on pilot results), and members at both locations. Use this scenario to ground every planning lesson — scope definition, WBS, estimation, scheduling, critical path, resource allocation, budgeting, and the tracking board. Let the student figure out the specifics: what's in scope vs. out, how to decompose the deliverables, where the bottlenecks are, and how to allocate the budget.", "lesson": "Ask the student to open a new Canvas titled 'Planning Summary.' The student writes a one-page briefing that summarizes the planning work completed so far — scope statement, WBS, and time estimates — in plain language a non-technical stakeholder (like Sam the CEO) would understand. \n\nUse the CrossTown Fitness scenario here - new member churn issue. deliverables: a new-member onboarding journey, a member pulse survey, and an at-risk member alert dashboard."}, "models": {"luna": {"output": "## Topics\n\n- Writing a one-page planning summary\n- Translating scope, WBS, and time estimates into plain language\n- Highlighting planning choices relevant to Sam, the CEO\n- Connecting the summary to stakeholder interests\n\n## Scope Envelope\n\n**Allowed:**\n\n- Summarizing the CrossTown Fitness pilot’s three deliverables: the new-member onboarding journey, member pulse survey, and at-risk member alert dashboard\n- Explaining the project scope, WBS structure, and time estimates in non-technical language\n- Selecting planning information that matters to Sam’s priorities: fast results, budget awareness, and pilot value\n- Framing the summary around the 8-week, two-location, $18,000 pilot and relevant stakeholder concerns\n\n**Forbidden:**\n\n- Creating a detailed project schedule or sequencing dependencies\n- Identifying or calculating the critical path or float\n- Assigning resources or building a resource assignment matrix\n- Creating a bottom-up budget or phased budget baseline\n- Building a risk register or assigning risk responses\n- Setting up or populating a project tracking board\n- Tracking execution progress, milestone status, or schedule slippage\n- Creating a communication plan or meeting agenda\n- Negotiating scope, resources, or timelines\n- Managing team conflict or selecting leadership behaviors\n- Identifying risk triggers or escalating active risks\n- Evaluating deliverable quality against acceptance criteria\n- Comparing budget versus actual spending\n- Managing scope creep or evaluating change requests\n- Presenting final project results or making a rollout recommendation to the Board\n- Conducting lessons learned or closing the project\n- Introducing any capstone work from later units\n- Teaching new methodology categories beyond the previously learned hybrid approach\n\n## Mastery Outcomes\n\n- Summarize the planning work completed so far — scope statement, WBS, and time estimates — into a clear overview for a non-technical stakeholder\n- Select which methodology-driven planning choices to highlight based on the audience's interests and earlier stakeholder analysis\n- Adapt your framing to what stakeholders care about\n\n## New Concepts Introduced\n\n- **Planning summary:** A concise, decision-oriented overview that converts detailed planning artifacts into information a stakeholder can quickly understand and use.\n- **Plain-language translation:** Replacing technical planning terms with familiar explanations while preserving the meaning of scope, deliverables, work packages, and estimated effort.\n- **Audience-centered emphasis:** Selecting details based on a stakeholder’s priorities rather than presenting every planning detail equally.\n- **Executive framing:** Organizing information around outcomes, timing, constraints, and decisions that matter to a senior stakeholder such as Sam.\n- **Methodology-driven planning choices:** Explaining the value of the previously selected hybrid approach through practical implications—structured planning combined with opportunities for feedback—without teaching new methodology content.\n\n## General remarks / tips\n\n- Ask the student to open a new Canvas titled **“Planning Summary.”**\n- Have the student create a one-page briefing for **Sam, the CEO**, using the CrossTown Fitness new-member churn scenario.\n- Keep the three deliverables central:\n  - New-member onboarding journey\n  - Member pulse survey\n  - At-risk member alert dashboard\n- Encourage a clear executive structure:\n  1. Purpose and desired business outcome\n  2. What the pilot will produce\n  3. How the work is broken down\n  4. How long the work is expected to take\n  5. Why the planning approach fits the pilot\n  6. What Sam should understand or confirm\n- Reinforce that the **scope statement** describes what the project will produce, while the **WBS** shows how those deliverables are broken into manageable work packages. Do not let the student turn the WBS into a dated schedule.\n- Use concise examples grounded in the scenario, such as explaining that the onboarding journey includes designing and preparing the new-member experience, while avoiding invented detailed tasks not established by the student’s planning work.\n- Prompt the student to explain estimates carefully. The student understands analogous estimation but needs support with three-point calculations and distinguishing optimism bias, stakeholder pressure, and missing tasks. If estimates are included, ask the student to state whether they are based on a comparable past effort or a range using optimistic, most-likely, and pessimistic values.\n- Ask the student to explain why Sam needs certain information:\n  - Fast results → emphasize the 8-week pilot and major work areas.\n  - Budget awareness → acknowledge the fixed $18,000 constraint without creating a budget.\n  - Expansion decision → connect the pilot outputs to learning about member churn, without making the later rollout decision.\n- Encourage explicit stakeholder reasoning. The student should identify what Sam cares about and contrast it briefly with what members, front-desk staff, Maria, or the Board may care about.\n- Require complete explanations rather than only labels or selected answers, especially for statements such as: “This planning choice matters to Sam because…”\n- Use a short revision pass focused on clarity, completeness, measurable language, and whether a non-technical reader could understand the briefing without seeing the underlying planning documents.\n- The final Canvas should remain approximately one page and should summarize existing planning work rather than introduce a new schedule, budget, resource plan, or risk register.\n\n## Things to Avoid\n\n- Do not introduce dependencies, milestones, critical path, resource allocation, budgeting calculations, risks, tracking boards, or execution practices.\n- Do not preview later lessons.\n- Do not overuse terms such as “WBS” or “work package” without explaining them.\n- Do not present technical planning detail that Sam would not need at this checkpoint.\n- Do not invent exact task durations, costs, owners, or completion dates if they are not present in the student’s planning artifacts.\n- Do not confuse deliverables with requirements or work packages.\n- Do not treat a WBS as a schedule.\n- Do not frame the briefing as a final results report or recommendation to scale.\n- Do not substitute a generic project example for the CrossTown Fitness scenario.\n- Do not correct irrelevant writing issues; address wording only when it affects clarity or professional communication.\n\n## Student teaching preferences summary\n\n- No specific learning preferences are recorded.\n- Use a practical, scenario-based approach with concise templates and guided drafting.\n- Balance recognition-based checks with independent writing, since the student has demonstrated strong recognition of planning concepts but needs more practice producing complete artifacts independently.\n- Provide light scaffolding for three-point estimation and audience-centered explanations.\n- Encourage clear, structured, professional writing without making the lesson primarily about wording mechanics.\n\n## Teaching instructions\n\n- Begin by orienting the student to the stakeholder checkpoint: they are not presenting every planning detail; they are helping Sam understand what will be delivered, how the work is organized, how much effort is expected, and why the approach supports the pilot’s goals.\n- Introduce each new concept explicitly before asking the student to use it.\n- Guide the student toward creating the one-page Canvas briefing, using the CrossTown Fitness scenario throughout.\n- Ask targeted questions that require the student to choose what Sam needs to know and explain why. For example, ask which details support Sam’s concerns about speed, budget, and pilot value.\n- When reviewing the draft, check whether it accurately summarizes the scope statement, WBS, and time estimates; uses plain language; highlights relevant hybrid-planning choices; and reflects Sam’s interests.\n- Use brief checks for understanding, including asking the student to distinguish a deliverable from a work package and a WBS from a schedule.\n- End by having the student read the summary as Sam would and revise any detail that is either too technical, unsupported, or unrelated to the CEO’s concerns.", "scores": {"section_structure": 1, "golden_similarity": 0.8895993315842502, "instruction_adherence": 1, "golden_agreement": 0.85, "retrieval_grounding": 0.85, "pairwise_preference": 0.5}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan faithfully implements the lesson directive—Canvas titled 'Planning Summary,' a one-page plain-language briefing for Sam summarizing scope, WBS, and time estimates—while grounding everything in the CrossTown Fitness churn scenario with the three specified deliverables (onboarding journey, pulse survey, at-risk dashboard). It respects the unit scenario constraints (8 weeks, two locations, $18,000, Sam's concerns) and appropriately forbids scheduling, budgeting, critical path, and other topics not part of this lesson.", "golden_agreement": "The candidate matches the reference's topics, scope boundaries, mastery outcomes, one-page briefing structure, CrossTown anchoring, stakeholder-mapping, and avoidance of grammar critique and forbidden topics. It slightly contradicts the 'keep math minimal, no formula scaffolding' guidance by suggesting support for three-point estimation, and omits the explicit 3-Q framing check, the opening recall quiz, and the closing 'two questions answered / one left open' hook.", "retrieval_grounding": "Nearly all claims about the student trace to the summaries: analogous estimation understood, three-point calculation and bias-distinction weaknesses, strong recognition but weak independent artifact production, prior hybrid methodology selection, prior scope/WBS/estimation and stakeholder analysis lessons, and no recorded preferences. The plan slightly overstates prior work by asserting the student's planning artifacts include an onboarding journey and at-risk alert dashboard (and Sam as CEO with an $18,000 figure), when summaries only show the member pulse survey WBS and a different scope statement exercise.", "pairwise_preference": "ORDERS DISAGREED (0.75 / 0.25). Both plans satisfy the eight-section structure, scope envelope, and outcome coverage, but Plan A grounds its guidance more concretely in the retrieved summaries (three-point estimation weakness, deliverable-vs-requirement confusion, need for complete written explanations), giving the teaching agent actionable, student-specific guardrails. Plan B is leaner and compliant, but its personalisation is thinner, so Plan A edges it slightly despite its extra length."}}, "nano": {"output": "## Topics\n- Writing a one-page stakeholder briefing (“Planning Summary”)  \n- Summarizing scope, WBS, and time estimates in plain language  \n- Choosing what to emphasize for a specific audience (CEO, Board, site members)  \n- Adapting framing to stakeholder concerns using the CrossTown Fitness pilot scenario  \n\n## Scope Envelope\n- Draft a one-page “Planning Summary” that communicates: scope statement, WBS, and time estimates (from the planning work completed so far) to a non-technical stakeholder in plain language  \n- Use the CrossTown Fitness pilot scenario to ground the briefing (3 deliverables across 2 pilot locations within 8 weeks and $18,000)  \n- Select 2–4 methodology-driven planning choices to highlight based on stakeholder interests (e.g., CEO wants speed; Board gates rollout decision on pilot results)  \n- Include a member-churn context using the new deliverables: new-member onboarding journey, member pulse survey, and at-risk member alert dashboard  \n\n## Mastery Outcomes\n- Summarize the planning work completed so far — scope statement, WBS, and time estimates — into a clear overview for a non-technical stakeholder  \n- Select which methodology-driven planning choices to highlight based on the audience's interests and earlier stakeholder analysis  \n- Adapt your framing to what stakeholders care about  \n\n## New Concepts Introduced\n- None (this lesson focuses on communicating already-built planning artifacts: scope statement, WBS, and time estimates)\n\n## General remarks / tips\n- Treat “Planning Summary” as a decision-support doc: it should answer “What are we doing, what’s included, how will we deliver it, and are we realistic about time/bandwidth?”  \n- Use short sections with strong labels (so a busy stakeholder can scan in ~60 seconds).  \n- Default to “why this matters to churn/pilot success” as the through-line for every planning detail you include.  \n\n## Things to Avoid\n- Re-teaching or expanding new planning mechanics beyond scope/WBS/time-estimate summarization (no schedule building, critical path deep-dives, risk registers, or budgets in depth).  \n- Including irrelevant technical detail that the CEO/Board wouldn’t need to make a checkpoint decision.  \n- Vague statements like “we’ll do surveys and dashboards” without connecting to the deliverables already defined in scope.  \n- Mixing up scope (what’s produced / boundaries) vs. requirements (how each deliverable is considered “done”).  \n- “Too much inside baseball”: naming every micro-task from the WBS instead of summarizing the structure and major work packages.  \n\n## Student teaching preferences summary\n- No specific preferences provided.  \n- Based on recent work patterns, the student benefits from:  \n  - Clear templates/structure and labeled sections  \n  - Plain-language explanations targeted to non-technical audiences  \n  - Reinforcing precise inclusion/exclusion wording (scope boundaries)  \n\n## Teaching instructions\n- Have the student create a new Canvas titled **“Planning Summary.”**  \n- Instruct the student to write a **one-page briefing** that covers, in plain language, the following three planning elements:\n  1. **Scope statement overview** (what’s in scope vs. out of scope) tied to CrossTown Fitness’s churn-driver context and the pilot constraints  \n  2. **WBS overview** (how the 3 deliverables break down into the major work packages—without listing every task)  \n  3. **Time estimates overview** (how long key chunks take, in a stakeholder-friendly way that suggests realism for the 8-week pilot)\n- Ask the student to then do a quick **audience adaptation pass**:\n  - Identify the top **2–3 stakeholder concerns** driving what they should emphasize (CEO speed/budget fit; Board pilot gate; members’ experience risk at both locations)\n  - Choose which **methodology-driven planning choices** to highlight accordingly (e.g., why the approach supports fast iteration and feedback within the timebox)\n- End by having the student self-check:\n  - “If Sam read only this page, would they understand what’s included, what we’re not doing, and whether we can deliver within 8 weeks and $18,000?”\n  - “Would the Board see enough evidence of structured planning to confidently gate the next-location decision?”", "scores": {"section_structure": 1, "golden_similarity": 0.8953529213620994, "instruction_adherence": 1, "golden_agreement": 0.65, "pairwise_preference": 0.125, "retrieval_grounding": 0.6}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan faithfully uses the CrossTown Fitness scenario with correct constraints (8 weeks, $18,000, 2 locations), incorporates the churn issue and the three specified deliverables, and centers on the one-page 'Planning Summary' Canvas summarizing scope/WBS/time estimates in plain language for non-technical stakeholders like Sam. It correctly lets the student figure out specifics and avoids re-teaching mechanics ruled out for this lesson.", "golden_agreement": "The candidate matches the core topics, all three mastery outcomes, the CrossTown grounding, the one-page briefing structure, and most scope exclusions (no scheduling, critical path, risk, budget). However, it explicitly declares 'no new concepts,' omitting the reference's translation-layer and 3-Q framing check ideas, suggests highlighting 2–4 methodology choices instead of one, and lacks the warm-up recall quiz, live edit pass, and 'final numbers only, no formulas' guidance.", "pairwise_preference": "Both orders agreed (0.25 / 0.00). Plan B fully satisfies the Scope Envelope requirement with 5 allowed items and an explicit, complete forbidden list, while Plan A's Scope Envelope contains no forbidden-topics list (only partial coverage buried in Things to Avoid). Plan B's personalisation claim (stronger recognition than free-form creation) is also directly grounded in the WBS lesson summary; both plans' teaching instructions are similarly detailed, so B wins on scope discipline.", "retrieval_grounding": "The plan's core claims — that the student previously built a scope statement, WBS, time estimates, stakeholder analysis, and worked in the CrossTown Fitness churn/8-week/two-location pilot context — are all traceable to the summaries, as is the inferred preference for templates and structured sections. However, it asserts as already-completed work three specific deliverables ('new-member onboarding journey' and 'at-risk member alert dashboard' are never shown; only the member pulse survey appears), plus an $18,000 budget and CEO-specific concerns that the summaries never document, treating unestablished planning artifacts as already defined by the student."}}, "haiku": {"output": "# Lesson Plan: Presenting Your Plan: A Stakeholder Checkpoint\n\n## Topics\n\n- Summarizing planning work (scope, WBS, time estimates) in plain language  \n- Audience analysis and stakeholder communication strategy  \n- Adapting technical planning content for non-technical stakeholders  \n- Translating project decisions into business impact language  \n- Creating a one-page planning briefing for executive review\n\n---\n\n## Scope Envelope\n\n### Allowed\n- Scope statement (scope definition, in-scope/out-of-scope items, acceptance criteria per deliverable)  \n- Work Breakdown Structure (WBS) hierarchy, deliverables, work packages  \n- Duration estimation techniques (analogous and three-point estimation)  \n- Project charter components (problem statement, objectives, constraints, success criteria)  \n- Stakeholder identification and interests (from prior stakeholder register work)  \n- Triple constraint (scope, time, cost) and trade-off reasoning  \n- Plain-language business communication and executive framing  \n\n### Forbidden\n- **Scheduling (task dependencies, sequencing, Gantt charts, critical path)**  \n- **Resource planning and allocation (RAM, resource leveling)**  \n- **Cost estimation, budgeting, and financial analysis**  \n- **Risk registers and risk response strategies**  \n- **Agile/sprint artifacts and tracking boards**  \n- **Change control processes**  \n- **Project execution, tracking, or closure activities**  \n- **Formal project management methodologies beyond brief mention**  \n\n---\n\n## Mastery Outcomes\n\n- Summarize the planning work completed so far — scope statement, WBS, and time estimates — into a clear overview for a non-technical stakeholder  \n- Select which methodology-driven planning choices to highlight based on the audience's interests and earlier stakeholder analysis  \n- Adapt your framing to what stakeholders care about\n\n---\n\n## New Concepts Introduced\n\n- **Executive summary framing for planning**: Translating technical project artifacts (scope statement, WBS, time estimates) into a one-page narrative that focuses on business outcomes and decisions rather than process or methodology  \n- **Stakeholder-centric communication**: Selecting which planning elements matter most to a specific non-technical audience (e.g., CEO Sam prioritizes timeline and budget alignment; Board prioritizes pilot success and risk clarity; location members prioritize local impact)  \n- **Plain-language planning language**: Converting structured project documentation into conversational, jargon-free prose that explains *what* the project will deliver, *why* it matters, and *when* it will be complete — without detailing *how* it will be done\n\n---\n\n## General Remarks / Tips\n\n- This lesson applies everything the student has learned in Planning the Work up to this point: scope definition (completed 2026-08-24T14:35:01.999Z), WBS (completed 2026-08-26T00:37:56.570Z), and duration estimation (completed 2026-08-26T01:24:39.055Z).  \n- The student has demonstrated intermediate confidence in scope statements, WBS structure, and estimation techniques. They have also shown solid understanding of stakeholder identification and project charters.  \n- This is a *synthesis* lesson: the student is not learning new planning concepts but rather practicing how to communicate completed planning work to a non-technical audience.  \n- The CrossTown Fitness scenario provides the concrete context: the student must summarize planning for the 8-week pilot (3 deliverables: onboarding journey, member pulse survey, at-risk member alert dashboard) within $18,000 and Maria's 10-hour/week constraint.  \n- Emphasize that a planning briefing is **not** a detailed task list or schedule—it is a short, persuasive overview that answers: What are we building? Why? When will it be done? What are the key constraints or trade-offs?  \n- The student may need guidance on **what to leave out**: detailed work-package breakdowns, hour-by-hour estimates, and risk registers belong in the full project plan, not in a one-page executive summary.\n\n---\n\n## Things to Avoid\n\n- **Do not introduce scheduling concepts** (dependencies, critical path, Gantt charts, milestone sequencing). Keep the time summary at the level of \"8-week total duration\" and phase milestones if needed.  \n- **Do not require cost breakdowns or budget detail**. A high-level statement like \"within the $18,000 budget\" is sufficient for this audience.  \n- **Do not introduce resource allocation or leveling**. Mention constraints (Maria's 10-hour availability) only if it directly affects stakeholder understanding of feasibility.  \n- **Do not include risk register details or mitigation strategies**. If risks are mentioned, frame them as assumptions or dependencies (e.g., \"relies on member availability for feedback\").  \n- **Do not assume the student will spontaneously structure the briefing correctly**. Provide clear guidance on the one-page format, section headers, and what belongs in each section.  \n- **Do not reinforce estimation calculations or WBS code structure** in this lesson—those were mastered in prior lessons. Focus on *translating* those outputs into business language.  \n- **Do not confuse this lesson with project reporting or status updates.** This is a *pre-execution* checkpoint briefing, not a progress report.\n\n---\n\n## Student Teaching Preferences Summary\n\nNo specific learning preferences documented. The student shows intermediate confidence in structured project documentation and scope work; they respond well to concrete examples and templates. Provide clear, labeled sections and expect the student to need scaffolding to distinguish what a \"planning briefing\" includes versus what belongs in detailed project plans.\n\n---\n\n## Teaching Instructions\n\n### Overview\nAsk the student to open a new Canvas titled \"Planning Summary\" and write a **one-page briefing** that summarizes the planning work completed so far — scope statement, WBS, and time estimates — in plain language a non-technical stakeholder (like Sam the CEO) would understand. The briefing is a checkpoint communication before execution begins; it shows the sponsor and Board that the project has been thought through, is realistic within constraints, and is ready to launch.\n\n### Lesson Flow\n\n1. **Frame the Purpose (Briefly)**  \n   Explain that this briefing is how the PM communicates readiness to the sponsor. It answers: \"What are we building? Why does it matter? When will it be done? What are the key constraints?\" Sam the CEO needs to understand the plan without reading a 20-page project plan.\n\n2. **Anchor to Stakeholder Context**  \n   Remind the student of their earlier stakeholder analysis (from 2026-08-21T22:50:28.031Z):  \n   - **Sam Delgado (CEO)** cares about: speed, cost control, and risk to the Board's decision on scaling to 7 locations  \n   - **The Board** cares about: pilot success metrics and whether the 8-week timeline is realistic  \n   - **Location members** care about: how the project affects their day-to-day experience  \n   \n   Ask: *Which of these stakeholders is your audience for this briefing?* (Answer: Sam and the Board). What do they need to know?\n\n3. **Translate Scope into Business Language**  \n   - Scope statement (from 2026-08-24T14:35:01.999Z) listed three deliverables with acceptance criteria. Now ask the student to rewrite each deliverable in one sentence that explains *what it is* and *why it matters to members or operations*. Example:  \n     - Instead of: \"Acceptance criteria: new-member onboarding journey with 2–3 touchpoints, 80% completion rate\"  \n     - Use: \"We will design a new-member onboarding experience that reduces first-week confusion and increases retention.\"  \n   - Ask the student to identify what is *explicitly out of scope* (from their earlier scope statement) and whether Sam needs to know about any exclusions to prevent misalignment.\n\n4. **Translate WBS into a Delivery Timeline Narrative**  \n   - The student's WBS (from 2026-08-26T00:37:56.570Z) had 3 Level 2 deliverables and 6–9 Level 3 work packages. Now ask: *In what order will these be completed? What are the major milestones?*  \n   - Do NOT ask for a detailed schedule. Instead, ask for 2–3 major phases or milestones (e.g., \"Weeks 1–2: Research and design survey questions; Weeks 3–6: Collect data and iterate; Weeks 7–8: Build dashboard and finalize recommendations\").  \n   - Emphasize that this shows *thoughtful sequencing*, not a task-by-task gantt chart.\n\n5. **Translate Duration Estimates into a Realistic Timeline**  \n   - The student estimated durations for work packages (from 2026-08-26T01:24:39.055Z) using analogous or three-point estimation. Now ask:  \n     - *How did you estimate? What assumptions did you make?* (e.g., \"I used a similar survey project and adjusted for scope; I assume Maria can dedicate 10 hours/week consistently\")  \n     - *Does 8 weeks seem realistic given those assumptions?*  \n   - Have the student state the key assumptions or constraints in one sentence (e.g., \"The 8-week timeline assumes Maria's consistent 10-hour weekly availability and member participation in feedback sessions\").\n\n6. **Draft the One-Page Briefing**  \n   Provide a simple template:  \n   ```\n   PLANNING SUMMARY: [Project Name]\n   \n   The Challenge & Opportunity  \n   [One sentence on the business problem — churn — and the opportunity the pilot addresses]\n   \n   What We Will Deliver  \n   [Three bullet points, one per deliverable, describing *what* and *why* in business language]\n   \n   How We'll Get There  \n   [2–3 bullets on major phases or milestones, showing thoughtful sequencing]\n   \n   Timeline & Constraints  \n   [One sentence: total duration + key assumptions (e.g., Maria's availability, member feedback)]\n   \n   Why This Approach  \n   [One sentence on why this plan is realistic and how it aligns with pilot goals — e.g., \"This hybrid approach balances speed with learning through iterative feedback.\"]\n   ```  \n   \n7. **Review for Clarity and Audience Fit**  \n   Once the student drafts the briefing, ask:  \n   - Does this explain *why* each deliverable matters to CrossTown's churn problem?  \n   - Would Sam (without a PM background) understand what the team will produce by Week 8?  \n   - Are there any technical terms or project-management jargon that should be removed?  \n   - Does it acknowledge the key constraints (Maria's time, 8-week deadline, $18,000 budget) without drowning in detail?\n\n8. **Reinforce Key Distinctions**  \n   Clarify what is *not* in a planning briefing:  \n   - No WBS codes, work-package names, or task lists  \n   - No hour-by-hour or task-by-task schedules  \n   - No detailed cost breakdowns (just \"within budget\")  \n   - No risk register or mitigation strategies  \n   - No agile sprints, stand-ups, or methodology labels  \n   \n   What *is* included:  \n   - Business problem and opportunity  \n   - Three clear deliverables (what + why)  \n   - Realistic timeline with key assumptions  \n   - One-sentence framing of approach fit to pilot goals\n\n---\n\n**End of Lesson Plan**", "scores": {"section_structure": 1, "golden_similarity": 0.8543981960094658, "instruction_adherence": 0.95, "pairwise_preference": 0, "golden_agreement": 0.72, "retrieval_grounding": 0.35}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan uses the CrossTown Fitness scenario with the churn issue and the three specified deliverables (onboarding journey, pulse survey, at-risk dashboard), and centers the one-page 'Planning Summary' briefing summarizing scope, WBS, and time estimates in plain language for Sam the CEO, exactly as instructed. It also correctly lets the student figure out specifics while grounding in scenario constraints; only minor forbidden-topic tension exists (a slight mention of sequencing/milestones), but it explicitly cautions against detailed scheduling.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A usiness settings (practical definition)  \n• What a “Large Language Model (LLM)” is and why it matters commercially  \n• Five real-world AI use cases: how each works, one benefit, one risk  \n• Plain-language mechanics of AI outputs: training data → pattern recognition → objective function  \n• Deep-dive on one use case: how a design/deployment choice created the risk  \n\n2. Scope Envelope  \nAllowed:  \n1. AI & LLM basic definitions framed for business people  \n2. Training data, pattern recognition, and human-set objectives described without technical jargon  \n3. Concrete business use cases live in 2026 (e.g., automated résumé screening, retail demand forecasting, targeted advertising, dynamic pricing, image-based quality control)  \n4. Naming one benefit and one risk for each use case  \n5. Explaining how the chosen use case’s risk stems from a design or deployment decision  \n\nForbidden (out-of-scope today):  \n• Detailed bias/fairness metrics (equalized odds, demographic parity, etc.)  \n• Human accountability chains or governance structures  \n• Stakeholder analysis frameworks  \n• Ethical theories (consequentialism, deontology, virtue ethics, stakeholder theory)  \n• AI regulation (FTC, EU AI Act, HIPAA, EEOC, etc.)  \n• AI ethics components beyond a single benefit/risk pair (privacy, transparency, accountability deep dives)  \n• Any unit-2-to-5 content (ethical frameworks, governance, compliance, professional judgment)  \n\n3. Mastery Outcomes  \n• Identify at least five real ways AI is currently used in business settings that affect people's lives, naming one benefit and one risk for each.  \n• Describe in plain terms how AI systems reach their outputs — training data, pattern recognition, and human-set objectives — without technical jargon.  \n• For one AI use case, explain why the risk arose from the way the system was designed or deployed — not just what the risk is.  \n\n4. New Concepts Introduced  \n• Large Language Model (LLM) – an AI system trained on vast text data to predict the next word, enabling chat-style tools and content generation.  \n• Pattern recognition (AI context) – finding recurring relationships in data so the system can make predictions.  \n• Training data (AI context) – the historical examples the system studies to learn patterns.  \n• Objective / optimization target – the measurable goal designers set that the system tries to maximize.  \n• Design-versus-deployment risk – the idea that harm can come from how the system is built (design) or how/where it is put to use (deployment).  \n\n5. General remarks / tips  \n• Lead with familiar consumer/business examples; the student learns best when theory follows a concrete scenario.  \n• Keep all explanations in non-technical language (“patterns in past examples” instead of “gradient descent”).  \n• Use quick checks (closed-question widgets, single-answer) after each use case to confirm benefit/risk recall.  \n• Call back to the student’s marketing and decision-bias background when illustrating benefits (e.g., targeted ads link to social-proof lessons).  \n• Invite the student to supply a sixth example from their own experience to solidify transfer.  \n\n6. Things to Avoid  \n• Reinforcing course-structure details from the orientation lesson (taught just now 2026-08-27T13:33:06Z).  \n• Technical jargon (neural networks, embeddings, back-propagation).  \n• Previewing fairness metrics, governance mechanisms, or ethical frameworks that belong to later units.  \n• Abstract or hypothetical AI uses—stick to live, verifiable 2026 business cases.  \n\n7. Student teaching preferences summary  \nNo explicit preferences recorded. Past performance shows the student engages well with:  \n– Concrete, real-world examples they can recognize.  \n– Short interactive checks for understanding.  \n– Clear templates and sentence frames to articulate risks/benefits.  \n\n8. Teaching instructions  \n• Open (≤4 min): Define “AI” and “LLM” in everyday business terms; immediately anchor each with one live example.  \n• Landscape survey: Walk through five curated use cases. For each: what it does, benefit, risk.  \n• Mechanics interlude: Explain training data → pattern recognition → objective in plain language, tied back to the just-discussed use cases.  \n• Deep dive: Choose one use case (e.g., résumé screening). Guide the student to trace how a design or deployment choice produced the identified risk.  \n• Active practice: Prompt the student to name a sixth use case and fill the benefit/risk template.  \n• Close: Quick recap matching the three mastery outcomes; flag any lingering misconceptions for next session.", "lessonTitle": "AI in business today", "unitTitle": "Ethics and AI foundations", "masteryOutcomes": ["Identify at least five real ways AI is currently used in business settings that affect people's lives, naming one benefit and one risk for each.", "Describe in plain terms how AI systems reach their outputs — training data, pattern recognition, and human-set objectives — without technical jargon.", "For one AI use case, explain why the risk arose from the way the system was designed or deployed — not just what the risk is."], "instructions": {"lesson": "Open with the two working concepts (AI, LLM) before the landscape survey. Keep to 2–4 minutes. Ground both in business examples immediately, then proceed to the landscape survey."}, "models": {"luna": {"output": "# Topics\n\n- AI and LLMs in business\n- Current business uses of AI and their effects on people\n- How AI systems produce outputs\n- Benefits, risks, and design or deployment choices\n\n# Scope Envelope\n\n**Allowed:**\n\n- Plain-language definitions of AI and LLMs, grounded in business examples\n- At least five current business uses of AI, with one benefit and one risk for each\n- Training data, pattern recognition, and human-set objectives as basic elements of how AI produces outputs\n- Explaining how a risk can result from an AI system’s design or deployment\n\n
