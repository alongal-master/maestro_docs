tch your target audience, your key competitor gap, your CVP/positioning direction, and your responsible-marketing constraints—at the same time.\n\n## Things to Avoid\n- Over-scaffolding: don’t let the work become template-filling. The goal is reconciliation—choosing what to keep and what to revise.\n- Evidence slippage: mixing assumptions with evidence without labeling which is which.\n- Responsible-marketing as an afterthought: if privacy/consent/accessibility/fairness/A.I. risks exist, they must shape the opportunity or its execution constraints in your recommendation.\n- Reinforcing too-early: do not “re-teach” segmentation/targeting, competitor research, persona/journey, positioning/CVP, or responsible marketing. Instead, use them to resolve toward one coherent output.\n- Introducing new measurement/channel frameworks.\n\n## Student teaching preferences summary\n- No stated preferences.\n- Based on prior performance, the student benefits from:\n  - concise, structured outputs (tables/checklists)\n  - evidence tagging (clearly labeled assumptions vs observations/data)\n  - explicit reconciliation requirements (trade-offs, ranking, conflict resolution)\n- Likely adjustment needed for this challenge:\n  - their prior work is strong in individual components, but may leave artifacts partially unverified (many persona/journey details are assumption-tagged) and may not compare alternatives with rubric-like clarity—so require “choose the best, based on evidence/constraints” rather than “sum everything.”\n\n## Teaching instructions\n- Present the task as a synthesis workflow: (1) collect the Unit 1 artifacts, (2) reconcile disagreements into a single decision, (3) write the Audience Opportunity Table, (4) produce a final concise opportunity statement that is consistent with that table.\n- Before writing: require the learner to reconcile conflicts by explicitly answering, for each conflict:\n  - Which artifact wins, and why (evidence strength and/or constraint fit)?\n  - What is removed or revised (and what assumption becomes a constrained claim)?\n- Guide the learner to fill the Audience Opportunity Table as a “table-like artifact” (not paragraphs), ensuring each evidence note is short and tagged (e.g., observation vs digital data vs secondary research) and each constraint is actionable.\n- Ensure alignment checks as part of the reconciliation:\n  - Target audience (from segmentation/targeting) ↔ persona/journey (who experiences which moments/pains)\n  - Competitor gap (from competitor research) ↔ positioning/CVP differentiation (why your offer wins)\n  - Responsible marketing checklist ↔ constraints column in the opportunity foundation (what you must not do / must do)\n- Conclude by asking the learner to output only:\n  - the Audience Opportunity Table (completed)\n  - the final concise opportunity statement (derived directly from the table)\n  - 2–3 bullets of “key assumptions to validate next” (only if any remain evidence gaps)\n- If the learner produces contradictions, prompt a targeted revision loop:\n  - identify the specific mismatch (e.g., target audience vs CVP, or competitor gap vs positioning claim)\n  - require one sentence rewrite + one evidence-note update in the table to restore coherence.", "scores": {"section_structure": 1, "golden_similarity": 0.8976017977372891, "instruction_adherence": 1, "golden_agreement": 0.78, "pairwise_preference": 0.25, "retrieval_grounding": 0.85}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan directly implements the lesson-specific instructions: it requires the learner to reconcile prior artifacts and resolve conflicts before the tutor polishes/summarizes (reducing over-scaffolding), renders the Audience Opportunity Table as an actual table-like artifact with short tagged evidence notes, forbids introducing new frameworks, and keeps focus on synthesis. It also honors course-level guidance by maintaining the RPCMO + Objective→Audience→Evidence→Constraints→Decision lens and keeping writing concise (bullets, tables, checklists).", "golden_agreement": "The candidate matches the reference on nearly all substantive decisions: same topics, mastery outcomes, RPCMO + O-A-E-C-D framing, evidence tagging, concise table-based outputs, avoiding over-scaffolding, and excluding all Unit 2-5/channel/measurement content. However, it contradicts the reference by declaring no new concepts (the reference explicitly introduces the Audience Opportunity Table as new, including its column structure), and its forbidden list is less specific, omitting explicit exclusions like PESO, messaging ladders, and analytics metrics.", "pairwise_preference": "Both orders agreed (0.25 / 0.25). Plan B correctly identifies the Audience Opportunity Table as a new concept (no retrieved summary shows the student has seen it) and defines its structure, while Plan A claims no new concepts and leaves the table undefined. Plan B also has a more explicit, complete forbidden-topics list; both otherwise cover the outcomes, ground personalization, and keep instructions at similar high-level granularity.", "retrieval_grounding": "Nearly all claims trace to the summaries: completed Unit 1 lessons (segmentation/targeting, competitor research, positioning/CVP, persona/journey, responsible marketing, RPCMO, O-A-E-C-D), assumption-tagged persona details, and weak rubric-based comparison of alternatives are all supported. However, the plan asserts no new concepts are introduced while centering the 'Audience Opportunity Table,' which the summaries never show the student having used, an implicit unsupported claim of prior familiarity."}}, "haiku": {"output": "# Lesson Plan: Challenge: Build Your Marketing Research Foundation\n\n## Topics\n\n- Synthesis of Unit 1 research foundations (segmentation, targeting, positioning, research, personas, journeys, responsible marketing)\n- Reconciliation of prior marketing artifacts into a coherent recommendation\n- Audience Opportunity Table construction and evidence-based opportunity statement development\n- Strategic decision-making using the O-A-E-C-D lens to integrate all Unit 1 work\n\n---\n\n## Scope Envelope\n\n**Allowed:**\n- All Unit 1 concepts: segmentation/targeting, CVP/positioning, market/competitor research, personas, customer journeys, responsible marketing, RPCMO workflow, O-A-E-C-D decision lens, and 4Ps\n- Student's own prior lesson artifacts (segmentation rubrics, CVP statements, competitor matrices, persona/journey maps, responsible-marketing checklists)\n- Evidence-tagging practices ([O]bservation, [D]igital data, [A]ssumption, [S]urvey, [I]nterview) from persona lessons\n- Audience Opportunity Table as a structured, rendered artifact with concise evidence notes\n- Origin–Evidence–Bias framework for evaluating research quality\n\n**Forbidden:**\n- PESO channels, channel strategy, or campaign planning (Unit 2)\n- Campaign messaging, content strategy, or landing-page conversion (Unit 3)\n- KPIs, analytics, funnel metrics, A/B testing, or optimization (Unit 4)\n- Capstone frameworks or multi-phase roadmaps (Unit 5)\n- Any new strategic frameworks beyond Unit 1 scope\n\n---\n\n## Mastery Outcomes\n\n- **Synthesize Unit 1 work into a research-backed audience opportunity foundation.**\n- **Reconcile prior segmentation, targeting, research, competitor, positioning, persona, journey, and responsible-marketing artifacts into one coherent recommendation.**\n- **Use an Audience Opportunity Table to support a concise, evidence-based opportunity statement.**\n\n---\n\n## New Concepts Introduced\n\n- **Audience Opportunity Table** — A rendered, structured artifact that consolidates evidence from all Unit 1 research sources (segmentation rubric scores, CVP, competitor analysis, persona/journey insights, responsible-marketing risk flags) into a single table with concise evidence notes supporting a strategic recommendation.\n- **Research-backed opportunity statement** — A concise, one-to-three-sentence claim that names the target audience, their unmet need or market gap, the proposed value, and the differentiation, anchored to specific evidence from market research, competitor analysis, and persona/journey data.\n- **Evidence reconciliation workflow** — The process of reviewing all prior Unit 1 artifacts, identifying alignment or tension among them, and making explicit tradeoff choices before finalizing the recommendation.\n\n---\n\n## General Remarks / Tips\n\n- **Reduce tutor scaffolding.** The student must reconcile their own prior work and assumptions before the tutor polishes or summarizes. Ask clarifying questions (\"What does your segmentation rubric say about accessibility for this segment?\") rather than filling in blanks.\n- **Keep writing concise and practice-oriented.** The Audience Opportunity Table should use bullets, short phrases, and evidence citations—not prose paragraphs. The opportunity statement should be 2–3 sentences maximum.\n- **Render the table as an actual artifact.** Use a table format (markdown or visual) with clear column headers and evidence tags. This makes the artifact usable for downstream marketing decisions.\n- **Focus on synthesis over novelty.** The student is not introducing new research or frameworks—they are reconciling and integrating what they have already learned. Their job is to connect dots, not to do new work.\n- **Proceed without explicit learner acknowledgment.** Move into activities as soon the setup is clear. Pause only when substantive input is required (e.g., when they must select a final target segment or defend a tradeoff).\n- **Use the framework map.** Keep RPCMO, O-A-E-C-D, segmentation/targeting, CVP, research evidence, personas/journeys, and responsible marketing visible as one integrated system, not isolated pieces.\n\n---\n\n## Things to Avoid\n\n- **Over-scaffolding or providing answers.** Do not fill in the Audience Opportunity Table for the student. Ask them to pull evidence from their own artifacts and explain the connections.\n- **Introducing new frameworks or Unit 2+ concepts.** Do not preview channel strategy, PESO roles, campaign messaging, or any analytics/optimization work.\n- **Treating frameworks as isolated acronyms.** Do not discuss CVP, segmentation, or personas without connecting them to the O-A-E-C-D lens and the broader RPCMO workflow.\n- **Allowing unsupported assumptions to pass.** If they claim a segment is a good fit or a competitor has a weakness, require them to cite the evidence (from segmentation rubric, persona/journey map, competitor matrix, or research data).\n- **Skipping the responsible-marketing review.** Remind them to apply the responsible-marketing checklist (privacy, consent, transparency, accessibility, fairness/ethics, responsible AI) to their proposed recommendation before finalizing.\n- **Lengthy reports or slide decks.** Keep all outputs short: bullets, tables, checklists, and brief annotations only.\n\n---\n\n## Student Teaching Preferences Summary\n\nNo specific learning preferences documented. Use intermediate-paced instruction with evidence-based reasoning, concrete examples, and structured templates to support the student's demonstrated comfort with frameworks, intermediate depth of application, and preference for actionable synthesis over abstract theory.\n\n---\n\n## Teaching Instructions\n\n**Framing & Setup**\n\nBegin by reminding the student of the Unit 1 framework map: RPCMO is the overall workflow; the O-A-E-C-D lens supports strategic choices inside that workflow; the 4Ps are decision levers; and segmentation/targeting, CVP, research evidence, personas/journeys, and responsible marketing progressively build the audience opportunity foundation. Their task today is to reconcile all these pieces into one coherent recommendation.\n\n**Activity Flow**\n\n1. **Audit their prior artifacts** — Ask them to gather and review their segmentation rubric, CVP statement, competitor matrix, persona/journey map, and responsible-marketing checklist from prior lessons. Do not allow them to start from scratch; they are synthesizing, not creating new work.\n\n2. **Identify alignment and tension** — Guide them to answer: Do all artifacts point to the same target audience and value proposition? Where do they agree? Where do they create tradeoffs (e.g., the most attractive segment is hard to reach, or the strongest positioning alienates a key competitor)? Ask them to articulate these tensions explicitly before resolving them.\n\n3. **Build the Audience Opportunity Table** — Have them structure a table with rows for:\n   - **Target Audience** (segment name, demographics, psychographics, behaviors)\n   - **Customer Need / Market Gap** (what the person wants; what competitors are missing)\n   - **Proposed Value / CVP** (the benefit and differentiation the student is offering)\n   - **Evidence** (citations to segmentation rubric, persona/journey, competitor matrix, research source)\n   - **Responsible Marketing Risk Flags** (any privacy, consent, accessibility, fairness, or AI concerns from the responsible-marketing checklist)\n   - **Constraints or Assumptions** (operational limits, research limitations, untested hypotheses)\n   \n   Columns should be narrow; evidence notes should be concise (1–2 lines max, with [O], [D], [A], [S], [I] tags where applicable).\n\n4. **Draft the opportunity statement** — Once the table is complete, have them write a 1–3 sentence statement that names the audience, their need, the proposed value, and the differentiation. Example: \"Working professionals who prioritize convenience and speed are underserved by traditional coffee shops with long lines and inconsistent wait times. BrewBuddy's mobile pre-ordering and real-time geofencing removes the waiting friction, enabling them to grab coffee in under 3 minutes while maintaining quality—a gap that competitors have not addressed.\"\n\n5. **Apply the O-A-E-C-D lens** — Before finalizing, ask them to confirm that:\n   - **Objective:** Is the business objective clear (e.g., acquire new customers, build market share, reduce friction for an underserved segment)?\n   - **Audience:** Is the target audience sharply defined using segmentation and targeting evidence?\n   - **Evidence:** Have they cited specific research, competitor gaps, and persona/journey insights?\n   - **Constraints:** Have they acknowledged budget, time, access, or research limitations?\n   - **Decision:** Is the final recommendation a single, actionable claim (not a list of tactics)?\n\n6. **Responsible-marketing checkpoint** — Have them review the responsible-marketing risk flags in the table. Ask: Do any of these risks require changes to the recommendation? For example, if the segment includes minors, does the communication plan need accessibility adjustments? If personalization relies on past-purchase data, do they have proper consent?\n\n**Tone & Pacing**\n\n- Move briskly through steps 1–2; pause during steps 3–6 when the student must make explicit choices or defend evidence.\n- Do not accept vague assertions. If they say \"the competitor is weak,\" ask \"which competitor matrix row supports that? What's the evidence?\"\n- Celebrate synthesis choices: \"You've connected the persona's journey friction at Arrival & Setup to the positioning of speed—that's a tight link.\"\n- If they struggle to integrate conflicting data, ask them to rank the evidence by confidence and recency, then make a conscious tradeoff choice.\n\n**Output Artifacts**\n\nBy the end of the lesson, the student should have:\n1. A completed Audience Opportunity Table (rendered as a visible table with evidence tags)\n2. A concise, evidence-backed opportunity statement (1–3 sentences)\n3. Notes on any tradeoffs made, constraints acknowledged, or responsible-marketing risks flagged\n\nKeep all materials concise, practice-oriented, and ready to hand off to Unit 2 (where they will use the audience and value proposition to select channels and build campaigns).", "scores": {"section_structure": 1, "golden_similarity": 0.8689970531770592, "instruction_adherence": 1, "retrieval_grounding": 1, "pairwise_preference": 0, "golden_agreement": 0.93}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan directly implements the lesson-specific directives: it renders the Audience Opportunity Table as an actual markdown table with concise evidence notes and tags, emphasizes reducing tutor over-scaffolding by requiring the learner to reconcile prior artifacts before polishing, and explicitly forbids introducing new frameworks while keeping the challenge focused on synthesis. It also maintains the integrated framework map (RPCMO, O-A-E-C-D, 4Ps) and enforces concise, practice-oriented outputs per course guidance.", "retrieval_grounding": "Every claim about the student traces to the summaries: prior artifacts (segmentation rubric, CVP statement, competitor matrix, persona/journey map with Arrival & Setup friction, responsible-marketing checklist), evidence tags [O][D][A][S][I], the O-A-E-C-D lens, RPCMO workflow, and 4Ps were all demonstrated in documented lessons. The preferences section appropriately notes no documented preferences and describes only supported intermediate-level framework comfort.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan B meets the eight-section format with a compliant scope envelope and keeps Teaching Instructions as brief high-level guidance, while Plan A's Teaching Instructions balloon into a forbidden step-by-step lesson script (numbered activity flow, sample opportunity statement text, tone/pacing scripts). Both cover the outcomes and ground personalisation, so the instruction violation is decisive.", "golden_agreement": "The candidate reproduces essentially all reference decisions: identical mastery outcomes, the Audience Opportunity Table as the sole new artifact, the same allowed/forbidden scope (no PESO, channels, analytics, capstone content), evidence tagging with assumption flagging, anti-over-scaffolding stance, and a matching teaching flow starting from the RPCMO/O-A-E-C-D map. Minor deviations: the opportunity statement is 1–3 sentences instead of one, an extra Origin–Evidence–Bias framework is listed, and the closing reflection on decision confidence is replaced by an output-artifacts summary."}}}}, {"id": "3b4b070d-92b5-464d-bdcc-a095beffceca", "course": "Operations management", "fingerprint": "e0028ae57e18", "production": "1. **Topics**\n   • Spotting cross-functional friction in a small-business setting  \n   • Naming the operational consequence of that friction  \n   • Crafting a resolution that makes the trade-off explicit, assigns KPIs, and clarifies decision rights  \n   • Practising the resolution through a role-play with the tutor acting as another function\n\n2. **Scope Envelope**\n   Allowed (all instruction may cover ONLY these):\n   1. Cross-functional friction scenarios (marketing, finance, customer-service vs. operations)  \n   2. Operational impact identification and plain-language explanation  \n   3. Trade-off framing on the five axes and KPI selection as evidence  \n   4. Decision-rights assignment (who decides, who is consulted / informed)\n\n   Forbidden (explicit list of out-of-scope topics for this lesson):\n   – Detailed process mapping or bottleneck analysis  \n   – Capacity or staffing calculations, utilization math, scheduling design  \n   – Inventory formulas, reorder points, or supplier lead-time math  \n   – Forecasting techniques or quantitative uncertainty modelling  \n   – Lean waste categories, root-cause tools, PDCA / continuous-improvement loops  \n   – Quality-design doctrines (Jidoka, built-in quality specifics)  \n   – AI-assisted decision workflows or any future capstone content  \n   – Any concepts from later Unit 5 lessons (communicating to non-ops audiences, handling pushback, capstone work)  \n   – Personal finance, marketing funnel tactics, physics “friction,” or behavioural-economics material unrelated to friction of functions\n\n3. **Mastery Outcomes**\n   • Identify the operational friction created when marketing, finance, or customer service makes a decision without operations input.  \n   • Recommend a cross-functional resolution that names the operational trade-off, the affected KPIs, and which function owns which decision right.\n\n4. **New Concepts Introduced**\n   • Simple Decision-Rights Grid: a lightweight A/C/I note (Accountable – Consulted – Informed) to anchor “who owns which call” inside the resolution statement.\n\n5. **General remarks / tips**\n   • Student already uses the sentence frame “Although our goal is …, we …, which pulls us toward ….” Leverage it to surface friction quickly.  \n   • They grasp the five trade-off axes (2026-08-08T13:08:42.811Z) and KPI syntax but still need practice pairing a primary KPI with a guard-rail KPI.  \n   • Provide numeric targets only if the learner volunteers numbers; focus on selecting the right metric first.  \n   • Prior lessons show an over-focus on customer-service concerns—add finance-vs-operations conflict examples to balance perspective.  \n   • Keep the scenario fresh (unit guidance) – use a brand-new small-business case, e.g., “SunnyTrail Meal-Prep”.  \n\n6. **Things to Avoid**\n   • Do NOT slip into capacity math, forecasting, root-cause deep dives, or quality-design jargon.  \n   • Avoid continuing any cafe / coffee-shop scenarios from Units 2–4.  \n   • No mention of upcoming pushback-handling or capstone requirements.  \n   • Do not reference the student’s marketing funnel or pricing lessons; stay on operations alignment.\n\n7. **Student teaching preferences summary**\n   No specific learning-preference data provided. Default to interactive questioning, concise explanations, and concrete small-business examples.\n\n8. **Teaching instructions**\n   • Open with a short, relatable business vignette (e.g., marketing launches a “2-for-1 Tuesday” promo without warning ops).  \n   • As the learner diagnoses friction, the tutor voices the non-ops stakeholder to create live tension.  \n   • Prompt the learner to:  \n     1) State the friction in the sentence frame,  \n     2) Name which trade-off axis is being pulled,  \n     3) Propose one primary KPI + one guard-rail KPI,  \n     4) Fill a one-line Decision-Rights Grid (A/C/I) clarifying ownership.  \n   • Iterate through at least two functions (marketing → ops, then finance → ops) to ensure transfer.  \n   • Close by having the learner write a single, plain-language resolution statement tying all elements together.", "lessonTitle": "Cross-functional friction and alignment", "unitTitle": "Leading and communicating operations", "masteryOutcomes": ["Identify the operational friction created when marketing, finance, or customer service makes a decision without operations input.", "Recommend a cross-functional resolution that names the operational trade-off, the affected KPIs, and which function owns which decision right."], "instructions": {"unit": "Throughout this unit, the tutor plays the role of a cross-functional team or a non-operations stakeholder so the learner practices reasoning and communicating in a realistic setting. No new conceptual material — only synthesis and the explicit move from analysis to adoption. Do NOT continue the Unit 2/3/4 scenarios here; Unit 5 is deliberate transfer, so the tutor sets up a fresh small-business case (it can be a new online/tech business or a traditional small business) and lets the learner re-apply the full toolkit cold."}, "models": {"luna": {"output": "## Topics\n\n- Cross-functional operational friction\n- Marketing, finance, and customer service alignment\n- Operational trade-offs and affected KPIs\n- Decision-right ownership\n\n## Scope Envelope\n\n**Allowed:**\n- Identifying how a marketing, finance, or customer service decision made without operations input creates operational friction.\n- Connecting cross-functional decisions to workflow, capacity, customer experience, cost, quality, responsiveness, or scalability consequences.\n- Naming the operational trade-off and affected KPIs.\n- Assigning clear decision rights to the appropriate functions.\n- Recommending a cross-functional resolution for a fresh small-business case.\n\n**Forbidden:**\n- Structuring an operational recommendation for a non-operations audience using a headline, evidence, and next step.\n- Translating bottleneck, capacity, utilization, KPI, or variability vocabulary into plain business language.\n- Handling stakeholder pushback or defending a position against a teammate’s counter-argument.\n- Identifying sources of resistance or strategies for building buy-in.\n- Capstone diagnosis of a fresh case, including end-to-end flow observation, bottleneck identification, capacity estimation, utilization calculation, or evidence-backed problem statements.\n- Designing a full improvement loop, including Plan–Do–Check–Act.\n- Selecting or documenting an AI-supported stress test.\n- Forecasting demand, calculating reorder points, analyzing supplier lead times, or planning inventory buffers.\n- Introducing new concepts from later lessons, even as previews or partial demonstrations.\n\n## Mastery Outcomes\n\n- Identify the operational friction created when marketing, finance, or customer service makes a decision without operations input.\n- Recommend a cross-functional resolution that names the operational trade-off, the affected KPIs, and which function owns which decision right.\n\n## New Concepts Introduced\n\n- **Cross-functional operational friction:** A mismatch created when one function changes an offer, target, cost constraint, or customer promise without checking whether the operating system can support it.\n- **Decision right:** Clear ownership of a particular decision, including which function decides and which functions provide operational input.\n- **Cross-functional resolution:** A coordinated response that preserves a shared business goal while explicitly acknowledging what the operation gains and sacrifices.\n- **KPI impact chain:** The connection between a functional decision, its operational consequence, and the measures likely to change.\n\nUse these concepts only as needed during the fresh case. Do not present them as an extended lecture; introduce each briefly when it becomes useful in analysis.\n\n## General remarks / tips\n\n- This lesson is a synthesis and transfer exercise, not a content-heavy lecture. The student already demonstrated high-confidence understanding of how operations connects with other functions and can use the friction frame: “Although our goal is ___, we ___, which pulls us toward ___.”\n- Use a fresh small-business case rather than continuing earlier coffee-shop, braiding, support, bakery, or other prior scenarios. A suitable case could be a small online subscription business, local meal-delivery service, repair shop, or appointment-based business.\n- Keep the case small enough to reason about without calculations. Include a decision made by marketing, finance, or customer service, an operations consequence, and at least two affected KPIs.\n- Role-play as the cross-functional team or non-operations stakeholder. Let the student discover the friction before offering labels or explanations.\n- Balance the functions. The student has previously tended to emphasize customer service, so include meaningful finance or marketing constraints and ask the student to account for all affected functions.\n- Encourage neutral, blame-free language. Frame the issue as a mismatch between decisions and system capabilities, not as an individual failure.\n- Prompt the student to identify:\n  - What decision was made?\n  - Which function made it?\n  - What operational condition was overlooked?\n  - What friction now appears in the workflow?\n  - Which KPIs are likely to move?\n  - What trade-off must be accepted?\n  - Which function should own each decision?\n- Reinforce the student’s existing knowledge of the five performance axes and KPI design when natural. The student is strong at naming axes and guardrails but benefits from independently stating the protected outcome and sacrificed outcome.\n- Require a concise recommendation using a structure such as: “We should ___ because ___. This protects ___ but sacrifices ___. We will watch ___ and ___. Function A owns ___; Function B owns ___; Operations owns ___.”\n- If using a closed question, specify whether it is single- or multi-select, list all answer choices, identify the correct answer, and instruct the teaching agent to use the closed-question widget.\n- Avoid numerical staffing or capacity calculations in this lesson; the student’s quantitative capacity depth is a known gap, but it is outside this lesson’s mastery outcomes.\n- Reinforcement reference: cross-functional mapping and friction framing were last practiced at **2026-08-04T22:49:13.741Z**. This is more than 24 hours before the current lesson timestamp **2026-08-27T12:34:36.707Z**, so brief reinforcement is permitted if naturally needed. KPI trade-off reasoning was last practiced at **2026-08-23T13:17:09.640Z** and may also be reinforced.\n\n## Things to Avoid\n\n- Do not continue or reuse the Unit 2, Unit 3, or Unit 4 scenarios.\n- Do not teach later Unit 5 topics such as non-operations presentation structure, plain-language translation practice, pushback handling, resistance management, or buy-in techniques.\n- Do not preview the next lesson.\n- Do not turn the lesson into a lecture on organizational design, RACI, conflict styles, or project management.\n- Do not introduce calculations, detailed capacity models, inventory formulas, supplier lead-time analysis, or forecasting.\n- Do not treat the function that notices the problem as automatically owning the decision.\n- Do not assign every decision to operations; distinguish operational input from business ownership.\n- Do not accept vague solutions such as “communicate better,” “hire more people,” or “work faster” without a named trade-off, KPI impact, and decision owner.\n- Do not blame employees or departments.\n- Do not overfocus on customer satisfaction while ignoring cost, quality, responsiveness, or scalability.\n- Do not reinforce a concept taught within the last two hours; no relevant concept falls within that interval.\n\n## Student teaching preferences summary\n\n- No specific learning preferences are recorded.\n- The student responds well to realistic small-business scenarios, structured sentence frames, concise explanations, and applied judgment questions.\n- Confidence is high for cross-functional mapping, friction identification, trade-off-axis recognition, and KPI selection.\n- Provide moderate scaffolding for independently stating the full trade-off and for balancing marketing, finance, and customer-service perspectives.\n- Use one fresh case, then vary the functional source of friction in a short follow-up to test transfer.\n\n## Teaching instructions\n\n- Set up a fresh small-business scenario and role-play a cross-functional team seeking the student’s recommendation.\n- Begin with the stakeholder’s decision and business goal, but do not label the operational friction immediately.\n- Ask the student to diagnose the mismatch using the previously learned friction frame and identify the operational consequences.\n- Prompt the student to name the relevant trade-off and select affected KPIs, preferably including one primary measure and one guardrail measure.\n- Ask the student to assign decision rights among operations and the involved business functions. Emphasize that functions may be consulted or provide constraints while one function owns each decision.\n- Have the student give a concise cross-functional resolution, then test the same reasoning with a brief second scenario involving a different function.\n- Give feedback by affirming correct causal reasoning, correcting only gaps in trade-off specificity or ownership, and requiring the student to restate the recommendation independently.\n- End with a short mastery check requiring all four elements: friction, resolution, trade-off/KPIs, and decision ownership.", "scores": {"section_structure": 1, "golden_similarity": 0.8949756668749125, "instruction_adherence": 0.95, "golden_agreement": 0.85, "retrieval_grounding": 0.97, "pairwise_preference": 0.25}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan sets up a fresh small-business case with tutor role-playing a cross-functional stakeholder, avoids reusing Units 2-4 scenarios, keeps to synthesis/transfer without new later-lesson concepts, balances functions, uses the required sentence frames, avoids calculations, and includes all four mastery elements plus a second transfer scenario—fully consistent with the instructions.", "golden_agreement": "The candidate matches nearly all reference decisions: same mastery outcomes, fresh small-business case, role-play as non-ops stakeholder, sentence-frame friction diagnosis, primary + guard-rail KPI, decision-rights assignment, iterating through a second function, balancing away from customer-service overfocus, and identical exclusions (no capacity math, forecasting, later Unit 5 content, or prior cafe scenarios). The main deviation is the new-concept choice: the reference introduces a lightweight A/C/I Decision-Rights Grid, while the candidate instead defines several other concepts and even cautions against RACI-style content, a mild contradiction.", "retrieval_grounding": "Every claim about the student traces to the summaries: high-confidence friction-frame and cross-functional mapping (2026-08-04 lesson), tendency to overemphasize customer service, quantitative capacity as a known gap, strength in axes/guardrail KPIs with scaffolding needed for full trade-off statements (2026-08-23 lesson), and accurate reinforcement timestamps. The claim that the student 'responds well' to scenarios and sentence frames is a mild inference but well grounded in demonstrated successful use of those formats.", "pairwise_preference": "Both orders agreed (0.25 / 0.25). Both plans satisfy the eight-section structure, cover the two outcomes, keep scope discipline, and ground personalisation in the summaries (friction frame, five axes, customer-service overemphasis). Plan B does the same job far more compactly, while Plan A pads with restated templates, scripted prompt lists, and quasi step-by-step detail that edges toward the forbidden level of specificity without adding teaching value."}}, "nano": {"output": "## Topics\n- Cross-functional operational friction (marketing/finance/customer service vs operations reality)\n- Cross-functional resolution: trade-off, affected KPIs, and decision rights\n- Translating operations logic into non-operations language to drive adoption\n\n## Scope Envelope\n- **Allowed:**\n  - Identify the operational friction created when marketing, finance, or customer service makes a decision without operations input.\n  - Recommend a cross-functional resolution that names the operational trade-off, the affected KPIs, and which function owns which decision right.\n  - Use previously learned frameworks (friction template / handshake mapping / trade-off axes / KPI thinking / decision ownership) for synthesis in a fresh small-business scenario.\n  - Practice communicating an operational recommendation in non-operations language with buy-in steps (within the same resolution task).\n- **Forbidden:** \n  - New operational concepts not explicitly required by the mastery outcomes (e.g., capacity math calculations, bottleneck estimation steps, PDCA mechanics beyond deciding the next loop at a high level, inventory reorder formulas).\n  - Previews or partial introductions of later-course content.\n  - Deep dives into unrelated organizational behavior topics (e.g., psychology theories, conflict styles taxonomy beyond naming who decides and what trade-off is being accepted).\n\n## Mastery Outcomes\n- Identify the operational friction created when marketing, finance, or customer service makes a decision without operations input.\n- Recommend a cross-functional resolution that names the operational trade-off, the affected KPIs, and which function owns which decision right.\n\n## New Concepts Introduced\n- None (lesson should focus on applying and synthesizing existing frameworks to a new case, specifically to produce the required friction diagnosis + resolution with decision rights and KPIs).\n\n## General remarks / tips\n- Treat the tutor as a “cross-functional stakeholder” (marketing/finance/customer service) who makes a tempting but operationally risky call; the learner’s job is to correct it using the two mastery outcomes.\n- Default to blame-free, system-centered language: symptom → KPI impact → decision rights → trade-off you’re willing to accept.\n- Keep the learner’s output structured: **(1) friction**, **(2) operational trade-off**, **(3) KPIs**, **(4) decision ownership**.\n\n## Things to Avoid\n- Avoid introducing any new quantitative planning methods (e.g., calculating staffing headcount, utilization, reorder points) unless the learner already brings them up.\n- Avoid “just improve communication” as a resolution; the resolution must name a concrete operational trade-off, specific KPIs, and who owns which decision right.\n- Avoid generalities like “customer experience” without at least one named KPI (even a simple one like on-time completion rate, rebook rate, complaint rate).\n- Avoid RACI ambiguity: insist on “exactly one A” for the key decision, while other functions can be consulted/informed.\n\n## Student teaching preferences summary\n- No stated preferences; pace should be guided by observed performance gaps:\n  - Strong at conceptual friction-spotting and mapping operations ↔ other functions.\n  - Needs more practice articulating the **quantified KPI impact** and **explicit decision rights** under conflicting inputs.\n  - Likely benefits from strict templates and structured answers over open-ended free-form reasoning.\n- Reinforce using the friction template and handshake mapping the student already performs well, but push for stronger KPI specificity and explicit “who decides” wording.\n\n## Teaching instructions\n- Use a fresh small-business case (new from prior unit scenarios) and role-play three cross-functional pushes across multiple short rounds:\n  1. **Marketing push:** a promotion/offer promises speed or availability that operations can’t reliably deliver.\n  2. **Finance push:** a cost-cutting budget decision removes capacity, buffers, or tools operations needs.\n  3. **Customer service push:** a policy change increases exceptions/handholds that operational teams can’t scale cleanly.\n- For each round, require the learner to produce the two deliverables:\n  - **Friction diagnosis (1–2 sentences):** identify the mismatch and the operational consequence (the “pulls us toward” part).\n  - **Cross-functional resolution (bulleted structure):**  \n    - **Trade-off position:** what operations will prioritize and what it must sacrifice (use the idea of trade-off axes in plain language).  \n    - **Affected KPIs:** name 2–3 KPIs that will move, with a clear “this will go up/down because…” causal statement.  \n    - **Decision rights:** name which function is **Accountable** (owns the final call) and who should be **Consulted/Informed** for justification.\n- Include one “pushback” moment per round where the tutor challenges the learner’s choice (e.g., “Marketing says we’ll lose revenue if we don’t promise it,” or “Finance says KPIs don’t matter—cut costs now”), and have the learner defend by repeating: trade-off + KPIs + decision ownership.\n- End with a capstone micro-output: have the learner write a single cross-functional message (headline + friction + trade-off + evidence/KPIs + next step + who decides) that a non-operations leader would understand and act on.", "scores": {"section_structure": 1, "golden_similarity": 0.921807938824174, "instruction_adherence": 1, "retrieval_grounding": 0.97, "golden_agreement": 0.6, "pairwise_preference": 0}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan faithfully implements the unit directives: tutor role-plays cross-functional stakeholders, uses a fresh small-business case distinct from prior units, focuses on synthesis with no new concepts, and explicitly forbids new operational math and previews. It also honors lesson-specific guidance on structured deliverables, KPI specificity, single-Accountable decision rights, pushback rounds, and the capstone message.", "retrieval_grounding": "All claims about the student trace to the summaries: friction template and handshake mapping mastery, KPI thinking, RACI/decision ownership exposure, gaps in quantified KPI impact and conflicting-input judgment, and reliance on scaffolding/templates are all documented. The only slightly inferential claim ('likely benefits from strict templates over free-form reasoning') is hedged and reasonably grounded in evidence of the student needing scaffolds for open-ended statements.", "golden_agreement": "The candidate matches the core mastery outcomes, fresh small-business scenario, role-play with tutor as stakeholder, iteration across marketing/finance/customer-service frictions, and the A/C/I decision-rights structure. However, it contradicts the reference by pulling in later-lesson content the reference explicitly forbids (translating to non-ops audiences with a closing cross-functional message, and pushback-handling rounds), and omits leveraging the student's sentence frame, the primary + guard-rail KPI pairing focus, and avoiding prior cafe scenarios explicitly.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan B keeps scope discipline: its forbidden list is explicit and complete, and it deliberately excludes later Unit 5 content (translation for non-ops audiences, pushback handling), while Plan A explicitly builds in 'communicating in non-operations language,' stakeholder-pushback rounds, and a capstone-style message — all previews of upcoming lessons — and its teaching instructions drift into the forbidden step-by-step detail. Both cover the outcomes and ground personalisation, but B's tighter envelope and higher-level instructions would visibly change how the lesson stays in bounds."}}, "haiku": {"output": "# Lesson Plan: Cross-functional Friction and Alignment\n\n## Topics\n\n- Identifying operational friction when marketing, finance, or customer service makes decisions without operations input\n- Mapping the operational consequences of cross-functional decisions\n- Recommending resolutions that name the trade-off, affected KPIs, and decision rights\n- Applying cross-functional reasoning to a fresh small-business case\n- Translating operational thinking for non-operations stakeholders\n\n---\n\n## Scope Envelope\n\n**Allowed:**\n- Cross-functional decision-making frameworks and friction identification\n- Operations-to-marketing, finance, and customer service handshakes\n- Trade-off articulation using the five performance axes (efficiency, quality, responsiveness, customer experience, scalability)\n- KPI identification and alignment across functions\n- Small-business case analysis and stakeholder role-playing\n\n**Forbidden:**\n- Any content from Unit 4 (Improving the system) lessons: variability analysis, quality-design methodologies, lean/waste concepts, root-cause analysis, or PDCA cycles — these belong to future lessons\n- Detailed financial modeling, cost accounting, or procurement processes beyond basic trade-off language\n- HR strategy, recruitment pipelines, or talent-management systems beyond the operational handshake\n- Comprehensive marketing strategy or demand-generation channels beyond operational capacity preparation\n- Customer-service staffing models or ticket-triage systems (unless directly tied to operational friction)\n- AI tools or decision co-pilot workflows from later lessons\n\n---\n\n## Mastery Outcomes\n\n- Identify the operational friction created when marketing, finance, or customer service makes a decision without operations input.\n- Recommend a cross-functional resolution that names the operational trade-off, the affected KPIs, and which function owns which decision right.\n\n---\n\n## New Concepts Introduced\n\n**Decision Rights & Accountability in Cross-Functional Contexts**\n- Definition: Clarifying which function (operations, marketing, finance, or customer service) owns the final call on a decision that affects multiple areas.\n- Connection to prior learning: Builds on RACI and management-lever concepts from earlier courses; here applied specifically to operational decisions.\n- Why it matters: Without clear decision rights, functions pull operations in conflicting directions, creating friction and operational failure.\n\n**The Operational Trade-off Statement**\n- Structure: \"By choosing [decision], we [gain X KPI outcome], but we sacrifice [Y KPI on a different axis].\"\n- Connection to prior learning: The student has already learned the five trade-off axes (efficiency, quality, responsiveness, customer experience, scalability) and poison KPIs; this lesson anchors trade-offs explicitly to cross-functional decisions.\n- Why it matters: Makes visible the hidden cost of a function's decision so all parties can negotiate deliberately instead of discovering friction later.\n\n**Cross-Functional Friction Mapping**\n- Definition: Identifying the moment when one function's decision (e.g., a marketing promotion, a finance constraint, a customer service promise) creates operational strain, capacity issues, or unachievable commitments.\n- Pattern: Marketing promises capacity operations cannot deliver → long lines, lost customers. Finance caps staffing spending → reduced ability to absorb demand spikes. Customer service commits to a service level → operations must redesign workflow.\n- Connection to prior learning: Student has already practiced identifying friction in \"Operations and other functions\" (2026-08-04); this lesson deepens it by adding explicit decision-rights and trade-off language.\n- Why it matters: Naming friction clearly is the first step to resolving it rather than letting it fester as blame or workarounds.\n\n---\n\n## General Remarks / Tips\n\n### Reinforcement (if needed)\nThe student has **strong prior knowledge** in this domain:\n- **Cross-functional handshake mapping** (intermediate, high confidence as of 2026-08-04T22:49:13.741Z): They can articulate how operations interfaces with marketing (capacity prep), finance (staffing limits), HR (workflow design), and customer service (feedback loops).\n- **Friction spotting** (intermediate, high confidence): They apply the sentence frame \"Although our goal is ___, we ___, which pulls us toward ___\" accurately and can identify operational consequences.\n- **Five trade-off axes** (intermediate, high confidence as of 2026-08-08T13:08:42.811Z): They can name all five axes and explain why they cannot all be maximized at once.\n\n**Do not re-teach these concepts.** Instead, assume mastery and move directly into the synthesis: **applying these tools to identify friction in a fresh small-business case and negotiating a resolution as a cross-functional team.**\n\n### Knowledge Gaps to Watch For\n1. **Quantitative depth on trade-offs**: The student speaks conceptually (\"we prepare capacity,\" \"we adjust staffing\") but has not yet calculated head-count, inventory, or cost trade-offs. If friction requires numeric justification, scaffold gently by asking \"What number would convince finance?\" or \"What does the capacity math actually say?\"\n2. **Overemphasis on customer service as the driver**: The student may default to customer-facing outcomes (satisfaction, loyalty) as the primary measure of success. During cross-functional debate, remind them that finance and marketing have legitimate constraints too.\n3. **Decision-rights clarity under pressure**: The student understands RACI conceptually but has not yet negotiated decision ownership in a contentious scenario. Be patient and explicit when role-playing tension.\n\n### Learning Preferences\nNo explicit preferences provided. Assume the student learns best through:\n- **Concrete case work** (they have consistently applied frameworks to small-business examples across all prior lessons).\n- **Role-playing and debate** (per unit instructions: the tutor plays the role of other functions to let the learner practice reasoning and communicating).\n- **Sentence-frame anchors** (the friction-spotting template and trade-off statement are already internalized).\n\n---\n\n## Things to Avoid\n\n1. **Do not introduce new operational concepts** (e.g., lean waste, root-cause analysis, PDCA, quality-design methodology). These belong to Unit 4 and will confuse the synthesis goal of this unit.\n2. **Do not use scenarios from Units 2, 3, or 4**. Per the unit instructions, this is \"deliberate transfer\"—set up a **fresh small-business case** that the student must analyze cold, applying the full toolkit without relying on prior case familiarity.\n3. **Do not solve the friction for the student**. The student must identify it, articulate the trade-off, and recommend the resolution. Your role as cross-functional stakeholder is to push back, ask hard questions, and test their reasoning.\n4. **Do not skip the decision-rights conversation**. Naming \"operations owns this call\" or \"marketing owns this call\" is as important as naming the trade-off. Without clarity, the friction will recur.\n5. **Do not allow vague KPI language**. Phrases like \"improve customer satisfaction\" or \"reduce costs\" are not sufficient. Push for metric + target + time frame, even if the student struggles (this is where they have a gap).\n6. **Do not introduce AI decision co-pilot workflows or stress-testing**. That content belongs to Unit 3 and later lessons.\n\n---\n\n## Student Teaching Preferences Summary\n\nNo specific learning preferences documented. Proceed with:\n- **Case-based reasoning**: Frame all concepts through a small-business example.\n- **Dialogue and debate**: The tutor assumes a cross-functional role to let the student practice persuasion and defense.\n- **Sentence-frame anchors**: Reinforce the friction-spotting and trade-off templates as scaffolds.\n- **Clarity on decision ownership**: Make RACI/decision rights explicit in every resolution discussion.\n\n---\n\n## Teaching Instructions\n\n### Core Framing\nThis lesson is **synthesis and adoption practice, not new conceptual material**. The student has learned all the pieces (cross-functional handshakes, friction spotting, trade-off axes, KPIs) in prior lessons. Your job is to orchestrate their application in a **realistic cross-functional setting where the student must reason and persuade, not just analyze**.\n\n### Structure of the Lesson\n\n**1. Set the Stage: Fresh Small-Business Case**\n- Introduce a new small business (not from Units 2–4). Examples:\n  - A local meal-prep subscription service, an online tutoring platform, a pop-up event-planning business, a mobile pet-grooming service, a regional bakery expanding to retail.\n  - The case should have 3–4 operational touchpoints where decisions from marketing, finance, or customer service create visible friction.\n- Do **not** provide the friction as a leading question. Let the student discover it through questioning and observation.\n\n**2. Student Diagnoses the Friction (Mastery Outcome 1)**\n- Ask: \"Walk me through how this business operates—inputs, transformation, outputs. Now, where do you see a moment where one function's decision is pulling operations in a direction it can't sustain?\"\n- Listen for:\n  - Correct identification of a real friction point (marketing promises, finance constraint, customer service commitment).\n  - Use of neutral, process-focused language (not blame).\n  - Reference to a visible operational consequence (wait time, capacity strain, missed commitments, quality slip).\n- If the student struggles, ask scaffolding questions:\n  - \"What did marketing promise? Can operations deliver that every day?\"\n  - \"What limits does finance impose? How does that affect staffing?\"\n  - \"What has customer service committed to? Does operations have the workflow to handle it?\"\n\n**3. Tutor Plays Cross-Functional Stakeholder to Create Realistic Tension**\n- Once the student has named the friction, assume the role of the function that created it (e.g., the marketing lead, the finance controller, the customer service manager).\n- Defend that function's decision using realistic business logic:\n  - Marketing: \"We need to drive growth. The promotion is how we get new customers.\"\n  - Finance: \"We have a budget constraint. We can't hire more staff without cost justification.\"\n  - Customer service: \"Customers expect this service level. If we don't promise it, we lose deals.\"\n- Push back on the student's initial diagnosis:\n  - \"But operations knew about this promotion when we planned it—why is it a surprise now?\"\n  - \"If we don't cap staffing costs, our margins disappear. What would you cut instead?\"\n  - \"Our competitors offer same-day turnaround. If we slow down, we lose business.\"\n\n**4. Student Recommends a Cross-Functional Resolution (Mastery Outcome 2)**\n- The student must produce a **three-part resolution**:\n  1. **Name the operational trade-off**: Using the sentence frame, \"By choosing [option], we [gain X KPI], but we sacrifice [Y KPI on different axis].\" Example: \"By accepting the marketing promotion at the proposed volume, we prioritize responsiveness and customer acquisition, but we sacrifice quality and first-time-right delivery because the team will be under-resourced.\"\n  2. **Name the affected KPIs**: Which metrics would reveal if the trade-off is working? Example: \"We'll monitor new-customer acquisition rate (lead KPI for growth) and defect rate / rework (guardrail KPI for quality).\"\n  3. **Clarify decision rights**: Who owns the final call? Operations, marketing, finance, or a joint decision? Example: \"Operations owns the service-level commit and the staffing model. Marketing owns the promotion volume, but it must be approved by operations if it exceeds [capacity threshold].\"\n\n### Pedagogy & Scaffolding\n\n**When the student gets stuck on the trade-off:**\n- Ask: \"If we do what marketing wants, what happens to our ability to deliver quality / speed / cost?\"\n- Offer a choice: \"Are we trading off efficiency for customer experience here, or quality for responsiveness?\"\n- Do not name the trade-off yourself; let them complete the sentence frame with your questions.\n\n**When the student avoids naming the sacrifice:**\n- Interrupt gently: \"You said we gain faster response times. What do we give up?\"\n- If they say \"nothing,\" press: \"Really? No trade-off at all? Then why is there friction?\"\n\n**When the student is vague on KPIs:**\n- Ask: \"How would you measure whether this trade-off is working? What would you look at in two weeks?\"\n- Push for metric + target: \"Instead of 'improve satisfaction,' what's the actual number? What's the baseline, what's the target, by when?\"\n\n**When the student struggles with decision rights:**\n- Ask: \"If marketing and operations disagree on the promotion volume, who decides—and how?\"\n- Offer RACI framing if needed: \"Who is Accountable for the service commitment? Who is Consulted when a new promotion is launched?\"\n\n### Closing & Reflection\n\nOnce the student has articulated a defended resolution:\n- **Reflect on the cross-functional conversation itself**: \"Was it easier or harder to negotiate this with someone playing the other role? What surprised you?\"\n- **Name the pattern**: \"This is what cross-functional alignment looks like. The goal isn't for marketing or finance to disappear—it's for operations to be in the room early and to own the service-level decision.\"\n- **Bridge to adoption**: \"In the capstone lessons ahead, you'll communicate this kind of recommendation to a leadership team. You've just practiced the hardest part: reasoning through the friction with the functions that created it.\"\n\n### Unit-Level Note\nPer the unit instructions, you are playing the role of a cross-functional team or stakeholder to let the learner practice reasoning and communicating in a realistic setting. Do **not** revert to teaching mode or explaining what the \"right answer\" is. Stay in role, push back honestly, and let the student convince you that their resolution is sound.\n\n---", "scores": {"section_structure": 1, "golden_similarity": 0.8400762390020906, "instruction_adherence": 1, "pairwise_preference": 0, "golden_agreement": 0.7, "retrieval_grounding": 0.95}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan faithfully implements every unit instruction: the tutor role-plays cross-functional stakeholders, introduces a fresh small-business case for deliberate cold transfer explicitly avoiding Units 2-4 scenarios, and stays in synthesis/adoption mode with no new conceptual material (it reframes prior tools rather than teaching new ones). Forbidden content (Unit 4 methods, AI co-pilots) is explicitly excluded.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A's Teaching Instructions are a full step-by-step lesson script with staged phases, sample dialogue, and scripted pushback lines — exactly the detailed generation the instructions forbid — while Plan B stays high-level, covers both outcomes, grounds personalisation in the summaries, and provides a tighter, more explicit forbidden-topics list.", "golden_agreement": "The candidate matches most core decisions—identical mastery outcomes, fresh small-business case, role-play tension, sentence frame, decision-rights (RACI/A-C-I), guard-rail KPIs, finance-balance tip, and the same forbidden topics (lean/RCA/PDCA, AI workflows, prior-unit scenarios). However, it contradicts the reference by pushing numeric targets (reference says only if learner volunteers), explicitly bridging to the capstone (reference forbids mentioning it), and including 'translating for non-operations stakeholders' which the reference places out of scope.", "retrieval_grounding": "Nearly all claims about the student trace directly to the summaries: cross-functional handshake mapping, friction-spotting template use, five trade-off axes with dates, poison KPIs, quantitative gaps, customer-service overemphasis, RACI familiarity, and vague-KPI struggles are all documented, and the plan correctly notes no explicit learning preferences exist (labeling inferred ones as assumptions). The only slight stretch is calling the trade-off statement 'already internalized' when a recent summary showed the student needed substantial scaffolding to formulate a defended trade-off statement."}}}}, {"id": "692ffbb8-8760-4b4d-ba6a-1a7c40668847", "course": "Business ethics & AI governance", "fingerprint": "e0028ae57e18", "production": "1. **Topics**\n   • HireView AI launch ethical analysis  \n   • Trade-off articulation & stakeholder impacts  \n   • Applying ONE chosen ethical framework  \n   • AI-ethics checklist focus (bias, fairness, transparency, accountability, privacy)  \n   • EEOC disparate-impact risk screening  \n\n2. **Scope Envelope**  \n   Allowed (2–5 items only):  \n   1. Formulating the single-sentence core ethical issue, one key trade-off, and three main stakeholders with their respective gains/losses.  \n   2. Selecting and applying one ethical framework (consequentialism, deontology, virtue ethics OR stakeholder theory) to the launch decision.  \n   3. Diagnosing the two most critical AI-ethics components at risk (choose from bias, fairness, transparency, accountability, privacy) and stating what is going wrong with each.  \n   4. Giving a plain-language EEOC disparate-impact verdict (Yes/No), naming the protected group at risk, and justifying the call.  \n\n   Forbidden (everything outside the items above):  \n   • Using more than one ethical framework or comparing multiple frameworks.  \n   • Performing the full ethical-evaluation workflow or governance analysis (RACI, Three Lines of Defense, board oversight, monitoring plans).  \n   • Introducing new regulatory regimes (EU AI Act, FTC deception tests, HIPAA, GDPR) or quantitative disparate-impact formulas (4/5ths rule, statistical parity math).  \n   • Technical model-engineering details (re-training, feature selection, algorithmic auditing methods).  \n   • Future lesson content (final recommendation writing, whistle-blowing strategy, professional identity reflection).  \n   • Unrelated cognitive-bias theory, detailed privacy-law doctrine, or quantitative fairness metrics.  \n\n3. **Mastery Outcomes**  \n   – State the core ethical issue in one sentence, name one key trade-off and what is gained and lost on each side, and identify the three most important stakeholders and what each stands to gain or lose.  \n   – Select one ethical framework and apply it to the launch decision; identify the two most significant AI ethics components at risk (from: bias, fairness, transparency, accountability, privacy) and explain specifically what is going wrong with each.  \n   – Assess whether the described practices create EEOC disparate impact risk — state yes or no, identify which group is at risk, and justify the assessment in plain terms.  \n\n4. **New Concepts Introduced**  \n   None – lesson consolidates previously learned tools under stricter, time-boxed constraints.  \n\n5. **General remarks / tips**  \n   • Leverage the student’s strong history with concise tables: have them capture gains/losses and stakeholder impacts in a compact two-column or four-column grid.  \n   • Encourage them to slow down when choosing the single framework; remind them of prior difficulty defaulting to consequentialism—prompt a deliberate choice that best highlights the moral feature they think dominates.  \n   • When diagnosing bias or fairness, cue them to recall the three bias entry points and the equal-treatment vs equal-outcomes fairness definitions they already know.  \n   • For the disparate-impact call, remind them of the iTutor Group precedent to anchor their reasoning in a familiar case.  \n   • Keep time pressure realistic: this case study simulates a “meeting in 30 minutes” prep—emphasize clarity over completeness.  \n\n6. **Things to Avoid**  \n   • Do NOT let the student slip into multi-framework comparisons or a full workflow checklist; that violates the lesson’s constrained output requirement.  \n   • Avoid diving into model-fix proposals or governance structures—those belong to later lessons.  \n   • Do not pre-teach statistical impact-ratio calculations or EU/FTC regulatory nuances.  \n   • Steer clear of abstract debates (e.g., virtue vs duty absolutism) that distract from delivering the six required outputs.  \n\n7. **Student teaching preferences summary**  \n   – No stated preferences.  \n   – Learner performs well with structured templates and plain-language summaries; brief tables and stepwise prompts boost clarity and confidence.  \n\n8. **Teaching instructions**  \n   • Begin by restating the HireView scenario facts to ground the discussion.  \n   • Guide the student to draft the single-sentence core ethical issue first, then immediately map one trade-off and three stakeholders (use a quick table).  \n   • Prompt the student to choose the most fitting framework (ask “Which moral feature jumps out?”) and apply it in 2–3 concise sentences.  \n   • Have them pick any two of the B-F-P-T-A components they think are most at risk, then articulate the specific failure mechanism for each.  \n   • Conclude with the EEOC disparate-impact verdict—remind them to name the protected group and keep the justification plain-spoken.  \n   • Throughout, reinforce clarity, brevity, and defensibility—each answer should stand alone as meeting the mastery outcome without extra context.", "lessonTitle": "Final case study, part 2", "unitTitle": "Professional judgment in practice", "masteryOutcomes": ["State the core ethical issue in one sentence, name one key trade-off and what is gained and lost on each side, and identify the three most important stakeholders and what each stands to gain or lose.", "Select one ethical framework and apply it to the launch decision; identify the two most significant AI ethics components at risk (from: bias, fairness, transparency, accountability, privacy) and explain specifically what is going wrong with each.", "Assess whether the described practices create EEOC disparate impact risk — state yes or no, identify which group is at risk, and justify the assessment in plain terms."], "instructions": {"unit": "Shared case study used across the three final case-study lessons (parts 1–3): HireView AI — the student is a Product Manager at HireView AI, which sells an AI video-interview platform that scores candidates ('hireability score') from speech, facial expressions, and word choice. Business context: clients report ~60% reduction in hiring time; a major national retail client wants full rollout next month; competitors already offer similar tools. Internal concerns: non-native accents score lower; candidates with disabilities (e.g. limited facial mobility) are flagged 'low engagement'; the model was trained on past 'successful hires' (historical bias risk). Stakeholder positions: Legal — 'no clear EEOC violation yet, but disparate-impact risk exists'; CEO — 'if we delay, we lose the client'; Data science lead — 'we can improve the model, but not before launch.' Use these facts only when the individual lesson's tutorInstructions reference the HireView case.", "lesson": "Scenario context (same nal judgment under business pressure\n\n---\n\n## Scope Envelope\n\n### Allowed\n- Stakeholder analysis, trade-off reasoning, and ethical frameworks (consequentialism, deontology, virtue ethics, stakeholder theory) from prior Units 1–2\n- AI ethics components: bias, fairness, transparency, accountability, privacy from Unit 3\n- EEOC enforcement and disparate-impact doctrine from Unit 4 (US AI regulatory mechanisms)\n- HireView case scenario facts and internal concerns (non-native accents, facial mobility, historical bias in training data, legal risk, CEO pressure, data science limitations)\n- Professional ethical communication and constrained analysis from Unit 5\n\n### Forbidden\n- EU AI Act (Unit 4 concept not yet applied to this case)\n- Whistleblowing procedures, board escalation, or multi-layered governance intervention (Unit 4 concepts; this lesson tests prioritization, not governance redesign)\n- Detailed remediation or fairness metrics beyond plain-language identification of what is \"going wrong\"\n- Expansion beyond the six required mastery outputs (full workflow analysis, all four frameworks, all five AI ethics components applied comprehensively)\n- Second-order labor/market impacts (Unit 3 concept; out of scope for this constrained case analysis)\n\n---\n\n## Mastery Outcomes\n\n1. **State the core ethical issue in one sentence**, name one key trade-off and what is gained and lost on each side, and identify the three most important stakeholders and what each stands to gain or lose.\n\n2. **Select one ethical framework and apply it to the launch decision**; identify the two most significant AI ethics components at risk (from: bias, fairness, transparency, accountability, privacy) and explain specifically what is going wrong with each.\n\n3. **Assess whether the described practices create EEOC disparate impact risk** — state yes or no, identify which group is at risk, and justify the assessment in plain terms.\n\n---\n\n## New Concepts Introduced\n\nNone. This lesson integrates and applies concepts from all four prior units without introducing new ethical frameworks, AI ethics terminology, or regulatory standards. The student will apply existing tools to a complex, time-pressured scenario that mirrors professional practice.\n\n---\n\n## General Remarks / Tips\n\n### Student Readiness\nThe student demonstrated **intermediate mastery** across all prerequisite skills in their prior lesson (Final case study, part 1, completed 2026-08-26T17:25:18.674Z):\n- Strong ethical issue spotting in plain language (fairness, transparency)\n- Solid stakeholder identification including low-power/high-vulnerability groups\n- Clear framing of business pressure and decision urgency\n- **Gap to address**: The student did not explicitly map power/voice/accountability or separate relational pressure (client relationship, leadership disappointment) from business/competitive pressure\n\n### Why This Structure Works\nThe lesson constrains scope intentionally:\n- **One framework only** (not all four) forces real prioritization, not checklist application\n- **Two AI ethics components only** (not all five) mirrors how professionals under time pressure must focus fire on the most serious risks\n- **One trade-off, three stakeholders** keeps analysis lean and defensible\n- **EEOC assessment** grounds the analysis in regulatory reality (unlike pure ethical reasoning)\n\nThis teaches **professional judgment**: students learn to work within constraints, defend choices, and accept that perfect comprehensive analysis is not always available or necessary.\n\n### Reinforcement Note\nThe student learned stakeholder mapping, trade-off analysis, and ethical frameworks across Units 1–2 more than 7 days ago (earliest: 2026-06-23; latest Unit 2 framework work: 2026-08-10). **No reinforcement is needed** — this lesson applies and integrates, not reteaches. The student's work in part 1 (yesterday) is fresh, so build directly on their issue spotting and stakeholder
