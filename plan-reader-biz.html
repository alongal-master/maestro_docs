<meta charset="utf-8">
<title>Business Lesson Plan Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-raised: #ffffff;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --border-strong: rgba(11, 11, 11, 0.18);
    --grid: #e1e0d9;

    --model-luna: #2a78d6;
    --model-nano: #eb6834;
    --model-haiku: #1baf7a;
    --prod: #52514e;

    --focus-ring: 3px solid #2a78d6;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-raised: #201f1d;
      --ink: #ffffff;
      --ink-secondary: #c3c2b7;
      --ink-muted: #8f8d86;
      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.18);
      --grid: #2c2c2a;

      --model-luna: #3987e5;
      --model-nano: #d95926;
      --model-haiku: #199e70;
      --prod: #c3c2b7;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-raised: #201f1d;
    --ink: #ffffff;
    --ink-secondary: #c3c2b7;
    --ink-muted: #8f8d86;
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --grid: #2c2c2a;

    --model-luna: #3987e5;
    --model-nano: #d95926;
    --model-haiku: #199e70;
    --prod: #c3c2b7;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  button:focus-visible,
  select:focus-visible,
  [tabindex]:focus-visible {
    outline: var(--focus-ring);
    outline-offset: 2px;
  }

  /* ---------- Top bar ---------- */

  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-raised);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-right: 4px;
  }

  .brand .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .brand .title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .lesson-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nav-btn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex: none;
  }

  .nav-btn:hover { background: var(--grid); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn:disabled:hover { background: var(--surface); }

  .lesson-select-wrap {
    position: relative;
    min-width: 260px;
    flex: 1 1 320px;
  }

  select#lessonSelect {
    width: 100%;
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 7px 30px 7px 12px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink);
  }

  .lesson-select-wrap::after {
    content: "";
    position: absolute;
    right: 12px;
    top: 50%;
    width: 7px;
    height: 7px;
    border-right: 1.5px solid var(--ink-muted);
    border-bottom: 1.5px solid var(--ink-muted);
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
  }

  .row-counter {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  .topbar-spacer { flex: 1; }

  .sync-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--ink-secondary);
    white-space: nowrap;
  }

  .sync-toggle input { accent-color: var(--model-luna); }

  /* ---------- Model switcher ---------- */

  .model-bar {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .model-tab {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface-raised);
    color: var(--ink-secondary);
    flex: none;
  }

  .model-tab .swatch {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    flex: none;
  }

  .model-tab .mname {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    font-weight: 600;
  }

  .model-tab .mpref {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-muted);
    padding-left: 8px;
    border-left: 1px solid var(--border);
  }

  .model-tab[data-active="true"] {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .model-tab[data-active="true"] .mpref { color: color-mix(in srgb, var(--bg) 70%, transparent); border-color: color-mix(in srgb, var(--bg) 30%, transparent); }

  /* ---------- Split view ---------- */

  .split {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr var(--rail-width, 460px);
    min-height: 0;
  }

  .split.is-resizing {
    cursor: col-resize;
    user-select: none;
  }

  .pane {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    border-right: 1px solid var(--border);
  }

  .pane:last-child { border-right: none; }

  .resize-handle {
    position: absolute;
    top: 0;
    bottom: 0;
    left: -5px;
    width: 9px;
    cursor: col-resize;
    z-index: 3;
  }

  .resize-handle::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 4px;
    width: 2px;
    background: transparent;
  }

  .resize-handle:hover::after,
  .split.is-resizing .resize-handle::after {
    background: var(--model-luna);
  }

  .pane-head {
    flex: none;
    padding: 14px 26px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-raised);
  }

  .pane-head .who {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 2px;
  }

  .pane-head .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex: none;
  }

  .pane-head .who-name {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13.5px;
    font-weight: 600;
  }

  .pane-head .who-tag {
    font-size: 11.5px;
    color: var(--ink-muted);
  }

  .plan-tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--ink-muted);
    border: 1px solid var(--border-strong);
    border-radius: 100px;
    padding: 1px 8px;
    margin-left: 2px;
  }

  /* ---------- Rationale panel (third column) ---------- */

  .rationale-pane .pane-head {
    padding-bottom: 13px;
  }

  .rationale-title {
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: -0.005em;
    color: var(--ink);
    margin-bottom: 10px;
  }

  #tallyLine {
    margin-top: 4px;
  }

  .score-cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .score-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--surface-raised);
  }

  .score-card.decisive {
    border-color: var(--border-strong);
    background: color-mix(in srgb, var(--ink) 3%, var(--surface-raised));
  }

  .score-card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }

  .score-card-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .score-card.decisive .score-card-label { color: var(--ink-secondary); }

  .score-card-value {
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    flex: none;
  }

  .score-card-label-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .info-toggle {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink-muted);
    font-family: "IBM Plex Serif", Georgia, serif;
    font-size: 10px;
    font-style: italic;
    font-weight: 600;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    flex: none;
  }

  .info-toggle:hover { color: var(--ink); border-color: var(--ink-muted); }

  .score-info {
    display: none;
    margin: 10px 0;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .score-info[data-open="true"] { display: block; }

  .score-info-section {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 8px 0 4px;
  }

  .score-info-section:first-child { margin-top: 0; }

  .score-info-text {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-secondary);
  }

  .score-info-prompt {
    margin: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    line-height: 1.55;
    color: var(--ink-secondary);
    white-space: pre-wrap;
    max-height: 260px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .verdict-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 100px;
    border: 1px solid var(--border-strong);
    color: var(--ink-secondary);
    margin-bottom: 8px;
  }

  .verdict-tag .arrow { font-size: 11px; }

  .score-card-body {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-secondary);
  }

  .score-card-body.empty {
    font-style: italic;
    color: var(--ink-muted);
  }

  .pane-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 26px 30px 60px;
  }

  .plan-md {
    max-width: 68ch;
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--ink);
  }

  .plan-md h1, .plan-md h2, .plan-md h3 {
    font-family: "IBM Plex Serif", Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }

  .plan-md h1 { font-size: 19px; margin: 0 0 14px; }

  .plan-md h2 {
    font-size: 16px;
    margin: 26px 0 10px;
    padding-top: 14px;
    border-top: 1px solid var(--grid);
  }

  .plan-md h2:first-child { margin-top: 0; padding-top: 0; border-top: none; }

  .plan-md h3 {
    font-size: 13.5px;
    color: var(--ink-secondary);
    margin: 16px 0 6px;
  }

  .plan-md p { margin: 0 0 12px; }
  .plan-md strong { font-weight: 600; color: var(--ink); }

  .plan-md ul, .plan-md ol {
    margin: 0 0 14px;
    padding-left: 22px;
  }

  .plan-md li { margin-bottom: 5px; }

  .plan-md li > ul, .plan-md li > ol {
    margin: 5px 0 0;
  }

  .plan-md hr {
    border: none;
    border-top: 1px solid var(--grid);
    margin: 18px 0;
  }

  .plan-md .label-line {
    font-weight: 600;
    color: var(--ink-secondary);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 14px 0 4px;
  }

  @media (max-width: 860px) {
    .split { grid-template-columns: 1fr; grid-auto-rows: 1fr; overflow-y: auto; }
    .pane { border-right: none; border-bottom: 1px solid var(--border); min-height: 60vh; }
    .pane-scroll { overflow-y: visible; }
    .resize-handle { display: none; }
  }

  /* ---------- Scoreboard ---------- */

  .scoreboard-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink-secondary);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .scoreboard-toggle:hover { background: var(--grid); }

  .scoreboard-toggle .chevron {
    display: inline-block;
    font-size: 9px;
    transition: transform 0.15s ease;
  }

  .scoreboard-toggle[data-open="true"] .chevron { transform: rotate(90deg); }

  .scoreboard-panel {
    flex: none;
    max-height: 0;
    overflow: hidden;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    transition: max-height 0.2s ease;
  }

  .scoreboard-panel[data-open="true"] { max-height: 220px; }

  .lesson-info-panel[data-open="true"] { max-height: 420px; }

  .scoreboard-panel-inner {
    padding: 14px 20px 18px;
    overflow-x: auto;
  }

  .lesson-info-panel .scoreboard-panel-inner {
    overflow-x: hidden;
    overflow-y: auto;
    max-height: 420px;
  }

  .lesson-info-crumb {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 4px;
  }

  .lesson-info-crumb strong { color: var(--ink); font-weight: 600; }

  .lesson-info-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .lesson-info-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 14px 0 6px;
  }

  .lesson-info-outcomes {
    margin: 0;
    padding-left: 20px;
    font-size: 13px;
    color: var(--ink-secondary);
    line-height: 1.6;
  }

  .lesson-info-panel details {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    background: var(--surface-raised);
  }

  .lesson-info-panel summary {
    cursor: pointer;
    padding: 9px 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-secondary);
  }

  .lesson-info-panel summary:hover { color: var(--ink); }

  .lesson-info-panel details[open] summary {
    border-bottom: 1px solid var(--border);
    color: var(--ink);
  }

  .lesson-info-body {
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-secondary);
    white-space: pre-wrap;
  }

  .scoreboard-table {
    border-collapse: collapse;
    min-width: 640px;
  }

  .scoreboard-table th, .scoreboard-table td {
    padding: 7px 16px 7px 0;
    text-align: right;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scoreboard-table th {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-muted);
    border-bottom: 1px solid var(--border-strong);
    padding-bottom: 8px;
  }

  .scoreboard-table th:first-child, .scoreboard-table td:first-child {
    text-align: left;
    padding-left: 0;
  }

  .scoreboard-table td.model-name {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    color: var(--ink);
    padding-top: 9px;
  }

  .scoreboard-table td { border-bottom: 1px solid var(--border); color: var(--ink-secondary); }
  .scoreboard-table tr:last-child td { border-bottom: none; }

  .scoreboard-table td.pref-col { font-weight: 700; color: var(--ink); }

  .scoreboard-table .swatch {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex: none;
  }
</style>

<div class="topbar">
  <div class="brand">
    <span class="eyebrow">lesson-plan eval &middot; business</span>
    <span class="title">Plan Reader</span>
  </div>

  <div class="lesson-nav">
    <button class="nav-btn" id="prevBtn" aria-label="Previous lesson">&#8592;</button>
    <div class="lesson-select-wrap">
      <select id="lessonSelect" aria-label="Choose a lesson"></select>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="Next lesson">&#8594;</button>
  </div>

  <span class="row-counter" id="rowCounter"></span>

  <button class="scoreboard-toggle" id="lessonInfoToggle" data-open="false">
    <span class="chevron">&#9656;</span>
    show lesson info
  </button>

  <button class="scoreboard-toggle" id="scoreboardToggle" data-open="false">
    <span class="chevron">&#9656;</span>
    show scoreboard
  </button>

  <div class="topbar-spacer"></div>

  <label class="sync-toggle">
    <input type="checkbox" id="syncScroll" checked>
    sync scroll
  </label>
</div>

<div class="scoreboard-panel lesson-info-panel" id="lessonInfoPanel" data-open="false">
  <div class="scoreboard-panel-inner" id="lessonInfoInner"></div>
</div>

<div class="scoreboard-panel" id="scoreboardPanel" data-open="false">
  <div class="scoreboard-panel-inner">
    <table class="scoreboard-table">
      <thead>
        <tr>
          <th>Model</th>
          <th>Structure</th>
          <th>Similarity</th>
          <th>Agreement</th>
          <th>Grounding</th>
          <th>Instructions</th>
          <th>Preference</th>
          <th>Won</th>
          <th>Tied</th>
          <th>Lost</th>
        </tr>
      </thead>
      <tbody id="scoreboardBody"></tbody>
    </table>
  </div>
</div>

<div class="model-bar" id="modelBar"></div>

<div class="split">
  <div class="pane" id="leftPane">
    <div class="pane-head">
      <div class="who">
        <span class="swatch" style="background:var(--prod)"></span>
        <span class="who-name">o3-2025-04-16</span>
        <span class="plan-tag">Plan B</span>
      </div>
      <span class="who-tag">production &middot; reference plan</span>
    </div>
    <div class="pane-scroll" id="leftScroll">
      <div class="plan-md" id="leftContent"></div>
    </div>
  </div>

  <div class="pane" id="rightPane">
    <div class="pane-head">
      <div class="who">
        <span class="swatch" id="rightSwatch"></span>
        <span class="who-name" id="rightName"></span>
        <span class="plan-tag">Plan A</span>
      </div>
      <span class="who-tag">candidate &middot; fixed-context replay</span>
    </div>
    <div class="pane-scroll" id="rightScroll">
      <div class="plan-md" id="rightContent"></div>
    </div>
  </div>

  <div class="pane rationale-pane" id="rationalePane">
    <div class="resize-handle" id="resizeHandle"></div>
    <div class="pane-head">
      <div class="rationale-title">Scores and rationale</div>
      <div class="who">
        <span class="swatch" id="scoreSwatch"></span>
        <span class="who-name" id="scoreName"></span>
      </div>
      <div class="who-tag mono" id="tallyLine"></div>
    </div>
    <div class="pane-scroll">
      <div class="score-cards" id="scoreCards"></div>
    </div>

</div>

<script id="lessonData" type="application/json">[{"id": "538c7aa6-7cfc-4d9a-bf4e-a7089b5722ad", "course": "Operations management", "fingerprint": "e0028ae57e18", "production": "1. Topics  \n• “People problem” vs process problem  \n• Flow-issue symptoms (queues, mismatched hand-offs, status–reality gaps)  \n• Applying the process lens to Bite’s “late deliveries” complaint  \n• Quick KPI recall (how a metric tells if the reframing worked)\n\n2. Scope Envelope  \nAllowed:  \n1. Reframing driver / restaurant complaints as a repeatable process with named steps  \n2. Spotting at least one flow symptom that indicates a process flaw, not motivation  \n3. IPO system lens and basic KPI concepts (last practiced 2026-08-10T19:30:23.280Z)  \n4. Bite scenario details provided in lesson instructions  \nForbidden:  \n– Detailed process-mapping notation or diagramming methods  \n– Bottleneck identification or throughput math  \n– Capacity, utilization, or scheduling calculations  \n– Layout/service-design principles  \n– AI-assisted process critique or any Unit 2 topics beyond this lesson  \n– Decision-under-uncertainty, inventory, forecasting, or other later-unit content\n\n3. Mastery Outcomes  \n• Reframe a “people problem” in a small business as a process problem and name the underlying repeatable steps.  \n• Identify at least one symptom that points to a flow issue rather than a motivation or staffing issue.\n\n4. New Concepts Introduced  \n• Process lens: seeing a complaint as a chain of repeatable steps and hand-offs  \n• Flow symptom: observable sign (queue, re-work, status mismatch, double-handling) that signals a step or hand-off is mis-timed or unclear  \n• Status–reality gap: when customer-visible updates do not match actual progress, indicating information-flow breakdown\n\n5. General remarks / tips  \n• Keep Bite’s lunch-rush example front and center; let the student narrate the steps, then guide them to label where hand-offs or timing slip.  \n• Tie each identified symptom to one KPI (e.g., on-time delivery rate) to refresh KPI thinking without reteaching the whole framework.  \n• Use quick either/or checks: “Is this a flow symptom or a motivation guess?” to cement the distinction.  \n• Lean on the student’s strength with structured classification (seen in KPI and lever lessons).\n\n6. Things to Avoid  \n• Mentioning “bottleneck,” “capacity,” or “throughput.”  \n• Drawing full swim-lane or BPMN diagrams—save visuals for the next lesson.  \n• Blaming individuals; reinforce the system-over-people mindset.  \n• Overloading with jargon not yet taught.\n\n7. Student teaching preferences summary  \nNo explicit preferences given. Past summaries show the student:  \n– Responds well to concrete small-business stories and scenario questions.  \n– Benefits from multiple-choice or binary classification checks.  \n– Grasps frameworks quickly when they come with named categories and examples.\n\n8. Teaching instructions  \n• Open with Bite founders blaming “unreliable drivers.” Prompt the student to list what actually happens from order placed to food delivered.  \n• Guide them to mark each repeatable step and the driver-restaurant hand-off.  \n• Ask: “Which observed issue is a flow symptom?” Provide 2–3 candidate symptoms (e.g., drivers waiting on food, app shows ‘picked up’ while food is still on counter). Have the student classify.  \n• Once they tag a symptom, link it to a single KPI and describe in one sentence how improving the step would move that metric.  \n• End by having the student rewrite the original complaint as a neutral process statement (“Order-timing mismatch between kitchen readiness and driver arrival causes queues and late drops”).", "lessonTitle": "Process thinking", "unitTitle": "Seeing flow and constraints", "masteryOutcomes": ["Reframe a 'people problem' in a small business as a process problem and name the underlying repeatable steps.", "Identify at least one symptom that points to a flow issue rather than a motivation or staffing issue."], "instructions": {"unit": "Unit scenario — Bite, a small food delivery app. Bite operates in 2 mid-sized cities, with ~200 partner restaurants and ~80 active drivers at peak hours. Lunch (12:00-13:30) and dinner (18:30-20:30) are the two daily demand peaks. Bite is getting complaints: late deliveries, confusing order-status updates, restaurants saying drivers arrive too early or too late, drivers saying orders aren't ready when they arrive, customers seeing 'preparing', 'picked up', and 'arriving soon' that don't match reality. Founders are Maya (CEO, ex-restaurant operator) and Dev (CTO). Bite recently rolled out an AI-driven dispatch and ETA model that decides which driver to assign and powers the in-app status estimates — but its predictions often disagree with what really happens on the ground, and the team isn't sure how much to trust it. Use Bite as the main applied example across the unit to connect process thinking, mapping, bottlenecks, capacity, scheduling, service design, and AI-supported process analysis. Suggested KPIs: on-time delivery rate, average restaurant pickup wait time, driver utilization, order cancellation rate, status accuracy. Keep the scenario as the shared example, but do not force every micro-exercise to use it — when a lesson's teachingInstructions says not to use the scenario, let the student pick their own context. Run the unit as one compounding investigation rather than seven separate exercises: the process map built in 'Process mapping' is the unit's running artifact — reuse it to locate the bottleneck in 'Bottlenecks and throughput', to calculate capacity and utilization at that bottleneck in 'Capacity and utilization', to apply the service-design framework in 'Layout and service design', and as the artifact the AI critiques in 'AI-supported process analysis'. Each lesson should explicitly pick up the previous lesson's output. KPI was introduced in Unit 1; the first time it appears in this unit, briefly recall what a KPI is, and connect each lesson's recommendation to a specific KPI rather than mentioning KPIs only at the end.", "lesson": "Use the Bite scenario — reframe 'drivers are unreliable' or 'restaurants are slow' as a process problem (order timing, handoffs, unclear status updates, dispatch logic, demand spikes)."}, "models": {"luna": {"output": "# Topics\n\n- Process thinking as a unit of analysis\n- Reframing blame-oriented complaints as repeatable workflow problems\n- Flow symptoms and handoff failures in Bite’s delivery operation\n- Connecting process observations to a relevant KPI\n\n# Scope Envelope\n\n- **Allowed:**\n  - Reframing “drivers are unreliable” or “restaurants are slow” as a process problem\n  - Naming repeatable steps in Bite’s order-to-delivery workflow\n  - Identifying symptoms that indicate flow or handoff problems\n  - Examining order timing, dispatch logic, handoffs, and status updates at a high level\n  - Connecting a process recommendation to a relevant KPI, briefly recalling that a KPI is a measurable indicator of operational performance\n\n- **Forbidden:**\n  - Drawing or formally documenting a complete process map\n  - Diagramming conventions, decision-point notation, or resolving every yes/no branch\n  - Comparing step times to identify a bottleneck\n  - Defining or calculating throughput\n  - Calculating capacity or utilization\n  - Estimating theoretical or effective capacity\n  - Building staffing schedules or matching shifts to demand\n  - Evaluating physical layout or digital service design as a separate framework\n  - Using AI to critique a process map or workflow\n  - Sorting AI suggestions into accept, verify, or reject\n  - Forecasting demand or analyzing supplier lead times\n  - Inventory, reorder points, or safety stock\n  - Root-cause analysis techniques such as 5 Whys or fishbone diagrams\n  - PDCA or other formal improvement loops\n  - Cross-functional leadership, stakeholder buy-in, or resistance management\n  - Unit 2 exam or full applied flow analysis\n\n# Mastery Outcomes\n\n- Reframe a 'people problem' in a small business as a process problem and name the underlying repeatable steps.\n- Identify at least one symptom that points to a flow issue rather than a motivation or staffing issue.\n\n# New Concepts Introduced\n\n- **Process thinking:** treating a repeatable sequence of work, information, and handoffs as the main unit of analysis rather than judging an individual’s motivation or reliability.\n- **People-problem reframe:** translating a complaint about a person or group into a neutral question about timing, sequence, information, ownership, or handoffs.\n- **Flow symptom:** an observable pattern—such as waiting, repeated status corrections, mismatched arrival timing, or work arriving before the next step is ready—that suggests the workflow is misaligned.\n- **Repeatable process steps:** the recurring actions that turn an order into a delivered meal, such as order acceptance, restaurant preparation, dispatch, driver arrival, pickup, delivery, and customer status communication.\n- **KPI connection:** a KPI is a measurable indicator of operational performance. For Bite, relevant examples include on-time delivery rate, restaurant pickup wait time, order cancellation rate, and status accuracy.\n\n# General remarks / tips\n\n- Use Bite as the shared running example: approximately 200 partner restaurants, 80 active peak-hour drivers, and pronounced lunch and dinner demand peaks.\n- Begin by eliciting the student’s initial interpretation of “drivers are unreliable” or “restaurants are slow,” then help them test whether the complaint describes a person or a recurring workflow pattern.\n- Build from the student’s existing strength with inputs, transformations, outputs, customer journeys, handoffs, and system-level improvements. Use plain language before introducing formal terminology.\n- Reinforce the student’s prior systems-thinking tendency: emphasize that people may be working hard while a poorly timed or poorly connected process still produces late deliveries.\n- Keep the distinction clear:\n  - A **people judgment** describes a presumed trait: “drivers are unreliable.”\n  - A **process description** describes observable repetition: “drivers are often sent before meals are ready, then wait at restaurants.”\n- Ask the student to name the steps in order, but do not turn the activity into a formal process map.\n- Prompt for evidence rather than blame: “What happens repeatedly?” “Where does work wait?” “What information is missing or late?” and “Which handoff does this reveal?”\n- When discussing a proposed change, require a direct KPI link. For example, better coordination between meal readiness and driver arrival could improve restaurant pickup wait time and on-time delivery rate; more accurate status updates could improve status accuracy.\n- Encourage concise one-sentence explanations, since the student has demonstrated strength with structured operational reasoning but sometimes mixes high-level workflow with excessive detail.\n- Use contrastive mini-cases: one genuine individual-performance issue and one recurring process issue, while keeping the lesson focused on recognizing the latter.\n- Avoid implying that staffing levels are irrelevant; the target is to recognize when the available evidence points first to flow coordination rather than motivation or headcount.\n\n# Things to Avoid\n\n- Do not describe drivers, restaurants, or founders as inherently unreliable, slow, careless, or unmotivated.\n- Do not jump directly to “hire more drivers” or “train people harder” without examining timing, sequence, information, or handoffs.\n- Do not teach bottleneck, throughput, capacity, utilization, scheduling, layout/service design, or AI process critique in this lesson.\n- Do not ask the student to create a formal diagram or solve every process branch.\n- Do not treat Bite’s AI dispatch and ETA model as proof that the process is correct; keep discussion at the level of observed dispatch, timing, and status mismatches.\n- Do not introduce later-unit topics such as forecasting, inventory, root-cause methods, improvement loops, or formal decision stress-testing.\n- Do not over-reinforce KPI theory; recall only that a KPI is a measurable operational signal and use it to anchor the student’s recommendation.\n- Do not frame a single late delivery as proof of a process problem; focus on recurring patterns.\n- Do not address spelling, personal issues, or unrelated concerns.\n\n# Student teaching preferences summary\n\n- No specific learning preferences are recorded.\n- The student responds well to familiar small-business scenarios, guided questions, concise templates, and structured comparisons.\n- The student has high confidence with inputs–transformation–outputs, customer journeys, handoffs, KPIs, and system-level changes.\n- The student benefits from prompts that move from a broad complaint to observable repeatable steps.\n- The student may initially favor individual blame or staffing explanations, so use evidence-based reframing and ask for the recurring sequence before evaluating people.\n- The student can produce concise rationales but benefits from support distinguishing high-level process steps from overly granular task lists.\n\n# Teaching instructions\n\nTeach the lesson as a guided investigation of Bite’s late-delivery complaints. Introduce process thinking explicitly as the shift from judging people to examining a repeatable sequence of work and information. Have the student restate at least one complaint in neutral process language and name the recurring steps behind it.\n\nUse the Bite examples of drivers arriving too early or too late, meals not being ready, and customer statuses failing to match reality. Ask the student to identify which observations are symptoms of flow or handoff problems and to explain why they do not, by themselves, prove that a person is unmotivated or unreliable.\n\nBriefly recall KPI as a measurable operational indicator, then ask the student to connect one proposed process-focused change to one Bite KPI. End with a short independent response that includes: the original blame-oriented complaint, a process reframe, the repeatable steps involved, one flow symptom, and one relevant KPI. Provide corrective feedback by checking that the response describes observable process behavior, avoids personal judgments, and stays within this lesson’s scope.", "scores": {"section_structure": 1, "golden_similarity": 0.9038692418912123, "instruction_adherence": 1, "golden_agreement": 0.95, "retrieval_grounding": 0.9, "pairwise_preference": 0.5}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan uses the Bite scenario and centers entirely on reframing 'drivers are unreliable'/'restaurants are slow' as a process problem covering order timing, handoffs, status updates, and dispatch logic, exactly as instructed. It correctly recalls the KPI definition (as this is the unit's first lesson) and connects recommendations to specific KPIs, while carefully forbidding later-unit topics like mapping, bottlenecks, capacity, and AI critique.", "golden_agreement": "The candidate matches the reference on virtually every substantive decision: same topics in the same order, identical mastery outcomes, matching allowed/forbidden scope (no bottleneck/capacity/diagrams/AI critique), the same new concepts (process lens, flow symptoms, status-reality mismatch), KPI recall linked to symptoms, classification-style checks, system-over-people framing, and the closing neutral process restatement of the complaint. Only trivial differences exist, such as slightly broader forbidden lists and added mini-case contrasts, which do not contradict the reference.", "retrieval_grounding": "Nearly all claims trace to the summaries: strengths with inputs–transformation–outputs, customer journeys, KPIs, and system-level changes are documented, the blame/staffing tendency matches the AI-accountability lesson, and the granularity-mixing weakness matches the Unit 1 exam summary. The only slight overstatement is claiming 'high confidence' with handoffs, which the summaries record as intermediate depth with only medium confidence.", "pairwise_preference": "ORDERS DISAGREED (0.25 / 0.75). Both plans hit the eight sections, cover the two outcomes, keep scope discipline, and ground claims in the summaries, but Plan A pads heavily (redundant remarks, restated scope rules, a 'new concept' for KPI that the student already knows) without adding teaching value. Plan B delivers the same coverage more concisely, so it's the preferable working document, though the difference wouldn't dramatically change the lesson."}}, "nano": {"output": "## Topics\n- Process thinking (reframing “people problems” as repeatable steps)\n- Symptoms that distinguish flow issues from motivation/staffing issues\n- Applying both to Bite’s delivery, handoffs, and customer status updates\n\n## Scope Envelope\n- **Allowed:**\n  - Reframe a “people problem” in a small business as a process problem and name the underlying repeatable steps.\n  - Identify at least one symptom that points to a flow issue rather than a motivation or staffing issue.\n  - Use the Bite scenario as the applied example for the above outcomes.\n  - Connect observations to measurable performance signals previously introduced (e.g., the kinds of KPIs used in Unit 1).\n- **Forbidden:**\n  - Bottlenecks/throughput calculations (e.g., capacity math, utilization, throughput prediction)\n  - AI-supported process analysis critique and triage grids\n  - Detailed process mapping with decision branches (yes/no) as a full standalone mapping exercise\n  - Matching capacity to demand via schedules/shift design\n  - Layout/service-design changes\n\n## Mastery Outcomes\n- Reframe a 'people problem' in a small business as a process problem and name the underlying repeatable steps.\n- Identify at least one symptom that points to a flow issue rather than a motivation or staffing issue.\n\n## New Concepts Introduced\n- **Process vs. people framing:** recognizing that “drivers/restaurants are unreliable/slow” can usually be restated as “the system produces late/incorrect timing and status because specific handoffs and timing steps occur (or fail to occur) in a particular order.”\n- **Repeatable process steps (for a service workflow):** the minimal set of ordered steps needed to generate a customer-visible outcome (e.g., “order placed → restaurant acknowledges → driver dispatch → pickup timing → transit/arrival status update → customer-facing ETAs/status correctness”).\n- **Flow symptom vs. staffing/motivation symptom:** a flow issue shows up as *timing inconsistency, queues/waits, handoff timing mismatch,* or *status lag/incorrect state progression* that repeats across shifts and drivers—not as a one-off attitude problem.\n\n## General remarks / tips\n- Keep the Bite complaints anchored to what the customer experiences: late delivery, confusing status updates, restaurant pickup timing mismatch, and “preparing/picked up/arriving soon” not matching reality.\n- When the student says something like “drivers are unreliable,” require a translation into (1) what the customer sees, (2) the specific handoff(s) causing state/timing mismatch, and (3) which steps are supposed to happen in order.\n- Use the student’s existing comfort with operational measurement vocabulary: briefly recall what a KPI is the first time you mention it in this lesson, then tie each symptom you discuss to “what you’d expect to move” on a KPI (without doing calculations).\n\n## Things to Avoid\n- Do not jump ahead into bottleneck math, utilization, or throughput predictions.\n- Do not design scheduling/shift plans yet.\n- Do not introduce AI critique/triage work.\n- Don’t correct spelling or address unrelated personal issues.\n- Don’t let the student “solve” by saying “hire better” or “try harder”—the goal here is reframing and step identification, not the fix.\n\n## Student teaching preferences summary\n- No specific learning preferences provided.\n- Based on past performance: the student benefits from structured, scenario-based prompts and clear frameworks; they may initially default to mixing in actions/solutions inside problem statements, so keep the task focused on *reframing* and *step naming*.\n- The student has shown strong KPI understanding in general, but will benefit from linking each recommendation to a specific KPI expectation (rather than mentioning KPIs only at the end).\n\n## Teaching instructions\n- Start by explicitly anchoring the class problem in Bite: “Late deliveries + confusing status updates + restaurant says driver timing is wrong + drivers say orders aren’t ready + app statuses don’t match reality.”\n- Exercise 1 (reframe): Present one complaint as a “people problem” (e.g., “drivers are unreliable” or “restaurants are slow”), and require the student to rewrite it as a **process problem** that includes:\n  1) the customer-visible failure (what’s wrong),\n  2) the underlying repeatable steps that should connect to it (ordered handoffs/timing checkpoints).\n- Exercise 2 (steps): Have the student name the smallest set of repeatable steps needed to produce a “correct status progression” (from order created through pickup and delivery), emphasizing handoffs/decision points as steps (not people traits).\n- Exercise 3 (symptoms): Ask the student to list at least one **flow symptom** from the Bite story that indicates a flow/timing/handoff issue rather than motivation or staffing. Use prompts like:\n  - “What evidence suggests the problem repeats as a timing/state mismatch?”\n  - “Where do statuses get out of sync with what drivers/restaurants experience?”\n- KPI connection (light recall): Briefly remind what a KPI is (a measurable signal of performance), then for each symptom the student selects, identify which KPI *type* would likely change (e.g., status accuracy, on-time delivery rate, restaurant pickup wait time), without calculating anything.\n- Close with a quick consolidation: the student states (a) one people-complaint reframed as a process with named repeatable steps, and (b) one flow symptom distinguishing it from motivation/staffing.", "scores": {"section_structure": 1, "golden_similarity": 0.9265164338266834, "instruction_adherence": 0.95, "golden_agreement": 0.93, "retrieval_grounding": 0.95, "pairwise_preference": 0.25}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan uses the Bite scenario to reframe 'drivers are unreliable'/'restaurants are slow' as a process problem involving timing, handoffs, and status updates, exactly as the lesson instruction directs. It correctly recalls what a KPI is on first mention and ties each symptom to a specific KPI, and appropriately avoids downstream topics (bottlenecks, capacity, scheduling, AI critique) reserved for later lessons. Minor gap: as the first lesson before 'Process mapping,' it can't reuse a prior artifact, but its step-naming naturally seeds the running process map.", "golden_agreement": "The candidate matches the reference on nearly all substantive decisions: same topics and ordering, identical mastery outcomes, matching scope (KPI recall allowed; bottlenecks, capacity math, diagramming, AI critique forbidden), equivalent new concepts including the status–reality gap idea, and a very similar teaching flow (reframe complaint, name steps/hand-offs, classify flow symptoms, link to KPIs, closing restatement as a process problem). Minor gaps: it omits the reference's use of binary/multiple-choice classification checks tailored to the student's strengths and the explicit provision of candidate symptoms to classify.", "retrieval_grounding": "All claims about the student trace to the summaries: comfort with KPI/measurement vocabulary is supported by multiple KPI lessons, the tendency to blend solutions into problem statements matches the documented 'blends the solution into the problem hypothesis' gap, and benefit from structured scenario-based prompts matches the reinforced 'scenario-based reasoning' pattern. The only slight stretch is calling KPI understanding 'strong' when summaries rate it intermediate with medium-to-high confidence, but this is well within a reasonable reading of the record.", "pairwise_preference": "Both orders agreed (0.25 / 0.25). Both plans hit the eight-section structure, copy the mastery outcomes verbatim, keep scope tight, and ground personalisation in the summaries. Plan B is leaner and keeps its teaching instructions closer to high-level guidance, while Plan A drifts toward a scripted, exercise-by-exercise lesson with required sub-components, which edges into the forbidden step-by-step detail."}}, "haiku": {"output": "# Lesson Plan: Process Thinking\n\n---\n\n## Topics\n\n- Reframing \"people problems\" as process problems\n- Identifying symptoms of flow issues vs. motivation/staffing issues\n- Bite scenario introduction: complaint patterns as process signals\n- Core repeatable steps in a workflow\n- Flow thinking as an alternative to blame\n\n---\n\n## Scope Envelope\n\n### Allowed\n- Systems thinking and input–transformation–output framing (from Unit 1)\n- KPIs and the five trade-off axes (reinforced from Unit 1, Lesson 7)\n- Customer journey and moments of truth (from Unit 1, Lesson 3)\n- Cross-functional operations and friction points (from Unit 1, Lesson 5)\n- Basic problem framing and evidence gathering (foundational reasoning skills)\n- The Bite scenario as the running applied example for this unit\n- Plain-language definition of \"process\" as a repeatable set of steps that transform inputs to outputs\n\n### Forbidden\n- Process mapping (diagramming, shapes, flowchart syntax) — covered in next lesson\n- Bottleneck identification or throughput calculation — covered in Lesson 3 of this unit\n- Capacity math, utilization, or scheduling — covered in Lessons 4–5 of this unit\n- Layout and service-design changes — covered in Lesson 6 of this unit\n- AI-supported process critique — covered in Lesson 7 of this unit\n- Root cause analysis (5 Whys, fishbone) — belongs to Unit 4, Improving the System\n- Quality, variability, waste, or lean concepts — belong to Unit 4\n- PDCA cycles or improvement loops — belong to Unit 4\n- Any forward-looking decision-making under uncertainty (Unit 3 content)\n\n---\n\n## Mastery Outcomes\n\n- Reframe a 'people problem' in a small business as a process problem and name the underlying repeatable steps.\n- Identify at least one symptom that points to a flow issue rather than a motivation or staffing issue.\n\n---\n\n## New Concepts Introduced\n\n1. **Process as a unit of analysis**  \n   A process is a repeatable sequence of steps that receives inputs, performs work, and produces outputs. It is the *how* of a business, distinct from the *who* (people/staffing) and the *why* (motivation/goals).\n\n2. **People problem vs. process problem**  \n   A \"people problem\" frames the issue as an individual's effort, skill, or motivation (\"the driver is unreliable,\" \"the restaurant staff is slow\"). A process problem reframes it as a systemic barrier, unclear handoff, misaligned information, or timing mismatch (\"orders arrive at restaurants before they have been confirmed,\" \"drivers don't know which orders are ready,\" \"status updates don't match what's happening\").\n\n3. **Symptoms of a flow issue**  \n   Flow issues show up as queues, delays, missed handoffs, rework, status mismatches, or repeated failures at the same point in the workflow—even when staffing and motivation appear adequate. Examples: late deliveries (not because drivers are lazy, but because they don't know when orders are ready); confusing status updates (not because app designers are careless, but because the underlying workflow timing doesn't match the estimate logic).\n\n4. **Repeatable steps in a workflow**  \n   Breaking down a process into its core repeatable steps means naming *what happens* in sequence: order placed → confirmed with restaurant → restaurant begins prep → driver assigned → driver notified → driver travels to restaurant → driver waits/collects → driver departs → delivery occurs. Each step has a duration, a trigger, and a handoff condition.\n\n5. **Flow thinking as an alternative frame**  \n   When complaints cluster around timing, status accuracy, or repeated failures at one stage, the process frame is more powerful than a blame frame. This mindset shift—\"most operational problems are flow problems, not motivation problems\"—is the second core lesson of this unit.\n\n---\n\n## General Remarks / Tips\n\n- **Bite scenario is the anchor:** Use the specific complaints (late deliveries, confusing status updates, early/late driver arrival, restaurants saying drivers aren't ready, drivers saying orders aren't ready) as the concrete ground for all abstract discussion. These are all flow symptoms, not character flaws.\n\n- **Student has strong systems-thinking baseline:** From Unit 1, the student understands inputs → transformation → outputs and can articulate trade-offs. Leverage this by showing how a process is a mini-system with its own flow.\n\n- **Student knows KPIs and five trade-offs:** Reinforce that flow problems show up *in KPI data* (late delivery rate, order-cancellation rate, status-accuracy rate) before they show up in blame. A rising late-delivery rate is a signal to investigate the process, not to assume drivers got lazier.\n\n- **Student struggles with cross-functional detail:** The student hasn't yet generated deep friction examples or quantified consequences across finance, HR, and customer service. Use Bite to show how a process problem (e.g., driver-dispatch timing) creates ripples: restaurants lose efficiency, drivers lose earnings efficiency, customers see wrong ETAs, customer service gets flooded with \"where is my order\" messages. This reinforces that process is a cross-functional concern.\n\n- **Avoid blame language:** Throughout, redirect \"the restaurant is slow\" or \"drivers don't care\" toward \"the restaurant doesn't have visibility into when a driver will arrive\" or \"drivers are assigned before the order status is clear to them.\" The goal is to install the mindset that systems create outcomes, not intentions.\n\n- **KPI recall:** The student learned KPIs and trade-offs on 2026-08-10, which is < 2 hours from now (current time 2026-08-27T12:29:39Z). **Do not reinforce KPI theory.** Instead, name the KPI where Bite's process issues show up: on-time delivery rate, status accuracy, driver utilization, order-cancellation rate, average restaurant pickup wait time.\n\n---\n\n## Things to Avoid\n\n- **Do not** teach process mapping, flowchart symbols, or diagramming (Lesson 2 territory).\n- **Do not** introduce bottleneck concepts or ask students to identify the bottleneck (Lesson 3 territory).\n- **Do not** use capacity math or scheduling language (Lesson 4–5 territory).\n- **Do not** mention AI tools or process critique (Lesson 7 territory).\n- **Do not** introduce root cause analysis, 5 Whys, or fishbone (Unit 4 territory).\n- **Do not** reframe Bite's problems as motivation-fixable (e.g., \"drivers need better incentives,\" \"hire better restaurant staff\"). The lesson is to *reject* that framing.\n- **Do not** jump to solutions (e.g., \"change the dispatch algorithm,\" \"redesign the app\"). This lesson installs the diagnostic lens; solutions come later.\n- **Do not** assume the student has experience with food delivery, logistics, or app design. Use plain language and define jargon (e.g., \"dispatch\" = the assignment of which driver gets which order).\n\n---\n\n## Student Learning Preferences Summary\n\nNo specific student learning preferences are documented. Plan for a mix of conceptual explanation, Bite scenario walkthrough, and structured exercises that move from recognizing the complaint pattern to articulating the underlying process frame.\n\n---\n\n## Teaching Instructions\n\n### High-Level Approach\n\n**Opening: Complaints as Data**  \nStart with Bite's complaint cluster: late deliveries, confusing status updates, drivers arriving too early or late, restaurants saying orders aren't ready, drivers saying they weren't told orders were ready, customers seeing mismatched \"preparing / picked up / arriving soon\" labels.\n\nAsk: \"If you were Dev or Maya (Bite's founders), and you heard these complaints, what would your first instinct be?\"  \n*Expected response:* \"Hire better drivers,\" \"Retrain the restaurant staff,\" \"Improve motivation.\"\n\nThen reframe: \"What if none of those are the real problem? What if the issue is *how the work flows* from customer order to delivery—the sequence of steps, when each one happens, who knows what, and when?\"\n\n**Core Reframe: Process Over People**  \nDefine a *process* as a repeatable set of steps: order placed → confirmed → prepared → collected → delivered. Each step has timing, dependencies, and handoffs. When complaints cluster around timing, status mismatches, or repeated failures at one point, that's a *flow problem*, not a people problem.\n\nContrast:\n- **People frame:** \"Drivers are unreliable\" → the problem is the driver's behavior/effort.\n- **Process frame:** \"Drivers arrive and orders aren't ready\" → the problem is the *timing of information* and *sequence of handoffs*—the restaurant doesn't know when a driver is coming, the driver doesn't know when the order is ready, and both are reacting to poor signals.\n\nShow how this reframe opens new levers: instead of \"motivate the driver harder,\" you investigate \"why is the driver arriving before the order is ready?\" (answer: the dispatch logic assigns the driver before the restaurant has confirmed pickup time; the driver's ETA doesn't account for prep time).\n\n**Identifying Symptoms of Flow Issues**  \nFlow issues show up as:\n- Delays and queues (orders sit unassigned, drivers wait at restaurants)\n- Missed or unclear handoffs (no one tells the driver when the order is ready; the app doesn't update status accurately)\n- Repeated failures at the same point (late deliveries happen consistently at lunch peak; status mismatches happen on 20% of orders)\n- Rework or callbacks (customer calls asking \"where is my order?\"; restaurant calls asking \"where is the driver?\"; driver calls asking \"is the order ready?\")\n\nThese are *not* fixed by hiring better people. They are fixed by clarifying the process: who does what, in what order, with what information, at what time.\n\n**Bite Deep Dive: Naming the Repeatable Steps**  \nWalk through Bite's order-to-delivery workflow with the student:\n1. Customer places order in app (order created, status = \"preparing\")\n2. Bite's AI dispatch system assigns a driver *before* the restaurant has confirmed prep time (assumption: order is ready in X minutes)\n3. Driver receives notification (status in app = \"driver assigned\")\n4. Restaurant sees driver is 8 minutes away but hasn't confirmed prep will be done; or driver sees prep will take 20 minutes but was told 8 minutes\n5. Driver arrives; order isn't ready; driver waits (status stuck at \"picked up\" or \"arriving soon,\" but neither is true)\n6. Customer sees wrong ETA; customer calls support; support has no real-time visibility\n7. Driver leaves late; delivery is late\n\nThis sequence has clear handoff problems: the AI dispatch doesn't coordinate with restaurant prep timing, status updates don't reflect reality, and no one has visibility into actual readiness.\n\nContrast with a student's own small business: if they've worked a restaurant, delivery job, or customer-service role, ask them to walk through a similar flow and identify where timing or status mismatches create the same complaint pattern.\n\n**Reinforcing the Outcome Mastery**  \nFor mastery outcome 1 (reframe a people problem as a process problem and name the repeatable steps):\n- Have the student take a single Bite complaint (e.g., \"drivers are unreliable\") and rewrite it as a process problem (e.g., \"drivers are assigned before restaurants confirm prep time, leading to driver wait time and late departures\").\n- Then name the repeatable steps that create this: order placed → driver assigned → restaurant prep → driver arrival → (wait) → collection → departure.\n\nFor mastery outcome 2 (identify a symptom that points to flow issue, not motivation issue):\n- Have the student spot at least one Bite symptom that rules out a people/motivation explanation. Example: \"Late deliveries happen consistently during lunch peak but not during dinner peak—this suggests the process handles peak demand differently, not that drivers get tired at lunch. So it's a flow issue, not effort.\"\n- Or: \"Drivers say they weren't told orders were ready, and restaurants say they weren't told drivers were coming. This isn't laziness; it's a communication gap in the process.\"\n\n**Closing: Setting Up Next Lesson**  \nEmphasize that this lesson is *diagnosis*, not solution. The student has learned to see \"people complaints\" as signals of process problems. In the next lesson (Process Mapping), they will *draw* the actual workflow to see where the delays and handoffs are. That's where real leverage lives.\n\n---\n\n**End of Lesson Plan**", "scores": {"section_structure": 0.875, "golden_similarity": 0.8369983526267422, "instruction_adherence": 1, "golden_agreement": 0.9, "retrieval_grounding": 0.9, "pairwise_preference": 0}, "reasoning": {"section_structure": "Matched 7/8 sections, missing: Student teaching preferences summary", "instruction_adherence": "The plan uses the Bite scenario as instructed and explicitly reframes 'drivers are unreliable'/'restaurants are slow' as process problems around order timing, handoffs, unclear status updates, and dispatch logic. It appropriately handles the KPI recall (correctly noting ment, slogan, feature list, or promotional claim with the final opportunity statement.\n- Do not collapse the customer journey into unsupported demographic stereotypes.\n- Do not treat legal compliance as the entire responsible-marketing standard.\n- Do not present a specific implementation tactic as the opportunity unless the evidence supports that level of specificity.\n- Do not use lengthy prose, isolated acronym definitions, or extensive recap sections.\n- Do not reinforce concepts practiced less than two hours ago; none of the relevant concepts were practiced within that window based on the available lesson records.\n\n# Student teaching preferences summary\n\n- No specific learning preferences were provided.\n- The student responds well to practical business scenarios, concise frameworks, comparison tables, evidence annotations, and iterative revision.\n- The student demonstrates strong confidence when applying concepts to café and SaaS contexts.\n- Use independent first drafts, explicit trade-off comparisons, short evidence notes, and targeted tutor feedback rather than heavy scaffolding.\n\n# Teaching instructions\n\n- Begin by asking the learner to select or continue one business context and state the relevant business objective in one sentence.\n- Require the learner to assemble prior artifacts into an actual table with columns such as: **Audience/segment**, **Need or job**, **Evidence**, **Competitor or market gap**, **Positioning/CVP implication**, **Journey implication**, **Constraints/responsible-marketing risks**, and **Decision implication**.\n- Ask the learner to complete the first version independently, tagging each evidence note as observed data, customer-reported evidence, secondary research, competitor research, assumption, or gap.\n- Have the learner compare at least two possible audience segments using customer need, business fit, accessibility, and objectives fit, then defend the selected priority audience.\n- Prompt the learner to check alignment across the table: the selected audience must match the persona, the need must appear in the journey, the gap must be supported by competitor or market evidence, and the positioning/CVP must express a benefit rather than merely list a feature.\n- Ask the learner to identify contradictions and unresolved assumptions before drafting the recommendation. Require at least one evidence gap and one responsible-marketing constraint.\n- After the learner submits the table and reconciliation notes, provide focused feedback: preserve strong evidence, downgrade unsupported certainty, correct terminology, and flag inconsistencies without rewriting everything for them.\n- Finish by asking for a concise opportunity statement using the learner’s own evidence. It should name the priority audience, supported need or tension, relevant market or competitor gap, and opportunity implication.\n- Use a brief final quality check: coherence across artifacts, evidence quality, audience specificity, responsible-marketing safeguards, and distinction between strategic opportunity and execution tactic.", "scores": {"section_structure": 1, "golden_similarity": 0.8983913149193349, "instruction_adherence": 1, "golden_agreement": 0.93, "retrieval_grounding": 1, "pairwise_preference": 0.75}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan renders the Audience Opportunity Table as an actual table-like artifact with required evidence notes/tags, requires the learner to reconcile prior work and contradictions before the tutor polishes (explicitly forbidding tutor-generated summaries), keeps the challenge focused on synthesis without new frameworks, maintains the RPCMO map and Objective→Audience→Evidence→Constraints→Decision lens, and enforces concise bullets/tables per unit and course guidance.", "golden_agreement": "The candidate matches the reference on virtually all substantive decisions: same topics, same allowed/forbidden scope boundaries (with even
