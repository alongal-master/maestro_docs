to aim for (not multiple-choice, but guiding what qualifies):\n  - adding/adjusting a decision point before sending AI output (e.g., an “onboarding classifier” check or confidence threshold that blocks or routes),\n  - improving how the AI is prompted with the right onboarding context so it can’t “confidently misroute,”\n  - requiring human confirmation only for the high-risk subset (while keeping the change upstream in the workflow, not as a generic after-the-fact edit).\n- **Close with a structured statement from the student:**  \n  They should finish this lesson with a single sentence using this pattern:\n  - “This is designing quality into the process because ___; inspection at the end would be ___; the upstream design change is ___ to prevent ___ (the recurring defect).”\n- **Use the required video as a visual reinforcement of prevention:**  \n  Show the Jidoka video (Toyota-style principle: stopping/containing when a defect appears so quality is built in). Connect it back to Tasklane: “stop the bad suggestion earlier” rather than “fix it after the customer experiences it.”", "scores": {"section_structure": 1, "golden_similarity": 0.8999178160219148, "instruction_adherence": 0.95, "retrieval_grounding": 1, "golden_agreement": 0.8, "pairwise_preference": 0}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan centers on the Tasklane scenario and directly executes the lesson-specific directive: separating inspection (catching bad tickets after they exist) from prevention (redesigning so the wrong-article defect doesn't occur), using the AI onboarding misfire as the recurring defect. It respects the forbidden list (no root cause, PDCA, lean waste, KPI/AI monitoring) and uses course KPIs only conceptually. Minor note: it introduces Jidoka vocabulary, but that's a reasonable prevention-reinforcement aligned with the lesson's built-in-quality theme.", "retrieval_grounding": "Every claim about the student is supported by the summaries: 'variation as a hidden cost' and 'upstream design fixes' come directly from the 2026-08-27 variation lesson, the inferred preferences (scenario-based reasoning, pass/fail decision gates, upstream vs downstream framing) trace to multiple summaries, and the noted need for guided practice on the full causal chain (design → defects → cost → upstream fix) matches the documented gap where the student's explanation was incomplete until prompted. The plan makes no unsupported mastery claims.", "golden_agreement": "The candidate matches the reference on topics, mastery outcomes, scope boundaries, the Tasklane-anchored upstream-fix exercise, no-blame framing, and includes the Jidoka video. However, it downplays Jidoka (not listed as a topic/new concept, and shows the video at the close rather than when introducing the concept), omits some forbidden items (capacity math, bottleneck theory), and slightly contradicts the reference by leaning on variation/FTR framing that the reference says not to revisit.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A's Teaching instructions are a scripted, step-by-step lesson (exact prompts, a closing sentence template, enumerated candidate answers), which the requirements explicitly call a violation, while Plan B keeps guidance high-level. Both cover the outcomes, ground personalization in the summaries, and maintain scope discipline, so B's compliance plus concision wins."}}, "haiku": {"output": "# Lesson Plan: Quality Designed In, Not Inspected In\n\n## Topics\n\n- Inspection vs. prevention: where quality is caught vs. where it is designed  \n- Defects as symptoms of process design, not individual effort  \n- Upstream design changes to prevent recurring defects  \n- Applied example: Tasklane support-ticket workflow  \n\n---\n\n## Scope Envelope\n\n**Allowed:**\n- Distinguishing inspection (downstream quality gates) from prevention (upstream design changes)  \n- Identifying defects and first-time-right rates as signals of process design quality  \n- Proposing specific upstream redesigns to eliminate recurring defect sources  \n- Applying these concepts to the Tasklane support scenario (onboarding confusion, sync bugs, billing questions, AI misfires)  \n- Connecting defect prevention to KPIs: first-response time, reopened-ticket rate, resolution time, help-center deflection rate  \n\n**Forbidden:**\n- Lean waste categories (waiting, overprocessing, defects, motion, inventory) — Unit 4, Lesson 3  \n- Root cause analysis techniques (5 Whys, fishbone diagrams) — Unit 4, Lesson 4  \n- PDCA improvement loops and KPI selection frameworks — Unit 4, Lessons 5–6  \n- AI governance, compliance, or oversight mechanisms — not part of this unit  \n- Detailed process mapping or swim-lane diagrams — Unit 2, Lesson 2  \n\n---\n\n## Mastery Outcomes\n\n- Distinguish designing quality into a process from inspecting quality at the end, using a small-business example.  \n- Explain why defects come from how the work is designed (not from people trying less hard), and identify one upstream design change that would prevent a recurring defect.  \n\n---\n\n## New Concepts Introduced\n\n1. **Inspection vs. Prevention mindset**  \n   - Inspection: catching bad work *after* it exists (downstream quality gates, rework loops)  \n   - Prevention: changing the process so bad work never happens (upstream design)  \n   - The cost of inspection: slow feedback, rework, customer dissatisfaction, hidden variation  \n\n2. **Defects as design symptoms**  \n   - Defects (reopened tickets, wrong help articles, sync failures) signal flawed process design, not lazy or careless workers  \n   - Recurring defects point to an upstream step that lacks clarity, constraints, or feedback  \n   - People working in a poorly designed process will produce variation; improving the design removes the source  \n\n3. **First-time-right (FTR) as a design metric**  \n   - FTR rate = (tickets closed without reopening) / (total tickets)  \n   - Low FTR signals that the process is catching and fixing errors *after* customers are harmed  \n   - High FTR signals that the process was designed to prevent the error in the first place  \n\n4. **Upstream design levers**  \n   - Pre-step clarity (e.g., help articles visible *before* a support agent responds)  \n   - Process constraints (e.g., mandatory fields, templates, checklists)  \n   - Automated checks or gating (e.g., suggested-reply tool tuned to category or confidence threshold)  \n   - Workflow redesign (e.g., routing different ticket types to specialized agents or self-service)  \n\n---\n\n## General Remarks / Tips\n\n- **Start with the video:** Use the Jidoka explainer to anchor the inspection-vs-prevention distinction. The Toyota principle shows that **stopping the line the moment a defect appears** is still inspection; the real win is designing the process so the defect never appears. This frames the whole lesson.  \n\n- **Use Tasklane throughout:** The scenario is sticky and real—support tickets, AI misfires, rising reopened rates. Keep returning to it: \"Where is Tasklane currently inspecting? Where could they design differently?\" This builds intuition.  \n\n- **Avoid \"people\" language:** The student has shown strong grasp of systems thinking (from the \"variation\" lesson on 2026-08-27). Reinforce that defects are *not* about agent effort or training. They come from how the work is structured. This is a key psychological shift.  \n\n- **Connect to prior learning:** The student mastered defect rate and FTR in the previous lesson (same day, 2026-08-27). They also understand variation as a hidden cost and proposed \"guided in-app steps\" as an upstream fix. This lesson deepens and applies that insight.  \n\n- **Concrete examples matter:** The student learned by working with actual ticket counts and percentages. Use real Tasklane numbers (first-response time 4h → 14h, reopened-ticket rate climbing, AI suggested replies misfiring on onboarding). Let them see the design flaws.  \n\n- **Avoid forbidden ground:** Do not introduce 5 Whys, fishbone, waste categories, or full PDCA yet. This lesson is *diagnosis* only: \"What is being inspected? What should be prevented?\" Next lessons will cover how to root-cause and design the fix.  \n\n---\n\n## Things to Avoid\n\n- **Blaming individuals:** Never frame a defect as \"the agent didn't read the help article carefully\" or \"the AI model just needs more training.\" Always reframe as \"the process doesn't give the agent the right information *before* they respond\" or \"the AI tool routes based on keywords, not ticket category.\"  \n\n- **Jumping to solutions without diagnosis:** Don't propose changes (e.g., \"hire better agents,\" \"upgrade the AI tool\") without first identifying *what* is being inspected and *where* the design could prevent the problem.  \n\n- **Mixing inspection and prevention:** Clarify: inspection (checking a ticket before it goes out, code review, QA testing) is *downstream* and reactionary. Prevention (designing the input form, automating routing, making help articles discoverable at the moment of need) is *upstream* and system-level.  \n\n- **Introducing forbidden concepts:** Do not use \"waste,\" \"5 Whys,\" \"fishbone,\" \"PDCA,\" \"root cause,\" or \"improvement loop\" vocabulary. This lesson stops at design diagnosis; later lessons will formalize the improvement process.  \n\n- **Over-complicating Tasklane:** Keep the scenario focused on the three top ticket categories and the AI misfire. Don't add new complexity; let the student see the clear pattern.  \n\n---\n\n## Student Teaching Preferences Summary\n\nNo explicit learning preferences provided. However, skills memory shows the student:\n- **Learns well from concrete examples and numbers** (e.g., they applied percentages and threshold-comparison logic fluently)  \n- **Understands systems thinking** (distinguished \"people problems\" from process problems; grasped that variation comes from process design)  \n- **Benefits from visual/scenario grounding** (worked effectively with Tasklane in the prior lesson; proposed concrete redesigns like \"guided in-app steps\")  \n- **Needs explicit connection between concepts** (prior lesson required prompting to fully link \"variation → hidden cost → upstream fix\"; this lesson should explicitly model the causal chain)  \n\n---\n\n## Teaching Instructions\n\n**Phase 1: Anchor with Video & Jidoka Principle (5–7 min)**  \nShow the Jidoka video (exact URL: https://www.youtube.com/watch?v=vCpjW-rnplc) and pause to discuss: *What does \"stopping the line the moment a defect appears\" actually do?* Help the student see that even stopping the line is still *catching* a defect (inspection), not *preventing* it. The real Jidoka mindset is: *Why did the defect appear in the first place? What about the process design allowed it?* This frames the whole lesson.\n\n**Phase 2: Tasklane's Current Inspection Checkpoints (7–10 min)**  \nUsing the unit scenario, map where Tasklane is *currently* inspecting:  \n- AI suggested-reply tool flags \"low-confidence\" matches (but still misfires on onboarding)  \n- Support agents manually re-read tickets and correct misdirected help links (rework)  \n- Rising reopened-ticket rate shows quality problems are being caught *after* customers are harmed  \n\nAsk: *Why are so many tickets reopening? What does that tell you about the process design, not the agent effort?*\n\n**Phase 3: Separate Inspection from Prevention (8–12 min)**  \nCreate two columns on the board/screen:  \n\n| **Inspection (Downstream)** | **Prevention (Upstream)** |\n|---|---|\n| AI suggests a help article; agent corrects it before sending | Automatically route onboarding questions to a self-serve help widget *before* a ticket opens |\n| Agent reads ticket, realizes it's a sync-bug report not a billing question | Offer a category selector at ticket creation so the right agent gets it immediately |\n| Reopened ticket signals the initial reply didn't solve the problem | Design the response template to include a \"did this solve it?\" follow-up check within 2 hours |\n\nEmphasize: **Inspection = expensive, slow, feels like rework. Prevention = expensive to design, but then cheap and fast.**\n\n**Phase 4: Defects as Design Signals (6–8 min)**  \nUsing the student's prior knowledge of defect rate and FTR (from yesterday's lesson):  \n\n- Tasklane's reopened-ticket rate is climbing. That's *not* because support agents are trying less hard; it's because **the initial response design doesn't solve the problem on the first contact.**  \n- Why? Because the AI misfires on onboarding (suggests wrong help article), because billing questions go to the wrong agent, because sync-bug reporters don't get immediate next steps.  \n- Each of these is a **design flaw**, not a people flaw.\n\nAsk the student to name one category of tickets (onboarding, sync, billing) and describe: *If this ticket type reopens frequently, what part of the process design is broken?*\n\n**Phase 5: Propose Upstream Design Changes (10–15 min)**  \nWork through 2–3 design interventions:  \n\n1. **Onboarding confusion:**  \n   - Current inspection: AI suggests wrong help article; agent corrects it.  \n   - Upstream prevention: **Add a guided in-app wizard at the moment a user tries to invite teammates**—don't let them open a support ticket. (The student proposed this yesterday; reinforce it.)  \n\n2. **Sync bugs:**  \n   - Current inspection: Tickets come in; agent diagnoses which app (desktop or web) is affected; support triage assigns to dev.  \n   - Upstream prevention: **Ticket creation form includes a \"Which app?\" dropdown**—so the right expert sees it immediately, no triage step.  \n\n3. **AI misfire on onboarding:**  \n   - Current inspection: Suggested reply is wrong; agent manually corrects it.  \n   - Upstream prevention: **Disable the AI on tickets tagged \"onboarding\"** (low confidence on that category); route those to a specialist or self-serve channel instead.  \n\nFor each: *Why is this a design change, not a people change? What about the process was broken?*\n\n**Phase 6: Connect to KPIs (5–7 min)**  \nIntroduce (briefly) how upstream changes affect measurement:  \n\n- **First-response time:** Currently 14h partly because tickets arrive mis-routed or mis-categorized. Prevent that → first response can be faster and more accurate.  \n- **Reopened-ticket rate:** Currently climbing because initial responses don't solve the problem. Prevent the initial wrong response → fewer reopenings.  \n- **Help-center deflection rate:** If onboarding is served in-app before a ticket opens, deflection goes up—that's a win.  \n\nDo *not* introduce PDCA, root-cause analysis, or improvement loops yet. Just name the KPI and say: \"When we prevent the defect upstream, this KPI improves because we're no longer catching bad work downstream.\"\n\n**Phase 7: Closing Challenge (5–10 min)**  \nPresent one more Tasklane scenario:  \n\n*Billing plan-change questions are the third-largest category. Currently, the team manually checks the customer's account, looks up their current plan, and writes a custom reply. It takes time, and sometimes the reply is wrong (customer says \"I was charged twice\") and the ticket reopens.*  \n\nAsk the student:  \n- *Where is the team currently inspecting (catching errors)?*  \n- *What upstream design change would prevent the error or at least prevent the costly rework?*  \n\nExamples of good answers:  \n- \"Add a plan-details widget to the ticket form so the agent sees the account state *before* writing the reply.\"  \n- \"Pre-populate common answers (FAQ-style) based on the plan; agent confirms or customizes.\"  \n- \"Route billing questions to an automated bot first; only escalate if the bot can't match the question to a FAQ.\"  \n\nAccept any answer that:  1. Identifies what's currently being inspected (manual error-checking, rework)  \n2. Proposes a design change *before* the error happens (visible info, automation, routing)  \n3. Avoids \"try harder\" or \"hire smarter people\" language.\n\n---\n\n**Implementation Notes:**\n- The video is mandatory; use it to open.  \n- Ground all examples in Tasklane; do not introduce new case studies.  \n- Reinforce the student's yesterday's learning (defect rate, FTR, upstream design) explicitly—this lesson deepens it.  \n- Use closed-question widgets (multiple-choice) to check understanding of inspection vs. prevention distinctions; prepare 2–3 scenarios where the student chooses whether Tasklane is inspecting or preventing.  \n- Do not introduce PDCA, waste categories, or root-cause methods.  \n- Emphasize the psychological shift: **defects come from process design, not from people.**  ", "scores": {"section_structure": 1, "golden_similarity": 0.8343131587273043, "instruction_adherence": 1, "pairwise_preference": 0, "retrieval_grounding": 0.9, "golden_agreement": 0.65}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan is built entirely around the lesson-specific directive—separating where Tasklane is inspecting (catching bad tickets after they exist) from where they could prevent defects by design—using the Tasklane scenario throughout with its three ticket categories and AI misfire, and it respects unit-level scoping by explicitly forbidding waste categories, 5 Whys/fishbone, PDCA, and root cause which belong to later lessons.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A's Teaching Instructions are a timed, phase-by-phase script with tables, sample dialogue, and model answers — exactly the step-by-step detail the instructions forbid. Plan B covers the same outcomes, keeps scope discipline with an explicit forbidden list, grounds personalisation in the retrieved summaries, and stays high-level.", "retrieval_grounding": "Nearly all claims about the student trace to the summaries: mastery of defect rate/FTR, the 'guided in-app steps' proposal, systems-thinking strength, learning from concrete numbers, and needing prompting to complete the variation→hidden cost→upstream fix chain are all documented in the 2026-08-27 lesson. The only slight stretch is asserting the student 'worked effectively with Tasklane in the prior lesson' — the summary describes a matching support-ticket/onboarding scenario but never names Tasklane.", "golden_agreement": "The candidate matches the reference's topics, mastery outcomes, Jidoka video usage, Tasklane anchoring, forbidden Lean tools (waste categories, 5 Whys, PDCA), and no-blame framing. However, it contradicts the reference by explicitly including a KPI connection phase (reference forbids KPI selection/monitoring), by re-introducing FTR as a new concept with its formula (reference says do not revisit FTR/defect-rate math taught hours earlier), and by emphasizing numeric examples where the reference calls for a light, qualitative approach."}}}}, {"id": "103528b7-aed2-46ad-bfc4-12b4f497bf55", "course": "Operations management", "fingerprint": "e0028ae57e18", "production": "1. **Topics**\n   - Designed-in quality vs. end-of-line inspection\n   - Why defects come from process design, not from worker effort\n   - Identifying an upstream design change in the Tasklane support flow\n   - Jidoka principle as a “stop-the-line” safeguard\n\n2. **Scope Envelope**\n   - **Allowed (2–5 items)**\n     1. Designed-in quality vs. inspected quality  \n     2. Defects as signals of poor process design  \n     3. Upstream vs. downstream actions (within quality context only)  \n     4. Tasklane support example & KPIs (FRT, reopen rate)  \n     5. Jidoka video illustration\n   - **Forbidden (complete list)**\n     - Lean waste categories (waiting, over-processing, motion, etc.)\n     - Root-cause analysis tools (5 Whys, fishbone, etc.)\n     - PDCA or any improvement-loop framework\n     - Poka-yoke / mistake-proofing devices\n     - Continuous KPI monitoring with AI\n     - Inventory, capacity, or bottleneck math not tied to quality\n     - Cross-functional buy-in, stakeholder pushback tactics\n     - Any Unit 5 leadership / communication concepts\n\n3. **Mastery Outcomes**\n   - Distinguish designing quality into a process from inspecting quality at the end, using a small-business example.  \n   - Explain why defects come from how the work is designed (not from people trying less hard), and identify one upstream design change that would prevent a recurring defect.\n\n4. **New Concepts Introduced**\n   - Jidoka (automatic detection + immediate stop so defects never move downstream)  \n   - “Stop-the-line” signal examples (andon cord, auto-halt scripts) as safeguards that embed quality in the flow\n\n5. **General remarks / tips**\n   - Student already grasped “upstream design vs. downstream check” just now (2026-08-27T13:53:51.710Z); avoid repeating definitions—apply them in the new quality/inspection framing instead.  \n   - Percentage-math slips persist; if a numeric example is required, walk slowly through “defects ÷ total × 100”.  \n   - Keep mathematical content light—focus stays on qualitative difference between prevention and inspection.  \n   - Use Tasklane’s onboarding-confusion ticket as the anchor defect; have the student propose one product-design tweak (e.g., clearer “Invite teammate” CTA) and show how it would lower ticket volume per active user.  \n   - Play the Jidoka video (use show-video-widget with the exact URL) right after introducing inspection vs. design to ground the principle visually.\n\n6. **Things to Avoid**\n   - Re-teaching variation/hidden-cost definitions (last covered just now).  \n   - Introducing Lean waste, 5 Whys, PDCA, or any later-unit material.  \n   - Blaming support agents in the scenario; reinforce “the process, not the people.”  \n   - Deep KPI math beyond simple defect-rate percentages.\n\n7. **Student teaching preferences summary**\n   - No stated preferences; default to clear, concrete examples and minimal jargon.\n\n8. **Teaching instructions**\n   - 1. Open with a quick recall prompt: “What’s one flaw you’ve seen that kept re-appearing even when people tried harder?” (connect to process design).  \n   - 2. Introduce the inspection-versus-design contrast using a simple metaphor (baking: checking burnt cookies vs. lowering oven temp).  \n   - 3. Show the video “Jidoka | What Is It And Why Is It Important?” via show-video-widget (URL: https://www.youtube.com/watch?v=vCpjW-rnplc).  \n   - 4. Walk through Tasklane’s support flow: highlight where the team currently “inspects” (reopens, AI misfires) and brainstorm one genuine upstream change.  \n   - 5. Have student articulate how the change would reduce first-response time or reopen rate—single sentence, KPI named.  \n   - 6. Close with a reflection: “How will you spot inspection traps in your own work this week?”", "lessonTitle": "Quality designed in, not inspected in", "unitTitle": "Improving the system", "masteryOutcomes": ["Distinguish designing quality into a process from inspecting quality at the end, using a small-business example.", "Explain why defects come from how the work is designed (not from people trying less hard), and identify one upstream design change that would prevent a recurring defect."], "instructions": {"unit": "Unit scenario — Tasklane, a team task-manager SaaS (think a simpler Trello/Asana: kanban boards, task assignments, due dates, comments, with both a desktop app and a web app). Tasklane has ~12,000 active users on a freemium plan and a 4-person support team (lead: Priya; agents: Sam, Noor, Jules) handling tickets in a shared inbox. Support volume has grown ~40% in the last quarter while headcount stayed flat. The top three ticket categories are onboarding confusion (new users can't find how to invite teammates to a board), a recurring sync bug between the desktop app and the web app, and billing/plan-change questions. First-response time has crept from 4h to 14h; reopened-ticket rate is climbing; the team is firefighting. Two months ago Priya turned on an AI suggested-reply tool inside the support inbox: it helps on billing tickets but misfires on onboarding questions, confidently sending users to the wrong help article. The CEO, Arman, wants a small, defensible improvement plan — not a rebuild. Use Tasklane as the main applied example across the whole unit — quality, lean, waste, root cause, continuous improvement, PDCA, AI monitoring, and the closing challenge. Suggested KPIs: first-response time, resolution time, reopened-ticket rate, ticket volume per active user, help-center deflection rate, customer satisfaction (CSAT) after support interaction.", "lesson": "Use the Tasklane scenario — separate where the team is doing inspection (catching bad tickets after they exist) from where they could change the design (preventing the bad ticket from ever opening)."}, "models": {"luna": {"output": "# Topics\n\n- Quality as a process-design property\n- Inspection at the end versus prevention at the source\n- System design and recurring defects\n- Upstream fixes in the Tasklane support workflow\n\n# Scope Envelope\n\n**Allowed:**\n- Distinguishing designed-in quality from end-of-process inspection.\n- Identifying how process design can create recurring defects.\n- Reframing defects as system-design problems rather than failures of individual effort.\n- Selecting one upstream design change to prevent a recurring Tasklane defect.\n- Connecting a proposed design change to a relevant quality or service outcome.\n\n**Forbidden:**\n- Lean thinking and categories of waste.\n- Root-cause analysis techniques such as 5 Whys or fishbone diagrams.\n- PDCA or other continuous-improvement loops.\n- AI-supported KPI monitoring.\n- Detailed KPI trend analysis or anomaly detection.\n- Variation as a hidden cost, except where needed to distinguish a recurring defect from an isolated mistake.\n- Defect-rate or first-time-right calculations.\n- Bottlenecks, capacity, utilization, throughput, scheduling, or process mapping beyond what is necessary to show where inspection or prevention occurs.\n- Customer-service leadership, cross-functional alignment, stakeholder pushback, or communication strategies.\n- Any later-lesson concepts not explicitly included in the mastery outcomes.\n\n# Mastery Outcomes\n\n- Distinguish designing quality into a process from inspecting quality at the end, using a small-business example.\n- Explain why defects come from how the work is designed (not from people trying less hard), and identify one upstream design change that would prevent a recurring defect.\n\n# New Concepts Introduced\n\n- **Designed-in quality:** Structuring a process so that the correct result is made likely or built into the work from the beginning.\n- **End-of-process inspection:** Checking completed work to find defects after they have already been created.\n- **Upstream design change:** A change made earlier in the workflow to prevent a defect before it reaches the customer or the final checking stage.\n- **Downstream correction:** Fixing or catching a problem after it has appeared, such as rereading a support reply before sending it.\n- **System-created defect:** A recurring error caused by unclear steps, misleading information, missing safeguards, or poor workflow design—not by assuming employees are careless.\n- **Quality at the source:** Stopping or correcting the process close to the point where an error first appears, rather than allowing it to travel farther through the workflow.\n\n# General remarks / tips\n\n- Use Tasklane as the central example throughout: onboarding confusion, the desktop/web sync bug, billing questions, the shared support inbox, and the AI suggested-reply tool.\n- Build on the student’s demonstrated understanding from **2026-08-27T13:53:51.710Z**, when they successfully distinguished an upstream in-app invite-screen redesign from a downstream agent rereading replies. Do not re-teach this as if it were entirely unfamiliar; extend it to clearer comparisons and independent application.\n- The student is strong at reframing “people problems” as process problems, based on practice completed at **2026-08-10T20:00:45.734Z**. Invite them to explain the system mechanism—unclear screen, wrong article link, or missing safeguard—rather than merely state that “the process is bad.”\n- The student has medium confidence with defect-rate and first-time-right arithmetic from **2026-08-27T13:53:51.710Z**. Avoid unnecessary calculations in this lesson; focus on the causal distinction between prevention and inspection.\n- Use a simple visual or two-column comparison: **prevent before the defect** versus **inspect after the defect**.\n- Present the provided video using the video widget with the exact URL: `https://www.youtube.com/watch?v=vCpjW-rnplc`. The video should reinforce the idea that work can stop or be corrected when a defect first appears, rather than allowing the defect to continue downstream.\n- Use short Tasklane decision scenarios. For each, ask:\n  1. Where does the defect first arise?\n  2. Is the proposed response inspection or prevention?\n  3. What single upstream design change could prevent recurrence?\n- Include a small-business comparison outside SaaS, such as a café using a standardized order screen or required customization prompt. Keep the example focused only on quality design versus final inspection.\n- Ask the student to defend one answer in plain language to reinforce their ability to connect evidence, design, and outcome.\n- Correct gently if the student blames Sam, Noor, Jules, or users. Redirect to the designed conditions that shaped the behavior.\n- End with an independent Tasklane response that names the recurring defect, explains its design cause, labels a proposed intervention as upstream or downstream, and identifies one prevention-oriented change.\n\n# Things to Avoid\n\n- Do not imply that employees never make mistakes; the point is that recurring defects should first prompt examination of the system design.\n- Do not frame inspection as useless. Explain that inspection can catch defects, but it does not remove the design condition that creates them.\n- Do not introduce 5 Whys, fishbone diagrams, PDCA, lean waste categories, AI monitoring, or other later topics.\n- Do not ask the student to calculate defect rates or first-time-right rates unless strictly necessary for a simple conceptual check.\n- Do not treat the AI suggested-reply tool as a later AI-monitoring topic. Use it only to illustrate a design that can produce a wrong reply and the difference between checking that reply afterward and changing the workflow or tool conditions earlier.\n- Do not recommend “tell agents to try harder,” “be more careful,” or “double-check everything” as the primary solution.\n- Do not overuse technical vocabulary without immediately connecting it to a concrete Tasklane action.\n- Do not preview upcoming lessons about waste, root causes, PDCA, or KPI monitoring.\n- Do not reuse examples containing out-of-scope constructs; keep all examples centered on inspection, prevention, system design, and recurring defects.\n\n# Student teaching preferences summary\n\n- No specific learning preferences were provided.\n- The student responds well to concrete small-business scenarios, short structured comparisons, and applied decision questions.\n- The student demonstrates strong engagement with workflow-based examples and can transfer a design change to a measurable operational outcome.\n- Use moderate scaffolding initially, then reduce prompts for the final independent application.\n- Favor concise bullets and clear labels; the student has previously needed support turning long explanations into crisp professional statements.", "scores": {"section_structure": 0.875, "golden_similarity": 0.8751326789371032, "instruction_adherence": 1, "golden_agreement": 0.82, "retrieval_grounding": 0.95, "pairwise_preference": 0.125}, "reasoning": {"section_structure": "Matched 7/8 sections, missing: Teaching instructions", "instruction_adherence": "The plan centers entirely on the Tasklane scenario and precisely executes the lesson directive of separating inspection (catching bad tickets after they exist) from prevention/design (stopping the bad ticket from ever opening), using onboarding, sync bug, billing, shared inbox, and AI reply tool as examples. It respects all forbidden topics (no lean waste, root-cause, PDCA, AI monitoring, or KPI trend analysis) and honors the unit's scenario-based applied-example requirement.", "golden_agreement": "The candidate matches the reference on topics, identical mastery outcomes, scope boundaries (Lean waste, 5 Whys, PDCA, AI monitoring forbidden), the Tasklane anchor example, the exact Jidoka video URL, light math treatment, building on prior upstream/downstream knowledge, and the 'process not people' framing. It falls short by never naming Jidoka or 'stop-the-line' signals as explicit new concepts, omitting poka-yoke from the forbidden list, and not explicitly tying the upstream change to named KPIs (FRT, reopen rate).", "retrieval_grounding": "All major claims about the student trace to the summaries: the upstream invite-screen vs. downstream rereading distinction (2026-08-27 lesson), reframing people problems as process problems (2026-08-10 lesson), medium confidence with defect-rate arithmetic, and the need for support turning long explanations into crisp statements (scope-creep lesson). Only minor soft inferences (e.g., 'responds well to concrete small-business scenarios') go slightly beyond explicit evidence, though they are consistent with documented engagement with café/workflow examples.", "pairwise_preference": "Both orders agreed (0.25 / 0.00). Plan A omits the required eighth 'Teaching instructions' section entirely (only seven sections), while smuggling detailed lesson steps into 'General remarks'. Plan B has all eight sections in order, a compliant scope envelope, and grounded personalisation; its main flaw is that its Teaching instructions drift toward a step-by-step outline, but both plans share that granularity problem and B at least meets the structural contract."}}, "nano": {"output": "## Topics\n- Quality designed into the workflow vs inspected at the end\n- Defects as a system-design outcome (not “people trying less hard”)\n- Upstream design changes that prevent recurring defects (Tasklane example)\n- Relating fixes to designed-in quality thinking (defect/first-time-right mindset)\n\n## Scope Envelope\n- **Allowed:**\n  - Distinguish designing quality into a process from inspecting quality at the end, using a small-business example.\n  - Explain why defects come from how the work is designed (not from people trying less hard), and identify one upstream design change that would prevent a recurring defect.\n- **Forbidden:**\n  - Full PDCA execution cycles (plan/do/check/act steps end-to-end)\n  - Root cause analysis techniques (e.g., 5 Whys / fishbone) beyond naming an upstream design lever\n  - KPI monitoring / anomaly detection loops\n  - Lean waste taxonomy (e.g., waiting, overprocessing, extra motion) as the primary organizing lens\n\n## Mastery Outcomes\n- Distinguish designing quality into a process from inspecting quality at the end, using a small-business example.\n- Explain why defects come from how the work is designed (not from people trying less hard), and identify one upstream design change that would prevent a recurring defect.\n\n## New Concepts Introduced\n- **Designing quality into a process (prevention):** make the “right thing” the easiest and most likely thing to happen during the workflow, so defects never fully enter the system.\n- **Inspecting quality at the end (detection/rework):** rely on later checks (reviews, catch-and-fix, re-reading) after work has already been performed.\n- **“Defects come from the design”:** recurring defects signal a repeatable system failure mode (e.g., information design, decision rules, handoffs), not primarily individual effort.\n\n## General remarks / tips\n- Use Tasklane as the running example: the goal is to label where quality is *created* (during ticket intake/triage), versus where quality is *caught* (after a bad reply went out).\n- Keep answers concrete: every claim should map to a specific point in the support workflow (intake → routing/triage → draft reply → send → customer follow-up).\n- When the student answers “people should be more careful,” pivot to: *what feature/process made the mistake likely?* Then propose an upstream change that removes the likelihood.\n\n## Things to Avoid\n- Don’t start teaching PDCA, KPIs, or root-cause tools in depth (those are later lessons/parts of the unit).\n- Don’t generalize into “be better people” or “hire more staff” arguments.\n- Don’t discuss onboarding/sync/billing as separate mini-lessons—keep them tied to the “inspection vs prevention” contrast.\n- Don’t reinforce recently taught concepts with heavy repetition: prior work on **upstream vs downstream fixes** was practiced earlier (timestamp: **2026-08-27T13:53:51.710Z**), so focus this lesson on *cleanly distinguishing* “designing quality in” vs “inspecting at the end,” using Tasklane.\n\n## Student teaching preferences summary\n- No explicit preferences given.\n- Based on past performance, the student learns well when:\n  - Concepts are anchored to a specific workflow story (a “mental movie” of steps).\n  - The learner can classify options as *upstream vs downstream* and justify with a concrete system change.\n- Likely needs targeted practice on precision in distinguishing:\n  - **Quality design** vs **quality inspection**\n  - Prevention (“change the design so it can’t fail the same way”) vs detection (“catch it after it fails and rework”)\n\n## Teaching instructions\n- Frame the lesson using Tasklane’s AI suggested-reply tool incident:\n  - Identify the *inspection-like* behavior currently happening (quality is checked after a misfire, visible via reopened tickets / follow-ups).\n  - Identify the *prevention-like* opportunities in the workflow (where ticket routing, reply selection, or article matching could be redesigned so onboarding questions don’t trigger confidently wrong billing articles).\n- Use a guided compare-and-label activity:\n  - Present 2–3 short Tasklane workflow snippets (e.g., “agent sends AI reply immediately” vs “agent re-checks after sending”).\n  - Ask the student to label each snippet as **designing quality in** or **inspecting quality at the end**, and explain *why* in one sentence tied to timing (“during the work” vs “after the work”).\n- Teach the “defects come from design” rationale with a student-friendly rule:\n  - If a defect repeats, it likely comes from a repeatable system property (e.g., wrong routing rules, weak input cues, lack of guardrails for onboarding vs billing intent).\n- Close with an applied prompt:\n  - Ask the student to name **one upstream design change** (not staffing) that would prevent a recurring defect in Tasklane support—specifically for onboarding confusion caused by the AI tool misfiring.\n  - Require justification using the prevention logic (“this stops the wrong reply from being generated/sent in the first place”).", "scores": {"section_structure": 1, "golden_similarity": 0.8945562903795768, "instruction_adherence": 1, "retrieval_grounding": 0.97, "golden_agreement": 0.6, "pairwise_preference": 0.75}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan centers entirely on the lesson-specific directive—separating inspection (catching bad tickets after they exist) from design changes (preventing bad tickets), using Tasklane and its AI suggested-reply misfire. It respects the forbidden scope (no full PDCA, root-cause tools, KPI loops, or lean waste taxonomy) and avoids re-teaching upstream/downstream fixes, staying consistent with all applicable instructions.", "retrieval_grounding": "All claims about the student trace to the summaries: prior practice on upstream vs downstream fixes (with matching 2026-08-27 timestamp), the 'mental movie' workflow-story learning strength, and success with classify-and-justify tasks are all documented. The Tasklane scenario details are lesson framing rather than claims about prior student knowledge, and the plan appropriately treats quality-design-vs-inspection as new material needing practice rather than assumed mastery.", "golden_agreement": "The candidate matches the reference's core topics, mastery outcomes, anti-blame stance, avoidance of PDCA/5 Whys/Lean waste, and reuse of the Tasklane example without re-teaching upstream/downstream, but it entirely omits the Jidoka principle, the stop-the-line concept, and the video—a major topic, new concept, and teaching step in the reference. It also omits the percentage-math caution and some forbidden items (poka-yoke, Unit 5 material).", "pairwise_preference": "Both orders agreed (0.75 / 0.75). Both cover the outcomes and ground personalisation in the summaries, but Plan B violates the high-level-only rule with a numbered step-by-step lesson script including an exact (unverifiable) video URL, and introduces Jidoka/andon material beyond the lesson's stated scope. Plan A stays closer to guidance-level instructions with a clean scope envelope, though its activity detail is also borderline, making the gap modest."}}, "haiku": {"output": "# Lesson Plan: Quality Designed In, Not Inspected In\n\n## Topics\n\n- Inspection vs. prevention: two fundamentally different approaches to quality\n- Quality as a design property, not an outcome of effort\n- Defects as signals of process design flaws, not people problems\n- Upstream design changes that prevent defects at the source\n- Applied example: Tasklane support operations (onboarding confusion, sync bugs, billing tickets)\n\n---\n\n## Scope Envelope\n\n**Allowed:**\n- Distinguishing designed-in quality from end-of-process inspection using the Tasklane scenario\n- Identifying recurring defects in Tasklane workflows (onboarding confusion, sync bugs, misfiring AI suggested replies)\n- Proposing upstream design changes to prevent defects (e.g., improving in-app invite UX, fixing sync architecture, refining AI training/guardrails)\n- Connecting defect rate and first-time-right rate to process design choices\n- The principle of Jidoka (stopping at the moment a defect appears to prevent propagation)\n- Basic percentage calculations for defect rates and first-time-right rates\n\n**Forbidden (out-of-scope):**\n- Detailed AI model training or machine-learning architecture\n- Building a full support ticketing system from scratch\n- Detailed financial modeling of support costs\n- Advanced statistical process control or Six Sigma methodologies\n- Forecasting demand using time-series models beyond simple moving averages\n- Advanced root-cause analysis frameworks beyond 5 Whys (covered in a later lesson)\n\n---\n\n## Mastery Outcomes\n\n- **Distinguish designing quality into a process from inspecting quality at the end, using a small-business example.**\n- **Explain why defects come from how the work is designed (not from people trying less hard), and identify one upstream design change that would prevent a recurring defect.**\n\n---\n\n## New Concepts Introduced\n\n1. **Quality by design vs. quality by inspection**  \n   - Design: embedding guardrails and clarity into the process itself so defects cannot happen  \n   - Inspection: checking work after it's done and catching errors downstream  \n\n2. **Jidoka principle**  \n   - The practice of stopping work immediately when a defect appears, rather than allowing bad work to flow downstream  \n   - Applies to both machines and human processes  \n\n3. **Process design as the root of defects**  \n   - Defects come from unclear steps, missing information, poor handoffs, or ambiguous requirements—not from people \"trying less hard\"  \n   - Changing the process design prevents recurrence; checking individuals after the fact does not  \n\n4. **Defect rate and first-time-right rate relationship**  \n   - Defect rate = (defects ÷ total attempts) × 100  \n   - First-time-right rate = 100% − defect rate  \n   - Both metrics reveal whether the process itself is sound  \n\n5. **Upstream design change**  \n   - A modification to how work flows, what information is available, or what the interface/instructions look like—made *before* work begins, not after  \n   - Examples: clarifying on-screen instructions, redesigning a form, fixing a sync algorithm, refining AI guardrails  \n\n---\n\n## General Remarks / Tips\n\n- **Use Tasklane throughout.** The scenario is rich and realistic: Priya and her 4-person support team are drowning in tickets, the AI suggested-reply tool is both helping and misfiring, and the team is firefighting. This is where the student can see the difference between \"make people check their work harder\" (inspection) and \"fix why the work goes wrong in the first place\" (design).\n\n- **Percentage fluency matters.** The student has shown medium confidence converting defect counts to percentages. Continue practicing with real Tasklane numbers so they internalize the math and gain confidence reading quality signals.\n\n- **Emphasize process blame, not people blame.** This is a mindset shift. The student has already demonstrated strong understanding of reframing people problems as process problems in earlier lessons (dated 2026-08-10). Reinforce that insight here: onboarding confusion is not because users are dumb; it's because the in-app invite flow is unclear.\n\n- **Show the video on Jidoka early.** It concretely illustrates the principle of stopping at defect detection. Use it to anchor the idea that quality is built in, not fixed later.\n\n- **Concrete, testable design changes.** The student is comfortable identifying upstream fixes (e.g., redesigning the in-app invite screen). Push them to name *specific* design changes and predict their effect on defect rate and first-time-right rate.\n\n- **First-time-right as the real KPI.** Defect rate and first-time-right rate are inverses, but first-time-right feels more positive and outcome-focused for operations. Use both but emphasize first-time-right as the measure of whether the process design is actually working.\n\n---\n\n## Things to Avoid\n\n- **Do not frame quality as individual accountability.** Avoid language like \"agents need to be more careful\" or \"users need to be smarter.\" Redirect to process design every time.\n\n- **Do not introduce Six Sigma, DMAIC, or advanced control charts.** Root cause analysis (5 Whys) comes in a later lesson. Stay focused on the design/inspection distinction and upstream changes.\n\n- **Do not overstate the role of inspection.** Inspection has a place (e.g., Tasklane's billing QA before sending), but frame it as a *temporary safety net*, not the real solution.\n\n- **Do not use percentage examples the student hasn't calculated themselves.** If introducing new numbers, walk through the calculation or let them do it.\n\n- **Do not conflate defect rate with customer satisfaction.** They are related but not identical. A low defect rate does not automatically mean happy customers if response time is slow.\n\n- **Do not preview later lessons** (e.g., PDCA loops, advanced KPI monitoring). This lesson stops at identifying the design change; the execution and measurement happens in the next lesson on improvement loops.\n\n---\n\n## Student Teaching Preferences Summary\n\nNo specific learning preferences documented. Proceed with a mix of concrete scenarios (Tasklane), visual aids (Jidoka video), guided calculation practice, and open-ended design challenges.\n\n---\n\n## Teaching Instructions\n\n### 1. **Open with the Tasklane Crisis (5–10 min)**\n\nSet the scene: Priya's 4-person support team, ~12,000 active users, 40% volume growth in one quarter with flat headcount. First-response time has crept from 4h to 14h. Reopened-ticket rate is climbing. The team is firefighting.\n\nName the three ticket categories:\n- Onboarding confusion (can't find how to invite teammates)\n- Recurring sync bug (desktop ↔ web app mismatch)\n- Billing/plan-change questions\n\nAsk: *\"What do you think Priya's instinct is? Does she blame the agents, or does she look at the process?\"*\n\n### 2. **Show the Jidoka Video (3–4 min)**\n\nUse the show-video-widget tool to play the animated explainer on Jidoka (https://www.youtube.com/watch?v=vCpjW-rnplc). It shows how stopping work at the moment a defect appears prevents bad work from flowing downstream.\n\nAfter the video, ask: *\"How does the idea of stopping at the defect apply to Tasklane? What would that look like for onboarding tickets or the sync bug?\"*\n\n### 3. **Distinguish Inspection from Design (10–12 min)**\n\nDraw two parallel processes on screen or whiteboard:\n\n**Path A: Inspection (Downstream, Reactive)**\n- Agent answers ticket poorly → Customer is confused → Customer sends another message → Ticket gets reopened → Agent reworks it\n- Example for Tasklane: Priya requires agents to double-check their replies before sending\n\n**Path B: Design (Upstream, Preventive)**\n- Improve the in-app invite flow so users don't open a ticket in the first place\n- Fix the sync algorithm so the desktop and web app don't diverge\n- Refine the AI suggested-reply tool so it doesn't send users to the wrong help article\n\nAsk the student to identify at least one example for each of Tasklane's three problem categories. What would a design fix look like?\n\n### 4. **Introduce Defect Rate and First-Time-Right Rate (8–10 min)**\n\nDefine both clearly:\n- **Defect rate** = (number of defects ÷ total attempts) × 100\n- **First-time-right rate** = 100% − defect rate\n\nWalk through a concrete Tasklane example:\n- Last week: 80 support tickets, 12 required rework (defects)\n- Defect rate = (12 ÷ 80) × 100 = 15%\n- First-time-right rate = 100% − 15% = 85%\n\nHave the student calculate a second example with different numbers (e.g., 100 tickets, 8 defects). Reinforce the `defects ÷ total × 100` formula. This addresses the medium-confidence gap in percentage fluency from the earlier \"Variability and hidden cost\" lesson (2026-08-27).\n\n### 5. **Connect Metrics to Process Design (8–10 min)**\n\nExplain: *\"A 15% defect rate doesn't mean the agents aren't trying hard enough. It means the process itself is designed in a way that generates defects.\"*\n\nExamples:\n- **Onboarding confusion defect:** The in-app \"Invite teammates\" button is hidden under a menu. Design fix → make it visible on the board. Defect rate drops.\n- **Sync bug defect:** The desktop app caches data locally but doesn't sync back reliably. Design fix → redesign the sync protocol. Defect rate drops.\n- **Billing defect:** The AI suggested-reply tool is trained on old help articles. Design fix → retrain the tool or add guardrails so it flags uncertain matches. Defect rate drops.\n\nAsk: *\"In each case, does requiring the agent to 'be more careful' fix the defect? Or do we need to redesign the process?\"*\n\n### 6. **Upstream Design Changes in Tasklane (12–15 min)**\n\nPick one recurring problem from Tasklane (e.g., onboarding confusion). Walk the student through identifying a design change:\n\n1. **What is the defect?** Customers can't find how to invite teammates.\n2. **Why is it happening?** The invite button is buried; users don't know it exists.\n3. **What is the process design flaw?** The UI doesn't make the action obvious.\n4. **What is the upstream design change?** Move the \"Invite\" button to the main board view, or add a prominent tooltip when a new board is created.\n5. **How would you measure success?** Track the defect rate for onboarding tickets and first-time-right rate. If the design works, both improve.\n\nRepeat this loop for one more problem (sync bug or billing). Have the student propose the design change and predict the effect.\n\n### 7. **Close with the Mindset Shift (5 min)**\n\nReinforce: *\"Defects come from how the work is designed, not from how hard people try. If you see a high defect rate, don't tell people to try harder. Redesign the process so defects can't happen in the first place.\"*\n\nAsk: *\"Looking back at Tasklane, what's one design change you would make first to reduce the reopened-ticket rate?\"*\n\nDocument their answer. This sets up the next lesson on improvement loops, where they will plan a full PDCA cycle around this change.\n\n---\n\n**Note:** Do not attempt to grade or \"score\" the student's design proposals in this lesson. The goal is fluency in distinguishing inspection from prevention and comfort identifying upstream changes. Formal assessment and decision-making under uncertainty (e.g., which change to prioritize) comes in the Unit 4 capstone.", "scores": {"section_structure": 1, "golden_similarity": 0.8325436120763884, "instruction_adherence": 1, "pairwise_preference": 0, "retrieval_grounding": 1, "golden_agreement": 0.75}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan uses Tasklane as the central applied example throughout and directly delivers the lesson-specific directive: it separates inspection (catching bad tickets after they exist, e.g., double-checking replies, reopened tickets) from design changes (preventing tickets via invite UX, sync fixes, AI guardrails). It respects the forbidden scope (no Six Sigma, defers 5 Whys and PDCA to later lessons) and follows the process-not-people framing.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A violates the high-level-only requirement with a fully scripted, timed, step-by-step lesson (plus an extra 'Note' section beyond the eight allowed), while Plan B covers both outcomes, keeps the scope envelope tight with an explicit forbidden list, grounds personalisation in the retrieved summaries, and keeps teaching instructions appropriately brief.", "retrieval_grounding": "Every claim about the student is traceable to the summaries: medium-confidence percentage fluency and the defect-rate gap match the 2026-08-27 variation lesson, the people-vs-process reframing matches the 2026-08-10 lesson, and comfort identifying upstream fixes (in-app invite redesign) is explicitly evidenced. The plan also correctly notes no documented learning preferences rather than inventing any.", "golden_agreement": "The candidate matches the reference on topics, mastery outcomes, the Jidoka video (same URL), Tasklane anchor example, process-not-people framing, and forbidding 5 Whys/PDCA/later material. However, it contradicts the reference's decision to keep math light by making defect-rate and first-time-right calculations a substantial focus, shows the video before (not after) the inspection-vs-design contrast, and omits the note that the student just mastered upstream/downstream and shouldn't have definitions re-taught."}}}}, {"id": "bcc5f254-862f-4ecf-9036-ba907af02a3e", "course": "American history since world war II", "fingerprint": "e0028ae57e18", "production": "1. Topics  \n   • Cold-War defense funding and the birth of ARPANET  \n   • Open networking standards (RFC process, TCP/IP, layered architecture)  \n   • Governance norms (academic–military collaboration → IETF & “rough consensus and running code”)  \n   • Commercialization: NSF-NET hand-off, network effects, path dependence, market concentration  \n   • Long-tail consequences: security, privacy, and competition problems baked in by early choices  \n\n2. Scope Envelope  \n   Allowed (within lesson)  \n   1. Defense research motives behind packet-switching and internetworking  \n   2. Technical choices such as end-to-end principle, open protocols, address space limits  \n   3. Governance choices (RFCs, IANA, permissionless innovation ethos)  \n   4. How openness encouraged adoption, network effects, and later market power  \n   5. Resulting security & privacy challenges (lack of encryption/authentication by default)  \n\n   Forbidden (out-of-scope today)  \n   • Post-1995 supply-chain globalization & digital capitalism  \n   • Soviet collapse and the “unipolar moment”  \n   • 9/11, asymmetric warfare, Patriot Act, modern surveillance state  \n   • Mobile-platform or social-media politics  \n   • Modern AI breakthroughs, big-data policy, or algorithmic accountability  \n   • Detailed cryptography implementations (TLS, quantum-safe, etc.)  \n   • Edge networking (5G/Starlink), Internet-of-Things, or metaverse visions  \n   • Any programming instruction unrelated to historical analysis (Python, guard clauses, indexing, etc.)  \n   • Psychological research ethics, Milgram/Zimbardo, behavioral biases  \n   • All other unit-1 Cold-War events unless used only as brief background context  \n\n3. Mastery Outcomes  \n   – Understand how Cold War military research priorities produced open networking standards that enabled the shift from ARPANET to a global civilian internet.  \n   – Explain how early technical and governance choices shaped later challenges, including security, privacy, and market concentration.  \n\n4. New Concepts Introduced  \n   • Packet switching vs. circuit switching  \n   • ARPA’s “resource sharing” mandate  \n   • End-to-end principle  \n   • TCP/IP stack & layered architecture  \n   • RFC (Request for Comments) process / “rough consensus and running code”  \n   • IANA address allocation & scarcity  \n   • Permissionless innovation vs. managed standards  \n   • Network effects vs. switching costs (reinforce prior partial understanding)  \n   • Path dependence in technical systems  \n\n5. General remarks / tips  \n   • Anchor explanations to the student’s prior knowledge of defense funding, platform openness, and network effects.  \n   • Keep chronology light; emphasise causal reasoning (problem → design choice → long-run impact).  \n   • Use comparison prompts (e.g., ARPANET vs. SAGE command network) to piggy-back on what was learned yesterday (2026-08-26T20:11:15.168Z).  \n   • Show the required video: use show-video-widget with URL https://www.youtube.com/watch?v=TNQsmPf24go near the middle to visualise packet travel.  \n   • Insert at least two closed-question widgets (multi-select) to check:  \n     - Difference between network effects & switching costs (addresses a gap).  \n     - Which early design choices made later security fixes harder.  \n   • When discussing security/privacy, tie back to the student’s SIGINT lessons without previewing 9/11 content.  \n\n6. Things to Avoid  \n   • Do NOT discuss later-unit topics (mobile social media, AI, supply-chain globalization).  \n   • Avoid deep protocol minutiae (e.g., header bit fields) that drift into computer-science detail.  \n   • No moralizing about “good” or “bad” tech actors; focus on incentives and constraints.  \n   • Do not repeat concepts taught earlier today (none so far).  \n   • Steer clear of low-level coding demonstrations.  \n\n7. Student teaching preferences summary  \n   – No explicit preferences provided. Continue using interactive reasoning, concrete historical problems, and short multiple-choice checks. Student responds well to causal chains and trade-off discussions; reinforce distinctions they have previously blurred (e.g., network effects vs. switching costs).  \n\n8. Teaching instructions  \n   • Open with the recognizable problem: “How can geographically dispersed military computers share scarce mainframe time under nuclear-threat constraints?”  \n   • Map ARPA funding logic → packet switching → openness ethos.  \n   • After foundational explanation, play the video via show-video-widget to visualise packet flow.  \n   • Facilitate a guided comparison: SAGE (centralised, closed, secure) vs. ARPANET (distributed, open, research-oriented).  \n   • Use Socratic prompts to surface incentives behind open RFC culture; pivot into network-effects discussion, explicitly contrasting , including today’s debates around computing, platforms, surveillance, globalization, and artificial intelligence.\n\nThe course is designed to strengthen contextual reasoning, judgment, and systems thinking that complement technical training. It emphasizes explanation, causality, and pattern recognition over narrative coverage or moral evaluation.\n\n---\n\n## Overall Course Teaching Guidelines\n\n- **Use visualization** tools to create a richer, more engaging, and more interactive learning experience.\n- Emphasize reasoning about decisions, constraints, and consequences rather than historical storytelling or memorization.\n- Frame history as a sequence of problem-solving attempts made under uncertainty, limited information, and competing incentives.\n- Maintain a steady rhythm of explanation, comparison, and guided reasoning.\n- Avoid deep theoretical language or formal historiography. Focus on applied understanding.\n- When questions are used, prioritize reasoning paths and judgment over factual recall.\n- Use the available tools to enhance the learning experience, including illustrations and closed-question.\n\n---\n\n## Lesson Type Framework\n\nEvery lesson in the course should be planned and delivered according to the following guidlines. In this course all lesson are: **Exposure and Introduction Lessons**\n\nThese lessons introduce new historical problems, systems, or ways of thinking.\n\nGuidelines:\n\n- Begin with a recognizable problem such as security, coordination, trust, scale, or legitimacy.\n- Frame historical actors as decision-makers responding to constraints.\n- Introduce new concepts as tools for explaining observed outcomes.\n- Keep explanations focused and example-driven.\n- Avoid exhaustive timelines, moral judgment, or edge cases.\n- Establish intuition before adding structure.\n\nThese lessons are most common at the start of each unit.\n\n## Chronology and Conceptual Sequencing\n\nThe course does not follow strict chronology at all times.\n\nGuidelines:\n\n- Some lessons are placed for conceptual clarity rather than date order.\n- The Tutor should clarify when a topic is used as an analytical lens rather than a chronological step.\n- Events such as Vietnam, media expansion, and legitimacy crises should be framed around their systemic implications, not only their timelines.\n\nThis approach supports deeper reasoning while maintaining historical coherence.\n\n---\n\n## Technology Across the Course\n\nThroughout the course:\n\n- Do not rely on technical capability alone.\n- Provide historical context and explain the events that led to the outcome.\n\nThis framing aligns historical analysis with the students’ technical education.\n\n---\n\n## Assessment and Questioning Philosophy\n\n- Students should be rewarded for understanding why decisions made sense at the time.\n- Questions should be fun and engaging, while testing interpretation, tradeoffs, and systems thinking.\n- Closed questions, when used, should validate correct reasoning paths rather than precise factual recall.", "unit": "Students follow the shift from midcentury consensus to a market oriented, networked, and security focused society. The unit emphasizes how globalization, the internet, 9/11, social media, and AI reshaped power, democracy, and everyday life.", "lesson": "You investigate how ARPANET era goals evolved into protocols, governance norms, and commercial infrastructure."}, "models": {"luna": {"output": "## Topics\n\n- Cold War military research and ARPANET\n- Open networking standards and interoperability\n- The transition from ARPANET to civilian internet infrastructure\n- Early governance choices and long-term consequences for security, privacy, and market concentration\n\n## Scope Envelope\n\n**Allowed:**\n\n- How Cold War military priorities encouraged investment in resilient computer networking research\n- How ARPANET’s packet-switching approach and open communication protocols supported interoperability among different networks\n- How research networks shifted toward civilian, academic, and commercial use\n- How decentralized design and early governance choices created both opportunities and limitations\n- How technical and institutional choices contributed to later concerns about security, privacy, and concentrated market power\n\n**Forbidden:**\n\n- Globalization, international supply chains, and digital capitalism as broader economic systems\n- The end of the Cold War and the Soviet collapse\n- 9/11, asymmetric warfare, counterterrorism, and the post-9/11 security state\n- Mobile technology, smartphones, social media, algorithms, political polarization, and digital mobilization\n- Artificial intelligence, machine learning, data-driven automation, and AI governance\n- Detailed personal-computer platform history beyond brief previously learned comparisons involving openness, network effects, and lock-in\n- Later internet history centered on web browsers, search engines, online advertising, social-media platforms, or specific modern technology companies\n- Technical programming instruction, networking configuration, cybersecurity procedures, or cryptographic implementation\n\n## Mastery Outcomes\n\n- Understand how Cold War military research priorities produced open networking standards that enabled the shift from ARPANET to a global civilian internet.\n- Explain how early technical and governance choices shaped later challenges, including security, privacy, and market concentration.\n\n## New Concepts Introduced\n\n- **ARPANET:** An early packet-switched computer network supported by ARPA that connected research institutions and demonstrated networking across distant computers.\n- **Packet switching:** A method of breaking messages into smaller units that can travel through a network and be reassembled at the destination, supporting flexible use of communication routes.\n- **Open networking standards:** Shared technical rules that allow independently designed computers and networks to communicate.\n- **Interoperability:** The ability of different systems to exchange information and function together.\n- **Decentralized network design:** Organizing communication so that no single central pathway must carry every message, increasing flexibility and resilience.\n- **Protocol:** An agreed set of rules governing how systems communicate.\n- **Civilian internet transition:** The movement from primarily military- and research-oriented networking toward broader academic, public, and commercial use.\n- **Governance choices:** Decisions about who controls standards, access, coordination, and network development.\n- **Path dependence:** The idea that early design and institutional choices can make certain later outcomes more likely.\n- **Security, privacy, and concentration trade-offs:** The possibility that a network designed for openness and collaboration may require later protections, while widespread adoption can also increase the importance and influence of large infrastructure or service providers.\n\n## General remarks / tips\n\n- Begin with the recognizable problem of connecting computers owned by different institutions without requiring one central machine or one manufacturer to control the entire system.\n- Build explicitly on the student’s demonstrated understanding that Cold War threats accelerated computing research and that ARPA/Pentagon funding supported advanced technical work. Those concepts were last practiced at **2026-08-26T20:11:15.168Z** and should be connected rather than retaught from scratch.\n- Use a visual causal chain: **Cold War threat concerns → government-funded research → ARPANET experimentation → open protocols → interoperable networks → civilian expansion → new governance and social consequences**.\n- Emphasize why choices made sense at the time. Open standards reduced barriers between institutions and encouraged experimentation, while decentralized routing addressed concerns about fragile communication systems.\n- Contrast interoperability with platform lock-in using the student’s prior understanding from **2026-08-25T21:16:30.762Z**: openness can expand adoption and complementary ecosystems, but widespread adoption can also create dependence on influential infrastructure.\n- Ask the student to distinguish technical design choices from governance choices. A protocol determines how systems communicate; governance determines who establishes, maintains, and applies shared rules.\n- Include brief “what would you choose?” scenarios involving resilience, compatibility, access, and control. Ask for the trade-off and causal mechanism, not just a preference.\n- Use the required video by presenting the video widget with the exact URL: `https://www.youtube.com/watch?v=TNQsmPf24go`.\n- Use closed questions selectively to check distinctions such as packet switching versus a single dedicated route, open standards versus a proprietary system, and technical causes versus governance causes. For each closed question, specify single or multiple selection, list every answer choice, mark the correct answer(s), and instruct the teaching agent to use the show-closed-question-widget tool.\n- End with a short synthesis requiring the student to explain how a military research project became civilian infrastructure and identify one benefit and one later challenge produced by its early choices.\n\n## Things to Avoid\n\n- Do not present the internet as a purely accidental civilian invention or as a technology created solely for military communication.\n- Do not claim that ARPANET was designed specifically to create today’s commercial internet; explain the gradual transition from research networking to wider civilian use.\n- Do not imply that packet switching alone guaranteed security, privacy, or resilience in every circumstance.\n- Do not treat “decentralized” as meaning that no institutions, standards bodies, firms, or administrators were involved.\n- Do not collapse open standards, public access, and government ter challenges, including security, privacy, and market concentration.\n\n## New Concepts Introduced\n- **Open networking standards** (as a design goal): why making interfaces broadly usable can help many networks connect.\n- **From a research network to a public internet**: the idea that early choices about openness and interoperability make civilian adoption easier.\n- **Early governance norms in networking** (high-level): how “who gets to decide rules” and “how standards get adopted” affects later trust and power.\n- **Why security/privacy/market concentration issues show up later**: a cause-and-effect lens connecting early architecture/governance tradeoffs to later outcomes.\n\n## General remarks / tips\n- Keep the lesson framed as *decision-making under constraints*: Cold War needs created pressure for communication that could scale and survive disruptions; openness made it easier for more institutions to build and interconnect.\n- Use a “chain of reasoning” format the student can reuse:\n  1) Constraint → 2) Design choice → 3) Adoption pathway → 4) Long-term consequence (security/privacy/market structure).\n- Because the student previously showed understanding of *systems integration* (e.g., SAGE) and *ecosystems/feedback loops* (e.g., PC lock-in/network effects), connect today’s networking story to those same systems ideas—without assuming technical depth.\n\n## Things to Avoid\n- Don’t go into encryption details or specific cyber-attack case studies.\n- Don’t name or preview later-unit topics beyond what’s necessary for the consequences lens (security/privacy/market concentration only at a high level).\n- Don’t present the internet as a single straight-line invention; emphasize tradeoffs and institutional incentives.\n- Don’t over-technicalize: no packet formats, router implementation, or standards-body politics beyond a simple “how rules get adopted” framing.\n\n## Student teaching preferences summary\n- No specific learning preferences were provided.\n- The student benefits from:\n  - Clear causal explanations (why X happened and how it led to Y)\n  - Systems thinking and “how components fit together”\n  - Concrete examples and structured reasoning prompts (chains, tradeoffs)\n\n## Teaching instructions\n- **Start with a motivating problem:** “How did a Cold War military networking effort end up powering the civilian internet—and why do today’s security and privacy problems trace back to early choices?”\n- **Anchor intuition with the required video:** Play the “How Does the Internet Work?” video to give the student a shared mental model before discussing historical causation.\n- **Introduce the core causal chain (guided, not lecture-heavy):**\n  - Cold War priorities created demand for reliable, scalable communication between distant systems.\n  - This pressure shaped technical choices toward networking that could interconnect broadly (interoperability) rather than stay isolated.\n  - “Open networking standards” and interoperability norms lowered the friction for other institutions (universities, then industry) to attach compatible networks.\n  - As more participants adopted compatible approaches, the civilian internet could grow globally.\n- **Add governance as a second causal layer:**\n  - Discuss how early “rules of the road” for networking (who sets standards / how standards spread) affect later outcomes.\n  - Emphasize that governance and adoption pathways influence:\n    - **Security** challenges (e.g., if early decisions optimized openness/compatibility, security sometimes had to catch up later)\n    - **Privacy** challenges (e.g., if the network wasn’t originally designed around privacy constraints, later systems repurpose it in privacy-risk ways)\n    - **Market concentration** pressures (e.g., if interoperability standards enable scaling, major platforms can dominate due to network effects, distribution, and control of services built on top)\n- **Use 2 short checks for understanding (mix of open reasoning +
