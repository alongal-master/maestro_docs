and explaining “why leaders might think X would work”).\n- Because the student has recently been taught a decision framework and alternative-policy comparison, connect today’s lens explicitly to “how leaders compare options under uncertainty,” but avoid re-teaching the 1945 atomic-bomb lesson details.\n- For engagement, use a “choice under uncertainty” format: present a situation, ask what the rational goal is (prevent attack, signal resolve, limit loss), then explain how escalation risk still rises.\n\n## Things to Avoid\n- No previews of later Cold War/tech course topics (information advantage, surveillance systems, or later alliance/IC/AI themes beyond what’s necessary for this mastery outcome).\n- Don’t reduce deterrence to “just psychological bullying” or “least pushback”; explicitly include **uncertainty**, **misinterpretation**, and **institutional incentives** in the explanation.\n- Don’t do moralizing (“they were evil”) or purely outcome-based explanations (“it failed so it was wrong”).\n- Don’t introduce unexplained jargon—define every new term the first time it appears in simple language.\n\n## Student teaching preferences summary\n- Best fit: **scenario-based explanation** and **tradeoff reasoning** (student performs well when asked “what would leaders choose and why?”).\n- The student may ask for “what’s most important”; therefore, scaffold answers with a consistent structure:  \n  **Goal → Options → Tradeoffs → Why that creates the next risk.**\n- Encourage generation of causal statements (not just labeling): the student benefits from prompts that require “because X, therefore Y.”\n\n## Teaching instructions\n- **Warm problem opener:** Present a short, generic “crisis signaling” scenario (two sides, high stakes, uncertainty about the other side’s intent). Ask the student what each side is trying to achieve in the moment (deterrence goals) and what could go wrong (escalation pathway).\n- **Introduce deterrence as a tool for reasoning:** Explain deterrence as a logic that works by shaping expectations of retaliation costs, then ask the student to translate that into one causal sentence: “Deterrence works here because…”\n- **Introduce escalation mechanics as the paradox partner:** Explain escalation as a process where ambiguous moves increase perceived threat and time pressure, making leaders more likely to take harsher actions. Have the student complete the causal chain: “If leaders fear misreading, then…”\n- **Flashpoints as reinforcement (institutional learning):** Use a classroom-friendly flashpoint template (not a detailed event timeline):  \n  - What did leaders learn/assume?  \n  - What did institutions change (plans, deployments, commitments)?  \n  - How did that increase militarization and deepen alliances over time?\n- **Guided practice via 2 short explanations (no memorization):**\n  1. “Why deterrence can reduce some risks…” (student writes a 3–4 sentence causal explanation).\n  2. “Why it can still create catastrophe pathways…” (student identifies one escalation pathway).\n- **Close with a synthesis check:** Ask the student to state the lesson’s “one-paragraph model” connecting: deterrence logic → reduced some attacks → escalation/misreading pathways → flashpoints reinforcing long-term militarization/alliance structure.", "scores": {"section_structure": 1, "golden_similarity": 0.8762058956200697, "instruction_adherence": 0.9, "retrieval_grounding": 1, "golden_agreement": 0.55, "pairwise_preference": 0.25}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan closely follows the lesson's core directives—deterrence/escalation logic, flashpoints as reinforcement, tradeoff and scenario-based reasoning under uncertainty—and explicitly respects the course's emphasis on decisions/constraints over memorization, moral judgment, and later-course topics. The only minor gap is that the course-level guidance to use visualization tools and closed-question tools is not reflected, though the plan otherwise fits an exposure-lesson format well.", "retrieval_grounding": "Every claim about the student traces to the summaries: cost-benefit and comparative-policy strengths and the recent decision-framework lesson come from the 2026-08-27 atomic-bomb lesson; the 'bully tactic'/'least pushback' caution is directly quoted from that summary; the 'what's most important' habit appears in the Milgram lesson; and the need for explicit causal 'because X, therefore Y' prompts matches the noted gap requiring specific causal explanations. No unsupported mastery or preference claims were made.", "golden_agreement": "The candidate matches the mastery outcomes, scenario/tradeoff teaching approach, avoidance of moral judgments and later-Cold-War previews, and the redirection away from 'bully' framing, but it omits key reference decisions: concrete case studies (1948 Berlin crisis, Korean War), NATO alliance formation, security dilemma and second-strike concepts, connecting to the student's prior 1945 atomic-bomb lesson, and closed-question widgets. It also somewhat contradicts the reference by deliberately forbidding detailed treatment of specific events in favor of generic scenarios, whereas the reference builds the lesson around those specific flashpoints.", "pairwise_preference": "Both orders agreed (0.25 / 0.25). Plan B gives a genuinely explicit, complete forbidden-topics list and names concrete early flashpoints (Berlin 1948, Korea) that directly serve the second mastery outcome, while its personalisation (e.g., correcting the 'bully tactic' framing) is grounded in the summaries. Plan A's forbidden list is vague ('any later-course concepts'), its flashpoint coverage stays generic, and its teaching instructions drift further into scripted step-by-step practice."}}, "haiku": {"output": "# Lesson Plan: Deterrence, Escalation, and the Birth of the Cold War\n\n## Topics\n\n- **Nuclear deterrence logic and mutual vulnerability**\n- **Risk reduction through credible threat, and unintended pathways to catastrophe**\n- **Early Cold War flashpoints and alliance formation**\n- **Militarization as a long-term institutional response to nuclear uncertainty**\n\n---\n\n## Scope Envelope\n\n### Allowed\n- Nuclear weapons as a bargaining tool and deterrent (building on atomic bomb decision-making from Lesson 206)\n- The logic of deterrence: credible threat, mutual assured destruction concepts, and rationality assumptions\n- Early Cold War crises as tests of credibility and alliance commitment (Berlin, Korea, Cuban Missile Crisis as illustrative examples of flashpoint dynamics)\n- How security dilemmas and fear drive persistent militarization and alliance structures\n- The 1945 global power landscape and post-war U.S.–Soviet tensions (reinforcement from Lesson 206)\n\n### Forbidden\n- **McCarthy and the Red Scare** (Lesson 210)\n- **Computing, cryptography, or signals intelligence** (Lessons 208, 209)\n- **Consumer technology, television, or advertising** (Lesson 212)\n- **The space race** (Lesson 213)\n- **Vietnam War, 1970s crises, or events after 1970** (Unit 2)\n- Detailed technical specifications of nuclear weapons\n- Theoretical game theory formalism beyond intuitive payoff reasoning\n\n---\n\n## Mastery Outcomes\n\n1. **An understanding of why deterrence logic reduced some risks while creating new pathways to catastrophe.**\n2. **The ability to explain how early cold war flashpoints reinforced long-term militarization and alliance structures.**\n\n---\n\n## New Concepts Introduced\n\n- **Deterrence theory**: The logic of preventing an adversary's action by raising the cost of that action through a credible threat of retaliation.\n- **Credibility and signaling**: How military posture, commitments, and past decisions communicate resolve and capability to both allies and adversaries.\n- **Security dilemma**: The paradox in which defensive measures by one side appear threatening to another, triggering escalatory responses that leave both worse off.\n- **Flashpoints**: Specific crises or contested regions where deterrence logic is tested and stakes are made visible.\n- **Alliance formation and lock-in**: How nuclear strategy and fear create durable institutional commitments (NATO, bilateral defense treaties) that persist even when circumstances change.\n- **Mutual vulnerability**: The condition in which both superpowers possess nuclear weapons capable of devastating retaliation, raising the existential stakes of conflict.\n\n---\n\n## General Remarks / Tips\n\n### Framing\n- **Start with a recognizable problem**: Frame the lesson as a puzzle of coordination under threat. \"The U.S. has a nuclear monopoly in 1945. By 1949, the Soviets have the bomb too. Now what?\" This creates intuition for why deterrence becomes the central strategy.\n- **Emphasize decision-making under uncertainty**: Leaders in 1946–1962 did not know how rational adversaries would be, whether bluffs would work, or if escalation could be controlled. Highlight this fog, not hindsight clarity.\n- **Avoid triumphalism or moral judgment**: The goal is to explain *why* deterrence seemed like a rational response and *how* it created new risks, not to praise or blame the participants.\n\n### Reinforcement\n- **Lightly reinforce prior knowledge from Lesson 206** (2026-08-27T12:05:55.601Z): The student understands the 1945 global power landscape, the atomic bomb's dual role as military instrument and political signal, and cost-benefit reasoning. Use brief callbacks to the \"psychological shock\" of nuclear weapons and U.S. economic dominance to anchor deterrence logic.\n- **Do not introduce new atomic bomb decision mechanics**: The student has already mastered this. Move directly to *post-bomb* strategy and the implications of Soviet acquisition.\n\n### Engagement & Visualization\n- Use **timelines or diagrams** to show:\n  - The shift from U.S. nuclear monopoly (1945–1949) to Soviet capability (1949+) to rough parity (1960s).\n  - How specific crises (Berlin blockade, Korean War, Cuban Missile Crisis) fit into the deterrence framework and trigger alliance responses.\n- Use **scenario reasoning** (e.g., \"If the U.S. removes nuclear weapons from Europe, does deterrence still work?\") to surface the student's intuitions before explaining institutional lock-in.\n\n---\n\n## Things to Avoid\n\n- **Do not preview McCarthy, surveillance, or the Red Scare** (all later lessons). Keep focus narrowly on deterrence strategy and alliance structures.\n- **Do not introduce detailed game-theory notation or payoff matrices.** Keep reasoning intuitive: \"If I attack and you retaliate with nukes, we both lose everything.\"\n- **Do not moralize about nuclear weapons or the Cold War.** Frame deterrence as a problem-solving attempt made under extreme uncertainty, not as a moral choice.\n- **Do not conflate deterrence with militarization alone.** Emphasize that deterrence is *logic*, but militarization is the *institutional response* to that logic—a key distinction for mastery outcome 2.\n- **Do not rush to Cuban Missile Crisis as the \"peak\" of Cold War tension.** Instead, use crises as *examples* of how deterrence commitments are tested, not as the central lesson.\n- **Avoid the student's prior tendency to frame nuclear decisions as \"bully tactics.\"** Reframe deterrence as a system design problem: \"How do you prevent war when both sides have weapons that can destroy civilization?\"\n\n---\n\n## Student Teaching Preferences Summary\n\n- **No explicit learning preferences provided.** \n- Infer from skills memory: The student demonstrates **strong reasoning ability** (cost-benefit analysis, scenario thinking, causal explanation). They engage well with **decision-making frameworks** and **comparative analysis** (seen in Lesson 206 reasoning about invasion vs. bombing). \n- The student benefits from **sentence starters and scaffolding** when generating examples independently (noted in social-psychology lessons), but performs at intermediate–high depth when prompts are structured clearly.\n- **Avoid assumptions about the bomb being \"evil\"** or moralization; the student responds well to **neutral, analytical framing** of tough choices.\n\n---\n\n## Teaching Instructions\n\n### Opening Frame (Establish the Problem)\nBegin by setting the stage: \"In 1945, the U.S. alone has nuclear weapons. This gives enormous power. But by 1949, the Soviet Union tests its own bomb. Suddenly both sides can destroy each other. The question becomes: *How do you prevent a war when both sides have weapons that can end civilization?*\"\n\nUse a brief **visual timeline** showing the U.S. monopoly period (1945–1949) and the transition to mutual vulnerability (1949 onward). Ask: \"What changes about bargaining between the U.S. and the Soviet Union now?\"\n\n### Concept 1: Deterrence Logic as Risk Reduction\nIntroduce deterrence as a *rational response* to mutual vulnerability:\n- **Core idea**: If I have weapons you can't survive, you won't attack me, because the cost is too high.\n- **Why it reduces some risks**: With deterrence, both sides have an incentive *not* to use nuclear weapons. This can prevent large-scale wars.\n- **Use a simple scenario**: \"Imagine two people standing in a room with a bomb. If one person moves to attack, both die. Neither has an incentive to move first.\"\n\nEmphasize that **credibility is essential**. A threat only works if the other side believes you will carry it out. Explore how the U.S. and USSR signal resolve through military posture, public statements, and alliance commitments.\n\n### Concept 2: New Pathways to Catastrophe (The Dark Side of Deterrence)\nTransition to the paradox: Deterrence *logic* may prevent deliberate war, but it creates *new* dangers:\n\n1. **The security dilemma**: When the U.S. builds more nuclear weapons to deter Soviet attack, the Soviets see this as a threat and build more weapons in response. Both sides end up with more weapons but *less* security. Each side's defensive move looks offensive to the other.\n\n2. **Accidents and misunderstandings**: With weapons on alert, a miscalculation, false alarm, or misinterpretation could trigger war without intent.\n\n3. **Escalation spiral**: In a crisis, each side may raise the stakes to demonstrate resolve. But raising stakes with nuclear weapons means both sides risk mutual destruction.\n\nUse a **concrete example**: The Cuban Missile Crisis (illustrative, not exhaustive). The U.S. and USSR both saw the other's actions as threats; both had weapons ready; both believed backing down would damage credibility with allies. The crisis ended peacefully, but only narrowly.\n\n### Concept 3: Flashpoints and Alliance Formation\nIntroduce the term **flashpoint**: a region or event where deterrence logic is tested. Early Cold War flashpoints include:\n- **Berlin Blockade (1948–1949)**: The Soviets blockade West Berlin; the U.S. must decide whether to risk war over a divided city.\n- **Korean War (1950–1953)**: A regional conflict becomes a test of whether the U.S. will defend its allies.\n- **Cuban Missile Crisis (1962)**: Soviet missiles in Cuba challenge U.S. deterrence credibility in the Western Hemisphere.\n\n**Key insight**: Each flashpoint reinforces the need for **alliances** and **permanent military commitments**:\n- The U.S. forms NATO (1949) to reassure Western European allies that the U.S. will defend them with nuclear weapons if needed.\n- The U.S. maintains military bases, forward-deployed forces, and nuclear weapons around the world to signal that commitments are credible.\n- These alliances and forward positions become *locked in*—changing them risks signaling weakness or abandoning allies, so they persist even when political circumstances shift.\n\n### Concept 4: Long-Term Militarization as Institutional Response\nExplain how deterrence logic drives persistent militarization:\n- **Strategic doctrine**: The U.S. and USSR both adopt policies like \"mutually assured destruction\" (MAD) and \"continuous alert\" (weapons ready to launch 24/7).\n- **Industrial and organizational lock-in**: Military contractors, defense budgets, and military personnel all depend on continued weapons production and deployment. Institutions resist change.\n- **Path dependency**: Early choices (e.g., \"we will defend Europe with nuclear weapons\") create alliance structures that become difficult to reverse without appearing weak or unreliable.\n\n### Guided Reasoning Activity (Optional, Scenario-Based)\nPresent a structured scenario: \"It's 1955. The U.S. has nuclear weapons in Western Europe to deter Soviet attack. A new U.S. president wants to reduce these weapons to lower tensions. What happens?\"\n\nPrompt the student to reason through:\n1. **What signal does withdrawal send to allies?** (They may feel abandoned; they may develop their own nuclear weapons for security.)\n2. **What signal does withdrawal send to the Soviets?** (Weakness? Opportunity to expand influence?)\n3. **What are the costs of *keeping* weapons?** (Continued arms race, risk of accident, tension.)\n\nThis surfaces the student's grasp of credibility, alliance commitment, and the dilemma of arms control.\n\n### Closing Synthesis\nSummarize the two mastery outcomes:\n1. **Deterrence reduced the risk of deliberate war** by raising the cost of attack—but created new risks (accidents, misunderstandings, escalation spirals).\n2. **Flashpoints like Berlin, Korea, and Cuba reinforced militarization and alliances** because each crisis tested credibility and demonstrated the need for permanent military commitments to prevent war.\n\nEnd with a forward-looking question: \"If both sides are locked into nuclear deterrence and alliance structures, what changes the system? Is there a way out?\" (This previews future lessons without previewing specific content.)\n\n---\n\n**Reminder for the teaching agent**: Use the **closed-question widget** if you choose to validate understanding with multiple-choice items. Frame questions around *reasoning paths* (e.g., \"Why does the U.S. keep nuclear weapons in Europe?\" rather than \"When was NATO founded?\"). Avoid questions requiring factual recall of dates or technical details.", "scores": {"section_structure": 1, "golden_similarity": 0.8611446784714315, "instruction_adherence": 1, "pairwise_preference": 0, "golden_agreement": 0.62, "retrieval_grounding": 0.88}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan fully embodies the lesson-specific focus on how nuclear weapons changed bargaining, risk, and alliance behavior, while honoring course guidelines (systems/decision framing, no moralizing, visualization, reasoning-path closed questions) and the exposure-lesson structure (recognizable problem, actors as decision-makers, intuition before structure). It also respects explicit forbidden scope (no Red Scare, computing, space race, post-1970, or game-theory formalism) and reinforces prior lesson knowledge appropriately.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A's Teaching Instructions are a fully scripted, step-by-step lesson (scripted openings, four sequenced concepts, activities, closing synthesis), directly violating the high-level-only requirement, and it even contradicts its own Things to Avoid by leaning on the Cuban Missile Crisis. Plan B covers both outcomes, keeps a tight 4-item allowed / explicit forbidden scope envelope, grounds personalisation in the retrieved summaries, and stays properly high-level.", "golden_agreement": "The candidate matches the reference on mastery outcomes, core concepts (deterrence, security dilemma, flashpoints, alliance entanglement), prior-knowledge linkage to the 1945 bomb decision, redirecting 'bully tactic' framing, scenario reasoning, closed-question widgets, and most forbidden topics. However, it directly contradicts the reference by making the Cuban Missile Crisis a central example (the reference explicitly forbids previewing it), discourages payoff/decision matrices which the reference recommends, and ends with a forward-looking preview question the reference warns against.", "retrieval_grounding": "Nearly all claims about the student trace to the summaries (Lesson 206 knowledge, 'bully tactic' framing, scaffolding needs, no explicit preferences). Minor overstatements exist: saying the student has 'already mastered' atomic bomb decision mechanics exceeds the summaries' 'intermediate' depth ratings, and 'responds well to neutral, analytical framing' is an inference not directly evidenced."}}}}, {"id": "3a12663d-df18-44ad-a8a6-4cbe3547af00", "course": "Essentials of public speaking", "fingerprint": "e0028ae57e18", "production": "### 1. Topics  \n• Creating a sign-posted speech outline (2–3 main points)  \n• Writing clear transitions that guide the audience  \n• Choosing and justifying an organizational pattern  \n• Aligning outline, evidence, and central idea with the audience  \n\n---\n\n### 2. Scope Envelope  \nAllowed (teach and practice only these):  \n1. Course-required “speech note outline” format with labels (MP 1, MP 2, Transition A…).  \n2. 2–3 Main points that advance the student’s existing central idea.  \n3. Standard organizational patterns available in this lesson (problem-solution, chronological, comparison, etc.) and how to justify the chosen one.  \n4. Audience-centered wording of signposts and transitions.  \n\nForbidden (explicitly out-of-scope for this lesson):  \n– Visual aids or slide design  \n– Delivery skills (eye contact, pace, posture, virtual framing)  \n– Persuasive techniques beyond basic organization (ethos/pathos, counter-arguments, refutation)  \n– Anxiety management or rehearsal routines  \n– Advanced Unit 2 content (informative strategies, persuasive argument building, ethical persuasion, group Q&A handling, visual support design, self-assessment rubrics, final review checklist, etc.)  \n– Citation formatting, formal w the student values clear frameworks, step-by-step reasoning, and confidence-building feedback; avoid over-technical jargon and avoid prescribing full scripts.  \n\n---\n\n### 8. Teaching instructions  \n1. Begin by briefly restating the student’s finalized central idea (timestamp 2026-08-26T22:14:59Z) to anchor the task.  \n2. Prompt: “Please paste the list of evidence you’ve gathered so far that supports this central idea.”  \n3. Once evidence list is received, guide the student to group items into 2–3 logical clusters that could become main points; suggest common patterns (problem-solution, chronological how-to, comparison) and have them choose the best fit, justifying the choice in 1-2 sentences.  \n4. Walk the student through filling the outline template:  \n   • Heading with central idea  \n   • MP 1, MP 2 (MP 3 if needed) with 1-line signposts  \n   • Transition A, Transition B phrased for spoken delivery  \n   • Bullet evidence under each main point (keywords only)  \n5. Review the draft together, checking that:  \n   • Each main point directly advances the central idea.  \n   • Transitions preview the next idea and echo key terms for audience clarity.  \n6. Close by having the student restate—in their own words—why their chosen pattern serves THIS audience and goal better than, say, a topical or cause-effect pattern.  \n7. Celebrate progress; assign a light rehearsal task (optional): read the outline aloud once to test flow, but keep detailed delivery coaching for the upcoming “Delivery basics” lesson.", "lessonTitle": "Organizing your speech", "unitTitle": "Foundations of audience-centered speaking", "masteryOutcomes": ["Create a signposted outline for the student's intended discussion board speech with 2-3 clearly labeled main points and transitions using the course's required formatting that will be used in the reviews for grading.", "Justify why the chosen organizational pattern fits this audience and central idea, given that other patterns (topical, cause-effect) exist."], "instructions": {"course": "For this course take the role of a speech coach - focus on guidance and building confidence more than exactness with formatting", "unit": "Each Unit 1 lesson must be startable fresh: the tutor supplies context in-lesson. If the learner already has a draft or artifact from an earlier lesson, the tutor may reuse it as an illustrative example, or generate a fresh short speech topic (informative or exploratory, learner-appropriate) on the spot. Any continuity across lessons is optional, never required.", "lesson": "This is a practical lesson that builds on the student's lessons 5 and 6 for their discussion board speeches.  Ask the student to share their list of evidence that supports their central idea for the discussion board speech.\n\n\nSpeech note outlines must use the course format."}, "models": {"luna": {"output": "# Topics\n\n- Turning supporting evidence into a speech structure\n- Signposted main points and transitions\n- Choosing an organizational pattern for an audience and central idea\n- Applying the course speech-note format\n\n# Scope Envelope\n\n- **Allowed:**\n  1. Organizing the student’s evidence into 2–3 clearly labeled main points\n  2. Creating transitions and signposts between speech sections\n  3. Selecting and justifying an organizational pattern for the alerts-as-code discussion board speech\n  4. Using the focused central idea and audience needs as organization filters\n  5. Formatting speech notes according to the course’s required outline format\n\n- **Forbidden:**\n  1. Delivery techniques, including pace, pauses, eye contact, posture, gestures, and vocal presence\n  2. Managing speaking anxiety or creating a pre-speech routine\n  3. Virtual-speech adaptations or technical recording and video-upload procedures\n  4. Designing visual aids, slides, diagrams, or demonstrations\n  5. Group discussion skills, impromptu answers, or responding to audience questions\n  6. Persuasive counterarguments hen moves toward a practical workflow they can use.”\n- Keep the speech notes concise and usable as speaking prompts rather than a memorized script. The student previously identified exact memorization as a source of nervousness, so emphasize keywords, labels, evidence cues, and transitions.\n- Have the student produce at least two complete transitions, not merely isolated transition words. Each transition should state where the speech has been and where it is going.\n- Use brief, realistic examples from alerts-as-code, service repositories, Grafana ownership, and independent alert updates. Do not invent numerical evidence or sources; mark unsupported items for later verification rather than treating them as facts.\n- Include a short confidence check after the outline: ask the student to identify the strongest main point, the weakest or least-supported point, and one detail they may cut.\n- Closed-question widget reminder: if using a closed question, specify whether it is single-select or multi-select, list every answer choice, mark the correct answer(s), and instruct the teaching agent to use the show-closed-question-widget tool.\n\n# Things to Avoid\n\n- Do not present a finished outline before hearing the student’s evidence list.\n- Do not turn every evidence item into a separate main point.\n- Do not introduce later-lesson delivery, anxiety, virtual-speaking, visual-support, or Unit 2 concepts.\n- Do not teach cause-effect or topical organization as later-course content; they are named in the current mastery outcome and may be used only for comparison.\n- Do not fabricate incident counts, time savings, expert quotations, or source details.\n- Do not overemphasize formatting precision; act as a speech coach and prioritize a clear, natural, audience-centered structure.\n- Do not require a full manuscript or exact wording for every sentence.\n- Do not confuse a transition with a simple signpost such as “next.” The student should understand the relationship between sitions, and a conclusion.\n- Confirm that the student can explain why the chosen pattern fits the audience and central idea better than the available alternatives.", "scores": {"section_structure": 1, "golden_similarity": 0.9138312512727843, "instruction_adherence": 0.95, "golden_agreement": 0.92, "retrieval_grounding": 0.97, "pairwise_preference": 0.75}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan closely follows the lesson-specific instructions: it starts by requesting the student's evidence list, builds on lessons 5/6, uses the required course speech-note format, applies the alerts-as-code central idea, includes transitions, an audience-centered pattern justification (comparing topical/cause-effect), and a confidence check, while forbidding delivery, anxiety, and later-lesson concepts and adopting a coaching (not formatting-obsessed) stance. Minor: the confidence-check framing leans slightly into anxiety territory but it's tied to note usability rather than delivery, so it stays consistent overall.", "golden_agreement": "The candidate reproduces nearly all reference decisions: same topics, identical mastery outcomes verbatim, matching scope exclusions (delivery, anxiety, visuals, Unit 2, citations), the evidence-first workflow, 2–3 clustered main points, pattern justification against topical/cause-effect alternatives, keyword-not-script emphasis, and anchoring to the same central-idea timestamp. Only minor divergences exist, such as expanding the outline template to full intro/conclusion sections and some extra procedural notes not in the reference.", "retrieval_grounding": "Nearly all claims about the student trace directly to the summaries: the exact central idea, evidence-category and credibility-check mastery, memorization-related nervousness, and the need for guided practice moving from lists to structure. Minor soft inferences (e.g., 'responds well to practical workplace examples') are reasonably grounded in the student's consistent workplace-based work across summaries.", "pairwise_preference": "Both orders agreed (0.75 / 0.75). Both cover the outcomes and ground personalisation in the summaries, but Plan B's Teaching instructions are a numbered step-by-step lesson script (including scripted prompts and a template walkthrough) and it assigns an optional rehearsal task that nudges into the out-of-scope delivery lesson. Plan A keeps its Teaching instructions high-level, has a more complete and explicit forbidden list, and its extra detail is mostly grounded coaching guidance rather than sequenced scripting."}}, "nano": {"output": "1. **Topics**\n   - Discussion board speech: evidence for a central idea\n   - Turning evidence into 2–3 signposted main points\n   - Choosing an organizational pattern that fits audience + central idea\n\n2. **Scope Envelope**\n   - **Allowed:**\n     - Create a signposted outline for the student’s intended discussion board speech with 2–3 clearly labeled main points and transitions using the course’s required outline format\n     - Justify why the chosen organizational pattern fits this audience and central idea (not topical, not cause-effect)\n     - Work with the student’s existing central idea and supporting evidence list\n     - Use the evidence types the student has already used/understood (data, specific example, expert testimony, story/narrative) and PEEL/C–E–E–L-style thinking at a high level (point/evidence/explanation/link conceptually)\n   - **Forbidden:**\n     - Delivery mechanics (pace, eye contact, posture) or rehearsal strategies\n     - Managing speaking anxiety techniques\n     - Audience-purpose-context (APCMC) analysis instruction beyond what is needed to justify organization\n     - Counterarguments/rebuttals as a required structural component\n     - Visual support design (slides/diagrams/demos)\n\n3. **Mastery Outcomes**\n   - Create a signposted outline for the student's intended discussion board speech with 2-3 clearly labeled main points and transitions using the course's required formatting that will be used in the reviews for grading. \n\n   - Justify why the chosen organizational pattern fits this audience and central idea, given that other patterns (topical, cause-effect) exist.\n\n4. **New Concepts Introduced**\n   - **Evidence-to-outline mapping (new for this lesson):** how to take the student’s list of evidence and assign each item to one of the 2–3 main points so the outline shows a clear “this evidence proves/supports that point” chain.\n   - **Signposting as a structure tool (new emphasis):** labeling main points and adding transitions so a listener can track progress even if they miss a sentence.\n   - **Organizational-pattern justification (new emphasis):** explaining *why this structure works for this audience* using the audience needs and central idea—without defaulting to topical order.\n\n5. **General remarks / tips**\n   - Keep the student’s central idea as the “filter” the whole time: if an evidence item doesn’t help the listener reach the central idea outcome, it gets cut or reassigned.\n   - Use short, audit-friendly sentences for the outline (the grading review can be faster when main points and transitions are explicit).\n   - If the student has multiple evidence types, aim for at least one “anchor” per main point (not necessarily all evidence types in every point).\n\n6. **Things to Avoid**\n   - Don’t write a full speech script in paragraph form—this lesson is about the **speech-note outline**.\n   - Don’t pick an organizational pattern without connecting it to **audience needs + central idea**.\n   - Don’t include more than **2–3** main points; extras usually cause drift from the central idea.\n   - Don’t “signal” vaguely (e.g., “Now we’ll talk about…”). Signposting should clearly name what the next main point is.\n\n7. **Student teaching preferences summary**\n   - No specific learning preferences provided.\n   - Based on prior performance trends: the student benefits from clear structure, short decision rules, and concrete mapping tasks (evidence → paragraph/job/role). Avoid over-relying on instinct—use quick check questions to make choices verifiable.\n\n8. **Teaching instructions**\n   - **Start with a quick reminder (context reset):** re-state that today’s goal is to build the discussion board speech *outline* using signposted 2–3 main points and transitions, then justify the organizational pattern choice.\n   - **Prompt the student to share their evidence list:** ask them to paste or summarize the evidence items they plan to use that support their already-finalized central idea. Specifically require: each item tagged as data / specific example / expert authority / story (if they don’t know, they can describe what it is).\n   - **Coach evidence triage before outlining:** guide them through a fast keep/revise/cut check using the central idea filter. If they’re unsure, ask: “Which audience outcome does this evidence directly support?”\n   - **Guide mapping evidence to 2–3 main points:** have the student draft 2–3 labeled main points (not full sentences for the whole speech—just headings) and assign each evidence item to exactly one main point.\n   - **Add signposting and transitions in the required outline format:** coach them to include:\n     - a labeled main point for each point (Point 1, Point 2, Point 3—if 3 is used)\n     - a transition that bridges from the previous point to the next (one sentence per transition)\n   - **Organization choice + justification:** once the outline skeleton is complete, ask the student to write a short justification explaining why their chosen pattern fits:\n     - this audience (what they need to hear first/most clearly)\n     - this central idea (how the structure helps them achieve the outcome)\n     - and explicitly contrast that fit versus other options (topical or cause-effect), using 2–3 sentences.\n   - **Final checklist pass (outline-only):**\n     - Are there exactly 2–3 main points?\n     - Are main points labeled and signposted?\n     - Do transitions clearly show movement to the next main point?\n     - Does every evidence item belong to a main point that serves the central idea?\n     - Does the justification clearly connect audience + central idea + pattern choice?", "scores": {"section_structure": 1, "golden_similarity": 0.9184248940402329, "instruction_adherence": 0.85, "golden_agreement": 0.82, "pairwise_preference": 0.75, "retrieval_grounding": 0.85}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan strongly follows the lesson-specific directive to ask the student to share their evidence list supporting the central idea, uses the course outline format, and honors the coaching/confidence tone by avoiding delivery/anxiety topics. However, it relies heavily on continuity with lessons 5 and 6 (the student's 'already-finalized central idea' and existing evidence list) without the unit-required in-lesson fallback to supply context or generate a fresh topic if no draft exists, which the unit instructions explicitly require for Unit 1 lessons.", "golden_agreement": "The candidate matches the reference's mastery outcomes verbatim, follows the same teaching sequence (restate central idea, request evidence list, cluster into 2–3 main points, add signposts/transitions in required format, justify pattern vs. topical/cause-effect), and shares the core forbidden items (delivery, anxiety, visuals, counter-arguments). It omits some reference exclusions (Unit 2 preview, citations, grammar polishing), lacks the closing celebration/optional rehearsal task and pattern decision-grid concept, and adds evidence-type tagging/triage that slightly drifts toward evidence-quality work the reference explicitly defers to a later lesson.", "pairwise_preference": "Both orders agreed (0.75 / 0.75). Both plans meet the eight-section structure and cover the outcomes, but Plan B's closing instruction assigns dentity work (covered in Lesson 9)\n\n## Mastery Outcomes\n- Create a signposted outline for the student's intended discussion board speech with 2-3 clearly labeled main points and transitions using the course's required formatting that will be used in the reviews for grading.\n- Justify why the chosen organizational pattern fits this audience and central idea, given that other patterns (topical, cause-effect) exist.\n\n## New Concepts Introduced\n- **Course outline format specification** – the required structure and formatting conventions for this course's speech notes (to be demonstrated by the tutor during the lesson)\n- **Signposting** – explicit language that signals to the audience where the speaker is in the outline and what comes next (e.g., \"First…,\" \"Next…,\" \"In conclusion…\")\n- **Organizational patterns in speaking** – how topical, chronological, cause-effect, and problem-solution patterns serve different purposes and audiences\n- **Pattern-to-audience fit** – reasoning about why one pattern serves the central idea and audience better than alternatives\n\n## General Remarks / Tips\n\n**From your skills memory:**\n- You have a **strong, focused central idea** finalized in Lesson 6 (2026-08-26): \"By the end of my talk, you'll know how to use alerts-as-code in your service repo to add and update alerts on your own.\"\n- You have **credible supporting material identified** (Lesson 6, 2026-08-26), with evidence focused on **ownership confusion** as the key problem your audience faces with Grafana alerts.\n- You've practiced **audience-centered reasoning** and connecting decisions back to purpose (from Lesson 3's APCMC framework).\n\n**Build on this:**\n- Your outline should anchor each main point to your central idea—use your evidence list as a guide for what information each point needs to cover.\n- Because your audience is domain engineers who need to *act* (use alerts-as-code independently), a **problem-solution** or **topical** pattern may fit better than pure chronology; justify your choice explicitly.\n- Signposting is especially important in a recorded video where your audience cannot ask for clarification—make the structure crystal clear.\n\n## Things to Avoid\n\n- **Do not** create an outline that wanders from your central idea. Every main point should serve the goal of helping your audience use alerts-as-code independently.\n- **Do not** force evidence into points that don't need it. Each point should be supported, but not every piece of evidence belongs in every outline.\n- **Do not** assume a pattern without justifying it. Saying \"I chose topical order because it's simple\" is not enough—connect it to *this* audience and *this* central idea.\n- **Do not** use overly formal or scripted transitions. Signposting should sound natural and conversational in a recorded speech.\n- **Do not** skip the course's required outline format. The outline will be graded, so match the specified structure exactly.\n\n## Student Teaching Preferences Summary\n\nNo specific learning preferences provided. Proceed with a speech-coach approach: prioritize guidance, confidence-building, and practical application over formatting exactness. Assume the student learns best through concrete examples tied to their own speech context (alerts-as-code for domain engineers).\n\n## Teaching Instructions\n\n**Opening & Context-Setting:**\nStart by asking the student to share the **list of evidence** they identified in Lesson 6 for their discussion board speech on alerts-as-code. This anchors the lesson to their real work and surfaces what they have to work with. Acknowledge their central idea briefly to reinforce continuity.\n\n**Pattern Exploration:**\nWalk through 2–3 organizational patterns (topical, problem-solution, chronological) with **brief examples** relevant to their topic. Ask: *Which pattern would help your audience—domain engineers who currently struggle with alert ownership—understand and act on alerts-as-code?* Push them to t  \n- Reframing a business decision from a silent stakeholder’s point of view  \n\n2. Scope Envelope  \nAllowed:  \n1. Building a stakeholder map with columns (name/role, primary interest, power or vulnerability)  \n2. Including ≥ 3 stakeholders, with ≥ 1 powerless/silent stakeholder  \n3. Pinpointing a conflict of interest revealed only after full mapping  \n4. Re-expressing the original decision through the less-obvious stakeholder’s perspective  \n\nForbidden (out-of-scope):  \n- Ethical trade-off analysis or dilemma matrices  \n- Consequentialist, deontological, virtue-ethics, or stakeholder-theory frameworks  \n- AI ethics components (bias, fairness, privacy, transparency, accountability)  \n- Governance, compliance, or regulatory topics (EU AI Act, FTC, EEOC, HIPAA, etc.)  \n- Professional-judgment, whistle-blowing, or corporate-accountability discussions  \n- Any content from later units (framework selection, governance structures, etc.)  \n\n3. Mastery Outcomes  \n- Complete a structured stakeholder analysis for a business decision: identify each stakeholder, their interest, their power, and what they stand to gain or lose.  \n- Use the stakeholder map to identify a conflict of interest that would not be visible if only the most obvious parties were considered.  \n- Reframe a business decision that initially seemed straightforward by surfacing a less obvious stakeholder's perspective.  \n\n4. New Concepts Introduced  \n- Stakeholder vulnerability: being highly affected while holding little or no decision power  \n- Conflict-visibility gradient: how hidden conflicts emerge once silent or low-power stakeholders are mapped  \n- Reframing lens: deliberately viewing the decision through a silent stakeholder’s interests to generate a fresh perspective  \n\n5. General remarks / tips  \n- Leverage the student’s solid “interest vs influence” foundation; push beyond binary labels by asking for brief numeric justifications (e.g., 1–5 scale).  \n- Require interests to gain or lose.", "Use the stakeholder map to identify a conflict of interest that would not be visible if only the most obvious parties were considered.", "Reframe a business decision that initially seemed straightforward by surfacing a less obvious stakeholder's perspective."], "instructions": {"lesson": "Canvas task format: a stakeholder map (one row per stakeholder; columns for name/role, primary interest, and power or vulnerability), with a minimum of three stakeholders including at least one with no direct power, followed by short analysis on which stakeholder conflict is most ethically significant and why."}, "models": {"luna": {"output": "## Topics\n\n- Structured stakeholder mapping\n- Stakeholder interests and outcomes\n- Power versus vulnerability\n- Hidden stakeholders and conflicts of interest\n- Ethical significance of competing interests\n\n## Scope Envelope\n\n- **Allowed:**\n  - Identifying stakeholders affected by a business decision, including indirect or silent stakeholders\n  - Recording each stakeholder’s primary interest and power or vulnerability\n  - Distinguishing decision-making power from the size of a stakeholder’s consequences\n  - Using a stakeholder map to identify hidden conflicts of interest\n  - Reframing a seemingly straightforward decision from a less obvious stakeholder’s perspective\n\n- **Forbidden:**\n  - Professional obligations and duties\n  - The distinction between legal compliance and ethical responsibility\n  - Ethical trade-off analysis as a formal method\n  - Consequentialism\n  - Deontology\n  - Virtue ethics\n  - Stakeholder theory as a normative ethical framework\n  - AI business benefits and incentives\n  - AI-specific bias, fairness, privacy, transparency, or accountability checklists\n  - Algorithmic bias mechanisms\n  - Competing definitions of AI fairness\n  - Privacy principles such as purpose limitation, data minimization, and meaningful consent\n  - Transparency and explainability\n  - Human accountability for AI deployments\n  - Second-order impacts of AI as a standalone topic\n  - AI governance structures\n  - Corporate accountability\n  - FTC, EEOC, HIPAA, or EU AI Act requirements\n  - Whistleblowing\n  - Formal ethical frameworks or framework selection\n  - Any topics from later lessons unless explicitly included in the current mastery outcomes\n\n## Mastery Outcomes\n\n- Complete a structured stakeholder analysis for a business decision: identify each stakeholder, their interest, their power, and what they stand to gain or lose.\n- Use the stakeholder map to identify a conflict of interest that would not be visible if only the most obvious parties were considered.\n- Reframe a business decision that initially seemed straightforward by surfacing a less obvious stakeholder's perspective.\n\n## New Concepts Introduced\n\n- **Structured stakeholder map:** A table used to organize one stakeholder per row, with columns for name or role, primary interest, and power or vulnerability.\n- **Power or vulnerability:** A stakeholder’s ability to influence the decision, or their exposure to significant consequences despite having little influence.\n- **Gain or loss:** The concrete benefit or harm a stakeholder may experience if the decision is made.\n- **Hidden conflict of interest:** A tension between stakeholder interests that becomes visible only after considering less obvious or indirect stakeholders.\n- **Stakeholder-based reframing:** Restating a business decision after incorporating the perspective of a stakeholder who was initially overlooked.\n\n## General remarks / tips\n\n- Treat the Canvas task as the main assessment: produce a stakeholder map with one row per stakeholder and at least three stakeholders total.\n- Ensure at least one listed stakeholder has no direct decision-making power. Emphasize that low power does not mean low importance; it may mean greater vulnerability to the decision’s consequences.\n- Encourage precise, outcome-oriented interests rather than
