from the way the system was designed or deployed — not just what the risk is.\n\n# New Concepts Introduced\n\n- **AI:** Introduce AI as a system that uses information and programmed instructions to perform tasks that usually require human judgment, such as recommending products, spotting suspicious transactions, or sorting job applications. Clarify that AI does not “think” like a person; it produces outputs based on patterns and objectives set into the system.\n- **LLM:** Introduce a large language model as an AI system trained on a very large collection of written language that recognizes patterns in text and generates likely responses. Ground it immediately with business examples such as customer-service chat, drafting marketing copy, or summarizing company documents. Clarify that an LLM can produce fluent language without guaranteeing that every answer is accurate.\n- **Training data:** Explain that training data is the collection of examples an AI system learns from. The examples influence what the system recognizes and how it responds.\n- **Pattern recognition:** Explain that AI looks for repeated relationships in its examples, then uses those patterns to produce an output for a new situation.\n- **Human-set objectives:** Explain that people decide what the system is meant to optimize or accomplish, such as speed, likely sales, fraud detection, or lower costs.\n- **Business AI landscape:** Survey at least five current uses, such as recommendation systems, fraud detection, hiring or résumé screening, credit or loan assessment, customer-service chatbots, medical or insurance claim processing, delivery and logistics planning, and targeted advertising. For each, identify a practical benefit and a concrete risk affecting people.\n- **Design or deployment cause of risk:** Introduce the distinction between naming a risk and explaining its cause. A strong explanation connects the risk to a choice in the data, the task definition, the information considered, the threshold used, or how much human review was provided.\n\n# General remarks / tips\n\n- Begin with the two working concepts—AI and LLM—and keep this opening to approximately 2–4 minutes.\n- Use familiar business situations immediately, especially online recommendations, customer-service chat, banking fraud alerts, résumé screening, and delivery apps.\n- The student previously struggled to identify an AI decision that seemed unfair or problematic, so make risks concrete and visible rather than abstract.\n- Use a simple repeated structure for the landscape survey: **Use → Benefit → Risk → Why the risk might arise**.\n- Encourage the student to explain ideas in their own plain language. Avoid technical vocabulary unless it is immediately defined.\n- Use short comparisons, sorting tasks, and scenario-based questions. The student has responded well to concrete examples, visual organization, sentence frames, and multiple-choice checks with immediate feedback.\n- A useful sentence frame is: “This AI is used for ____. The benefit is ____. The risk is ____. The risk arose because the system was designed/deployed to ____.”\n- Ask the student to generate at least one example independently after working through guided examples.\n- Check that the student distinguishes a benefit from a risk and a risk from its underlying design or deployment cause.\n- The orientation lesson ended at **2026-08-27T13:33:06.369Z**. Because it was less than two hours before this lesson’s timestamp of **2026-08-27T13:34:20.886Z**, do not reinforce its course-purpose or orientation content.\n\n# Things to Avoid\n\n- Do not spend more than 2–4 minutes on the opening definitions of AI and LLM.\n- Do not assume the student already knows AI terminology.\n- Do not describe AI as having human thoughts, intentions, emotions, or independent moral responsibility.\n- Do not introduce formal ethical frameworks, stakeholder analysis, governance, regulation, privacy principles, fairness terminology, or accountability concepts.\n- Do not use later-course cases or examples.\n- Do not turn the lesson into a technical explanation of algorithms, coding, model architecture, probability, or mathematics.\n- Do not list risks without asking how the system’s design or deployment contributed to them.\n- Do not rely only on lecture; include opportunities for the student to classify, explain, and create examples.\n- Do not address spelling, personal issues, or unrelated topics.\n\n# Student teaching preferences summary\n\n- No specific learning preferences were provided.\n- Based on prior learning evidence, the student benefits from concrete real-world business examples, concise analogies, visual or tabular organization, sentence frames, and short multiple-choice checks with immediate feedback.\n- The student can apply structured templates effectively when prompted and transfers concepts better after seeing a worked example.\n- Use gradual release: model one example, complete one together, then ask the student to create one independently.\n- Keep explanations practical and avoid premature technical detail.\n\n# Teaching instructions\n\nOpen with **AI** and **LLM** as the two working concepts, taking approximately 2–4 minutes total. Define each in plain language and immediately connect each to business examples.\n\nThen guide the student through a landscape survey of at least five current business applications of AI. For every application, require a clear benefit and a clear risk affecting people. Include varied settings such as recommendations, fraud detection, hiring or résumé screening, credit or loan assessment, customer-service chatbots, claims processing, logistics, and targeted advertising.\n\nTeach the output process in plain terms using the sequence **training data → pattern recognition → human-set objectives → output**. Emphasize that the system learns from examples, detects recurring relationships, and produces results according to goals people selected.\n\nUse a worked example followed by a jointly completed example and an independent student example. Require the student to explain not only what the risk is, but how a design or deployment choice helped create it. End with a compact synthesis or retrieval check covering five uses, their benefits and risks, and the three-part explanation of how AI reaches outputs.", "scores": {"section_structure": 1, "golden_similarity": 0.8825245132575356, "instruction_adherence": 1, "golden_agreement": 0.95, "retrieval_grounding": 1, "pairwise_preference": 0.75}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan opens with AI and LLM as the two working concepts, keeps the opening to 2-4 minutes, grounds both in business examples immediately, and then proceeds to the landscape survey—fully consistent with the lesson-specific instructions and all forbidden-topic constraints.", "golden_agreement": "The candidate matches the reference on virtually every substantive decision: identical mastery outcomes, same plain-language mechanics (training data → pattern recognition → objectives), five business use cases with benefit/risk pairs, the design/deployment deep-dive, the same forbidden later-unit content, avoidance of orientation reinforcement and technical jargon, and the same lesson flow ending with a student-generated example. The only minor omission is the reference's explicit callback to the student's marketing/decision-bias background when illustrating benefits.", "retrieval_grounding": "Every claim about the student is traceable to the summaries: the struggle to identify unfair AI decisions comes directly from the orientation lesson, the responsiveness to concrete examples, sentence frames, visual organization, and multiple-choice checks is documented across several lessons, the ability to apply structured templates and transfer after worked examples matches the feedback and retrospective lessons, and the orientation lesson timestamp matches. The plan also correctly avoids assuming prior AI knowledge.", "pairwise_preference": "Both orders agreed (0.75 / 0.75). Both plans hit all eight sections, ground personalisation in the summaries, and cover the outcomes verbatim, but Plan A's forbidden list is markedly more complete and explicit (naming later-unit cases and concepts a teaching agent could otherwise drift into), giving stronger scope discipline. Plan B is leaner but its teaching instructions read slightly more like a step-by-step agenda, and its narrower forbidden list leaves more room for scope creep."}}, "nano": {"output": "## 1. Topics\n- Working terms: **AI** and **LLM** (grounded in business examples)\n- The **AI landscape in business**: common real-world uses that affect people\n- **Benefits and risks** of AI deployments (one benefit + one risk per use case)\n- Plain-language explanation of **how AI reaches outputs** (training data → pattern recognition → human-set objectives)\n\n## 2. Scope Envelope\n- **Allowed:**\n  - Define and distinguish **AI** and **LLM** with immediate business examples\n  - Survey **at least five** real ways AI is used in business, each with **one benefit and one risk**\n  - Explain (in plain terms) how AI systems reach outputs: **training data**, **pattern recognition**, **human-set objectives** (no technical jargon)\n  - For **one** AI use case, explain **why the risk arose** from **design or deployment choices** (not just naming the risk)\n- **Forbidden:**\n  - Deep technical details about model architectures, training algorithms, or internal mechanics\n  - Any preview/introduction of later course topics (e.g., human accountability chain details, identifying ethical questions taxonomy, stakeholder power vs consequences mapping, compliance-ethics distinction, ethical frameworks application, governance structures)  \n  - Coverage of specific later case studies or governance mechanisms not required for this lesson’s mastery outcomes\n  - Definitions that rely on prior course concepts not yet taught in this unit\n\n## 3. Mastery Outcomes\n- Identify at least five real ways AI is currently used in business settings that affect people's lives, naming one benefit and one risk for each.\n- Describe in plain terms how AI systems reach their outputs — training data, pattern recognition, and human-set objectives — without technical jargon.\n- For one AI use case, explain why the risk arose from the way the system was designed or deployed — not just what the risk is.\n\n## 4. New Concepts Introduced\n- **AI (working definition):** computer systems that apply learned patterns to make decisions or predictions in a business process.\n- **LLM (working definition):** a type of AI that can generate text by learning patterns from large amounts of written data, guided by human goals.\n- **Plain-language “output pathway”:**\n  - **Training data** = examples used to learn patterns\n  - **Pattern recognition** = matching new situations to learned patterns\n  - **Human-set objectives** = goals/preferences set by people (what the system is trying to do)\n- **Benefit vs risk pairing for AI use cases:** each business use must include one concrete benefit and one concrete risk (and later, one case must include “why the risk happened” tied to design/deployment).\n\n## 5. General remarks / tips\n- Keep early momentum: start with two quick definitions (**AI** and **LLM**) tied to everyday business scenarios (e.g., customer support automation for AI; “drafting responses” for LLMs).\n- Use a consistent template during the landscape survey:  \n  **Use case → People affected → One benefit → One risk (what goes wrong)**\n- For the “why the risk arose” requirement, coach toward causal explanations tied to deployment/design choices (e.g., “no meaningful human review,” “wrong target metric,” “training data mismatch,” “insufficient testing on edge cases”).\n- Because the student previously said they weren’t sure about unfair/problematic AI examples, provide scaffolding through prompts like: “Where might someone’s outcome change because the AI system decided something?”\n\n## 6. Things to Avoid\n- Don’t introduce ethics frameworks, stakeholder analysis tools, or governance/compliance mechanisms—this lesson is specifically a **landscape + mechanism explanation** lesson.\n- Don’t teach or use jargon-heavy terms; keep phrasing accessible (“learned from examples,” “matched patterns,” “people set the goal”).\n- Don’t require the student to invent fully novel use cases; instead, let them select from suggested common categories and then articulate their benefit/risk.\n- Don’t spend time on personal anecdotes, irrelevant remarks, or assessment logistics beyond what’s needed for this lesson.\n\n## 7. Student teaching preferences summary\n- Learns well from **grounded, concrete examples** and simple analogies.\n- Responds well to **structured sentence frames** and can generate clear business-style actions when given ownership/time/metric style scaffolding.\n- Likely needs continued support to move from “I’m not sure” to identifying specific examples; use guided prompts and example categories (hiring, credit/loan decisions, recommendations, customer support, fraud detection).\n- Likely benefits from quick checks that ensure they can restate ideas in their own words.\n\n## 8. Teaching instructions\n- **0:00–2:30 (Opening):** Introduce **AI** and **LLM** using immediate business examples (e.g., AI routing customer requests; LLM drafting support replies). Keep definitions short and require the student to paraphrase each in one sentence.\n- **2:30–6:00 (Landscape survey):** Present/confirm a list of at least five AI business use cases that affect people (typical categories: hiring/screening, credit/loan decisions, fraud detection, personalization/recommendations, customer support). For each, have the student state:\n  1) one benefit,\n  2) one risk,\n  3) who might be affected.\n- **6:00–10:00 (Mechanism in plain terms):** Teach the “output pathway” in plain language:\n  - training data → pattern recognition → human-set objectives.  \n  Use a single example (e.g., approving a credit application or responding to a support message) and have the student explain the three links in order without jargon.\n- **10:00–14:00 (Deep dive: why one risk happened):** Choose one use case from the student’s list and prompt:\n  - “What design or deployment choice made the risk likely?”  \n  Coach toward a causal explanation (e.g., “optimized for speed over careful review,” “trained on historical patterns that reflect past bias,” “rolled out without sufficient monitoring/testing in real conditions”).\n- **14:00–15:00 (Quick mastery check):** The student quickly outputs:\n  - the five use cases with one benefit + one risk each, and\n  - the one “why” explanation for the selected case.", "scores": {"section_structure": 1, "golden_similarity": 0.9066927805212123, "instruction_adherence": 1, "retrieval_grounding": 1, "golden_agreement": 0.85, "pairwise_preference": 0}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan opens with AI and LLM definitions (0:00–2:30, within the 2–4 minute window), grounds both immediately in business examples, and only then proceeds to the landscape survey—fully consistent with the lesson-specific instructions, while also respecting the forbidden topics and jargon constraints.", "retrieval_grounding": "All claims about the student trace to the summaries: the preference for concrete examples and analogies (noted in the business-model and psychology lessons), responsiveness to sentence frames with owner/time/metric scaffolding (feedback-into-action lesson), the 'not really sure' response about unfair AI examples with the suggested example categories (orientation lesson), and the need for recall checks in the student's own words. No concept is treated as already mastered without support.", "golden_agreement": "The candidate matches the reference on topics, ordering, identical mastery outcomes, plain-language mechanics, the design/deployment deep dive, and forbidding later-unit content (frameworks, governance, stakeholder analysis) and jargon. Minor deviations: it drops the 'student supplies a sixth use case' active practice (and even discourages inventing novel cases, mildly contradicting the reference), omits the callback to the student's marketing/decision-bias background, and is less explicit about forbidding regulation content.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A's Teaching instructions are a minute-by-minute scripted lesson (0:00–2:30, etc.), which is exactly the step-by-step detail the instructions forbid, while Plan B keeps its guidance high-level. Plan B also has a more explicit, complete forbidden-topics list and its personalisation callbacks (marketing/bias background, sentence frames) are well grounded in the summaries."}}, "haiku": {"output": "# Lesson Plan: AI in Business Today\n\n## Topics\n\n- What AI is (definition and core components)\n- What Large Language Models (LLMs) are and how they differ from AI broadly\n- The current AI landscape in business: five real-world use cases affecting people's lives\n- How AI systems work: training data, pattern recognition, and human-set objectives\n- Benefit and risk analysis for each use case\n- Design and deployment choices that create (or mitigate) risk\n\n---\n\n## Scope Envelope\n\n### Allowed\n- Definitions of AI and LLMs grounded in business examples\n- Real business AI deployments (hiring algorithms, recommendation systems, credit scoring, content moderation, chatbots for customer service)\n- Training data and its biases\n- Pattern recognition as a learning mechanism\n- Human optimization targets embedded in AI systems\n- Concrete benefits and risks for each use case\n- Connection between system design/deployment choices and the risks that arise\n\n### Forbidden\n- Ethical frameworks (consequentialism, deontology, virtue ethics, stakeholder theory) — these are Unit 2 content\n- Bias, fairness, privacy, transparency, and accountability as formal AI ethics components — these are Unit 3 content\n- Governance structures, regulatory mechanisms, or compliance — these are Unit 4 content\n- Professional judgment in communicating ethical positions — this is Unit 5 content\n- Technical details of neural networks, deep learning, or machine learning algorithms\n- Philosophy of consciousness or artificial general intelligence (AGI) speculation\n\n---\n\n## Mastery Outcomes\n\n- Identify at least five real ways AI is currently used in business settings that affect people's lives, naming one benefit and one risk for each.\n- Describe in plain terms how AI systems reach their outputs — training data, pattern recognition, and human-set objectives — without technical jargon.\n- For one AI use case, explain why the risk arose from the way the system was designed or deployed — not just what the risk is.\n\n---\n\n## New Concepts Introduced\n\n1. **AI (Artificial Intelligence)** — a system trained to recognize patterns in data and make decisions or predictions based on those patterns, using rules or objectives set by humans\n2. **Large Language Model (LLM)** — a type of AI trained on text data to predict and generate human language; used in chatbots, content generation, and search tools\n3. **Training data** — the information a system learns from; if biased or incomplete, it shapes what the system learns to do\n4. **Pattern recognition** — the core mechanism by which AI identifies regularities in data and applies them to new situations\n5. **Human-set objectives** — the goals or targets that humans embed in an AI system, which determine what the system optimizes for\n6. **Design choice** — decisions made when building an AI system (what data to use, what to measure, how to handle uncertainty) that shape outcomes\n7. **Deployment choice** — decisions made when releasing an AI system into the world (who gets access, how it is monitored, when humans override it) that shape impact\n8. **Benefit** — a concrete advantage the AI system delivers (speed, cost, consistency, scale, personalization)\n9. **Risk** — a concrete harm that can arise from the system's design or use (wrong decisions, exclusion, unfairness, lack of recourse)\n\n---\n\n## General Remarks / Tips\n\n- **Ground early; move fast.** The lesson instructions call for 2–4 minutes on AI and LLM definitions before proceeding to the landscape survey. Use immediate business examples (e.g., \"Amazon uses AI to recommend products\") to anchor abstract concepts.\n- **Student has no prior AI knowledge.** The skills memory shows Michele has studied business cases, risk, feedback, and metrics — but has not yet encountered AI ethics or AI system mechanics. Treat AI and LLM as entirely new.\n- **Michele is strong with concrete examples and visual organization.** Past lesson summaries show she learns well from real scenarios, structured frameworks (K/I/S buckets, matrices), and feedback-classification exercises. Use the five-use-case landscape as a structured table or visual map.\n- **Michele has risk and benefit identification skills from MGMT work.** She identified probability–impact matrices and qualitative risk statements in earlier lessons. Leverage this by framing AI benefits and risks using language similar to what she has already mastered (e.g., \"impact on customer experience,\" \"likelihood of wrong decisions\").\n- **Avoid technical terminology.** Do not use \"neural networks,\" \"machine learning,\" \"algorithms,\" \"weights,\" \"layers,\" or \"model training\" in technical senses. Stick to \"system,\" \"pattern recognition,\" \"learns from data,\" \"decision rules.\"\n- **Five use cases should span sectors and stakeholder types.** Include at least one that directly affects hiring/employment (Michele's knowledge gap), one in consumer products (she is familiar with this from MGMT lessons), and one in a sector with public-health or safety implications. This breadth reinforces that AI is not a niche tool.\n- **Plan for the design/deployment question last.** This is the hardest mastery outcome. Pick one use case (ideally one that generated strong discussion during the landscape survey) and use it to illustrate the causal chain: design choice → system behavior → risk.\n\n---\n\n## Things to Avoid\n\n- **Do not introduce governance, regulation, or compliance.** Michele will study these in Unit 4. Stay focused on how systems work and what risks they create, not how organizations manage those risks.\n- **Do not use the phrase \"algorithmic bias\" or formal fairness definitions.** These are Unit 3 topics. When training data issues arise (e.g., Amazon's hiring algorithm trained on historical male hires), call it \"the data reflected the past,\" not \"biased training data.\"\n- **Do not ask Michele to name which ethical framework applies.** Frameworks are Unit 2. If she raises a fairness or rights concern, acknowledge it (\"good observation\") and note that we'll develop language for these questions later in the course.\n- **Do not preview AI ethics components (bias, fairness, privacy, transparency, accountability).** Although these are central to the course, they are Unit 3 mastery outcomes. This lesson stays at the level of \"here's what happened and what went wrong with the design/deployment.\"\n- **Do not ask Michele to evaluate governance or corporate structures.** Stay focused on the system and its deployment, not who is responsible or how oversight should work.\n- **Avoid speculation about future AI or AGI.** Keep discussion grounded in deployed, real systems today.\n- **Do not assume Michele knows technical AI jargon.** If she uses terms like \"algorithm,\" clarify that you mean the system's decision rules, not the code.\n\n---\n\n## Student Teaching Preferences Summary\n\nNo explicit learning preferences were provided. However, based on skills memory:\n\n- **Strength: Structured frameworks and visual organization.** Michele responds well to matrices, tables, and step-by-step templates (observation → theme → insight; risk ID → probability–impact → response).\n- **Strength: Concrete, real-world examples.** Abstract concepts without business context do not stick; Michele learns best when definitions are anchored immediately in practice.\n- **Strength: Guided practice with feedback.** Michele benefits from scaffolded exercises (tutor models, then she attempts, then refinement). Solo, open-ended tasks without examples are harder.\n- **Strength: Recognition of causal chains.** Michele can trace cause → effect (budget overrun ← one print quote; dissent not voiced ← low psychological safety) and apply this reasoning to new scenarios.\n- **Area to develop: Independent generation without exemplars.** Michele often relies on tutor-provided starting points and refines from there. Encourage solo brainstorming of use cases and risk statements early, then validate and refine.\n\n---\n\n## Teaching Instructions\n\n### High-Level Flow\n\n1. **Opening (2–4 minutes): Define AI and LLM with immediate business examples.**\n   - Use the lesson instructions: \"Open with the two working concepts (AI, LLM) before the landscape survey. Keep to 2–4 minutes. Ground both in business examples immediately.\"\n   - **AI definition:** A system trained to recognize patterns in data and make decisions based on those patterns, using goals set by humans. **Example:** Amazon's recommendation engine learns what kinds of products similar customers buy, then recommends similar items to you.\n   - **LLM definition:** A specific type of AI trained on text to predict and generate language. **Example:** ChatGPT, which you may have used; it learned from billions of words on the internet to predict what word comes next, and that lets it answer questions and write.\n   - Do not dwell on how this works yet. Move to the landscape.\n\n2. **Landscape Survey (bulk of lesson): Map five real AI use cases affecting people's lives.**\n   - **Organize as a structured table or map:** each use case in a row, with columns for: what it does, one benefit, one risk, who it affects.\n   - **Recommended use cases (choose five or substitute similar ones):**\n     - **Hiring algorithms** (e.g., Amazon's resume screening): Speed in processing applications; risk of excluding qualified candidates because training data favored certain demographics.\n     - **Recommendation systems** (e.g., Netflix, YouTube, social media feeds): Personalization and discovery; risk that the system optimizes for engagement and shows users increasingly extreme content.\n     - **Credit scoring and loan decisions** (e.g., FICO, alternative lenders): Fast, consistent decisions; risk of excluding people without traditional credit history or making mistakes that affect life access.\n     - **Content moderation at scale** (e.g., Meta, TikTok filtering harmful content): Ability to filter millions of posts instantly; risk of deleting legitimate speech or missing actual harm because the system was trained on incomplete examples.\n     - **Customer service chatbots** (e.g., bank support, tech helplines): Available 24/7, consistent responses; risk of frustration when the system cannot understand the actual problem and escalation is slow or unavailable.\n   - For each, ask: \"What does the company want the system to do well? What goes wrong?\" This primes the design/deployment question later.\n\n3. **How AI Works (middle section): Explain the three-part mechanism — without jargon.**\n   - **Training data:** \"The system learns from examples. If all the examples show X, the system learns that X is normal. If the examples are incomplete or reflect the past, the system may miss things or repeat old mistakes.\"\n   - **Pattern recognition:** \"The system finds regularities in the data — 'customers who buy diapers also buy wipes' or 'resume keywords that led to hiring in the past.' It then applies those patterns to new situations.\"\n   - **Human-set objectives:** \"A human decides what the system should optimize for. 'Approve loans fast,' 'recommend engaging content,' 'filter harmful posts.' That choice shapes everything the system does. If the objective is too narrow, the system can cause problems.\"\n   - **Concrete example:** Show how Netflix's system works: trained on millions of viewing choices (data) → learns patterns like \"people who watch sci-fi also watch thrillers\" (pattern recognition) → optimizes to keep you watching (human objective). If the objective is only \"maximize watch time,\" it may recommend increasingly violent content because that keeps people watching longest.\n\n4. **Design and Deployment: The Root of Risk (final section, ~15 minutes).**\n   - **Pick one use case from the landscape** (recommend hiring or credit scoring, as both have clear design flaws).\n   - **Show the causal chain:**\n     - **Design choice:** What data did the company use? What objective did they code in? What did they decide to measure?\n     - **System behavior:** What does the system actually do as a result?\n     - **Risk:** Who is harmed, and why did that harm arise from the design/deployment choice, not just from \"the AI made a mistake\"?\n   - **Concrete example (Amazon hiring algorithm):**\n     - **Design choice:** Amazon trained the system on 10 years of past hiring data (mostly male engineers in technical roles).\n     - **System behavior:** The system learned that \"résumé keywords associated with men and STEM roles = likely good hire.\" When given new résumés, it scored male applicants higher.\n     - **Risk:** Women were systematically ranked lower, not because they were less qualified, but because the training data reflected past underrepresentation. Amazon's choice to use historical data without correcting for that bias meant the system repeated and reinforced the past.\n   - **Reinforce the key insight:** The risk did not happen by accident or because \"AI is biased.\" It happened because of specific choices about what data to use and what to optimize for. A different choice (e.g., \"train on recent diverse hires\" or \"penalize the system if women score lower\") would have produced a different outcome.\n\n5. **Closure: Anticipate Unit 3.**\n   - Acknowledge that we have surfaced risks (wrong decisions, exclusion, unfairness) but have not yet named the systematic way to think about them. Hint: \"Next unit, we'll build a vocabulary for these problems — bias, fairness, privacy, transparency, accountability — that will let us diagnose and fix them.\"\n\n### Facilitation Notes\n\n- **Use a table or visual map** for the five use cases to mirror Michele's documented strength with structured frameworks.\n- **Elicit examples from Michele early.** After defining AI and LLM, ask: \"Have you encountered any of these systems — recommendation engines, credit decisions, chatbots?\" This activates prior experience and surfaces misconceptions early.\n- **When discussing benefits and risks, use cause-and-effect language** (\"The benefit is X because the system does Y\"; \"The risk happens because the design choice was Z\"). This mirrors her strength with causal chains.\n- **For the design/deployment question, model the full chain once, then ask Michele to trace it for a second use case.** This scaffolds her toward independent application.\n- **If Michele conflates \"the AI made a bad decision\" with \"the system was designed to make that kind of decision,\" pause and clarify:** \"The system didn't decide on its own to do that. A human chose what data to feed it and what goal to optimize. That choice led to this outcome.\"\n- **Expect Michele may raise fairness or rights concerns during the landscape survey.** Validate these as important (\"That's a real concern, and it's about fairness\") and note that you'll develop the language to analyze them systematically in Unit 3.", "scores": {"section_structure": 1, "golden_similarity": 0.8227812811561983, "instruction_adherence": 1, "pairwise_preference": 0, "golden_agreement": 0.9, "retrieval_grounding": 0.97}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan opens with the two working concepts AI and LLM before the landscape survey, explicitly keeps to 2-4 minutes, and grounds both in immediate business examples (Amazon recommendation engine, ChatGPT) before moving on—fully consistent with the lesson-specific instruction and the course's forbidden/allowed constraints.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A's Teaching Instructions are a scripted, minute-by-minute lesson with full worked examples and dialogue, directly violating the high-level-only requirement, and its padding buries the usable guidance. Plan B covers all eight sections in order, keeps the scope envelope explicit, grounds personalization in the summaries, and stays appropriately high-level.", "golden_agreement": "The candidate matches the reference on nearly everything: identical mastery outcomes, same topic sequence (definitions → five use cases with benefit/risk pairs → plain-language mechanics → design/deployment deep dive), the same forbidden scope (ethical frameworks, governance, fairness metrics, regulation, technical jargon), and the same core new concepts and teaching approach (concrete examples first, non-technical language, causal tracing). Minor deviations: the closing explicitly previews Unit 3 vocabulary (bias, fairness, privacy) which the reference forbids, and it replaces the 'student supplies a sixth use case' active-practice step with tracing a second use case's design chain.", "retrieval_grounding": "Nearly every claim about Michele traces to the summaries: her strength with structured frameworks (K/I/S, matrices), concrete examples, guided-practice scaffolding, causal-chain reasoning (print quote, psychological safety), risk/benefit skills from probability-impact work, her reliance on tutor exemplars, and the hiring-algorithm knowledge gap all appear in the retrieved lessons. The only slight stretch is the casual aside that she 'may have used' ChatGPT, which is hedged rather than asserted."}}}}]</script>

      .replace(/\*\*/g, '')
      .trim()
      .replace(/:$/, '');
    const hit = SECTION_NAMES.find((n) => n.toLowerCase() === stripped.toLowerCase());
    return hit;
  }

  function renderPlan(text) {
    const rawLines = escapeHtml(text).split('\n');
    let html = '';
    let para = [];

    // A stack of open lists, outermost first. Each frame's `items` holds
    // one entry per <li>, and a deeper-indented bullet run nests inside the
    // most recent item of whichever frame is on top when it starts — this
    // is what lets "- **Allowed:**" followed by an indented sub-list render
    // as a heading bullet with its own nested list, instead of every bullet
    // in the source collapsing into one flat list regardless of indent.
    const stack = [];

    const popListFrame = () => {
      const frame = stack.pop();
      const itemsHtml = frame.items
        .map((item) => `<li>${inline(item.text)}${item.childrenHtml}</li>`)
        .join('');
      const listHtml = `<${frame.type}>${itemsHtml}</${frame.type}>`;
      if (stack.length) {
        const parent = stack[stack.length - 1];
        parent.items[parent.items.length - 1].childrenHtml += listHtml;
      } else {
        html += listHtml;
      }
    };
    const flushLists = () => { while (stack.length) popListFrame(); };

    const pushListItem = (type, indent, text) => {
      while (stack.length && indent < stack[stack.length - 1].indent) popListFrame();

      const top = stack[stack.length - 1];
      const sameLevel = top && indent === top.indent;
      if (sameLevel && top.type === type) {
        top.items.push({ text, childrenHtml: '' });
        return;
      }
      if (sameLevel) popListFrame(); // same indent, different marker — sibling list of the other type

      stack.push({ type, indent, items: [{ text, childrenHtml: '' }] });
    };

    const flushPara = () => {
      if (para.length) {
        html += `<p>${inline(para.join(' '))}</p>`;
        para = [];
      }
    };

    for (let raw of rawLines) {
      const hardBreak = /  $/.test(raw);
      const indent = raw.length - raw.trimStart().length;
      const line = raw.trim();

      if (line === '') { flushPara(); continue; }
      if (/^-{3,}$/.test(line)) { flushPara(); flushLists(); html += '<hr>'; continue; }

      const sectionName = matchSectionName(line);
      if (sectionName) {
        flushPara(); flushLists();
        html += `<h2>${sectionName}</h2>`;
        continue;
      }

      const mdHeading = line.match(/^(#{1,6})\s+(.+)$/);
      if (mdHeading) {
        flushPara(); flushLists();
        const level = mdHeading[1].length <= 2 ? 'h1' : 'h3';
        html += `<${level}>${inline(mdHeading[2])}</${level}>`;
        continue;
      }

      const bullet = line.match(/^[-*•]\s+(.+)$/);
      if (bullet) {
        flushPara();
        pushListItem('ul', indent, bullet[1]);
        continue;
      }

      const numbered = line.match(/^\d+\.\s+(.+)$/);
      if (numbered) {
        flushPara();
        pushListItem('ol', indent, numbered[1]);
        continue;
      }

      const label = line.match(/^([A-Za-z][A-Za-z /]{2,30}):$/);
      if (label) {
        flushPara(); flushLists();
        html += `<div class="label-line">${inline(label[1])}</div>`;
        continue;
      }

      // A plain text line ends any list still open above it — without this,
      // a list left pending here (because nothing has forced it to flush
      // yet) gets flushed later by whatever list starts next, landing after
      // this paragraph in the output even though it came first in the source.
      flushLists();
      para.push(line + (hardBreak ? '<br>' : ''));
    }
    flushPara();
    flushLists();
    return html;
  }

  // ---------- Wiring ----------

  const lessonSelect = document.getElementById('lessonSelect');
  const rowCounter = document.getElementById('rowCounter');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const modelBar = document.getElementById('modelBar');
  const leftContent = document.getElementById('leftContent');
  const rightContent = document.getElementById('rightContent');
  const rightSwatch = document.getElementById('rightSwatch');
  const rightName = document.getElementById('rightName');
  const scoreSwatch = document.getElementById('scoreSwatch');
  const scoreName = document.getElementById('scoreName');
  const scoreCards = document.getElementById('scoreCards');
  const tallyLine = document.getElementById('tallyLine');
  const leftScroll = document.getElementById('leftScroll');
  const rightScroll = document.getElementById('rightScroll');
  const syncScroll = document.getElementById('syncScroll');
  const scoreboardToggle = document.getElementById('scoreboardToggle');
  const scoreboardPanel = document.getElementById('scoreboardPanel');
  const scoreboardBody = document.getElementById('scoreboardBody');
  const lessonInfoToggle = document.getElementById('lessonInfoToggle');
  const lessonInfoPanel = document.getElementById('lessonInfoPanel');
  const lessonInfoInner = document.getElementById('lessonInfoInner');

  LESSONS.forEach((lesson, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    const label = lesson.lessonTitle ? `${lesson.course} — ${lesson.lessonTitle}` : lesson.course;
    opt.textContent = `${i + 1}. ${label}`;
    lessonSelect.appendChild(opt);
  });

  MODELS.forEach((m) => {
    const tab = document.createElement('button');
    tab.className = 'model-tab';
    tab.dataset.key = m.key;
    tab.innerHTML = `<span class="swatch" style="background:var(${m.var})"></span><span class="mname">${m.name}</span><span class="mpref mono"></span>`;
    tab.addEventListener('click', () => { modelKey = m.key; render(); });
    modelBar.appendChild(tab);
  });

  function renderLessonInfo(lesson) {
    const crumbs = [lesson.course, lesson.unitTitle].filter(Boolean).join(' &rsaquo; ');
    const outcomes = (lesson.masteryOutcomes || [])
      .map((o) => `<li>${escapeHtml(o)}</li>`)
      .join('');
    const instr = lesson.instructions || {};
    const instrBlock = (key, label, openByDefault) => {
      const text = instr[key];
      if (!text) return '';
      return `
        <details${openByDefault ? ' open' : ''}>
          <summary>${label}</summary>
          <div class="lesson-info-body">${inline(escapeHtml(text))}</div>
        </details>
      `;
    };

    lessonInfoInner.innerHTML = `
      <div class="lesson-info-crumb">${crumbs}</div>
      <div class="lesson-info-title">${escapeHtml(lesson.lessonTitle || lesson.course)}</div>
      ${outcomes ? `<div class="lesson-info-label">Mastery outcomes</div><ul class="lesson-info-outcomes">${outcomes}</ul>` : ''}
      <div class="lesson-info-label">Planner instructions</div>
      ${instrBlock('lesson', 'Lesson', true)}
      ${instrBlock('unit', 'Unit', false)}
      ${instrBlock('course', 'Course', false)}
      ${!instr.lesson && !instr.unit && !instr.course ? '<p class="score-card-body empty">No planner instructions recorded for this row.</p>' : ''}
    `;
  }

  function render() {
    const lesson = LESSONS[lessonIndex];

    lessonSelect.value = lessonIndex;
    rowCounter.textContent = `${lessonIndex + 1} of ${LESSONS.length}`;
    prevBtn.disabled = lessonIndex === 0;
    nextBtn.disabled = lessonIndex === LESSONS.length - 1;

    leftContent.innerHTML = renderPlan(lesson.production);
    renderLessonInfo(lesson);

    MODELS.forEach((m) => {
      const tab = modelBar.querySelector(`[data-key="${m.key}"]`);
      const data = lesson.models[m.key];
      tab.dataset.active = String(m.key === modelKey);
      tab.querySelector('.mpref').textContent = data ? pct(data.scores.pairwise_preference) : '—';
    });

    const active = lesson.models[modelKey];
    const meta = MODELS.find((m) => m.key === modelKey);
    rightSwatch.style.background = `var(${meta.var})`;
    rightName.textContent = meta.name;
    scoreSwatch.style.background = `var(${meta.var})`;
    scoreName.textContent = meta.name;

    if (!active) {
      rightContent.innerHTML = '<p><em>No result for this model on this lesson.</em></p>';
      scoreCards.innerHTML = '';
      return;
    }

    rightContent.innerHTML = renderPlan(active.output);

    const tally = tallyFor(modelKey);
    const tallyBits = [`${tally.won} won`, `${tally.tied} tied`, `${tally.lost} lost`];
    if (tally.missing) tallyBits.push(`${tally.missing} missing`);
    tallyLine.textContent = `${tallyBits.join(' · ')} — of ${LESSONS.length} lessons`;

    scoreCards.innerHTML = SCORE_DEFS.map((s) => {
      const note = active.reasoning[s.key];
      const body = note
        ? `<p class="score-card-body">${escapeHtml(note)}</p>`
        : `<p class="score-card-body empty">${s.noRationale || 'No rationale recorded.'}</p>`;
      const verdict = s.key === 'pairwise_preference' ? preferenceVerdict(active.scores[s.key]) : null;
      const verdictTag = verdict
        ? `<span class="verdict-tag"><span class="arrow">${verdict.arrow}</span>${verdict.label}</span>`
        : '';
      const infoContent = `
        <div class="score-info-section">What this measures</div>
        <p class="score-info-text">${escapeHtml(s.explanation || '')}</p>
        ${s.prompt ? `<div class="score-info-section">Judge prompt</div><pre class="score-info-prompt">${escapeHtml(s.prompt)}</pre>` : ''}
      `;
      return `
        <div class="score-card${s.decisive ? ' decisive' : ''}">
          <div class="score-card-head">
            <span class="score-card-label-wrap">
              <span class="score-card-label">${s.label}</span>
              <button class="info-toggle" type="button" aria-label="What does ${s.label} measure?">i</button>
            </span>
            <span class="score-card-value">${pct(active.scores[s.key])}</span>
          </div>
          <div class="score-info" data-open="false">${infoContent}</div>
          ${verdictTag}
          ${body}
        </div>
      `;
    }).join('');
  }

  lessonSelect.addEventListener('change', () => { lessonIndex = Number(lessonSelect.value); render(); });
  prevBtn.addEventListener('click', () => { if (lessonIndex > 0) { lessonIndex--; render(); } });
  nextBtn.addEventListener('click', () => { if (lessonIndex < LESSONS.length - 1) { lessonIndex++; render(); } });

  let syncing = false;
  function linkScroll(source, target) {
    source.addEventListener('scroll', () => {
      if (!syncScroll.checked || syncing) return;
      syncing = true;
      const ratio = source.scrollTop / Math.max(1, source.scrollHeight - source.clientHeight);
      target.scrollTop = ratio * Math.max(1, target.scrollHeight - target.clientHeight);
      syncing = false;
    });
  }
  linkScroll(leftScroll, rightScroll);
  linkScroll(rightScroll, leftScroll);

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
    if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  });

  scoreboardBody.innerHTML = MODELS.map((m) => {
    const agg = aggregateFor(m.key);
    return `
      <tr>
        <td class="model-name"><span class="swatch" style="background:var(${m.var})"></span>${m.name}</td>
        <td>${pct(agg.structure)}</td>
        <td>${pct(agg.similarity)}</td>
        <td>${pct(agg.agreement)}</td>
        <td>${pct(agg.grounding)}</td>
        <td>${pct(agg.instructions)}</td>
        <td class="pref-col">${pct(agg.preference)}</td>
        <td>${agg.tally.won}</td>
        <td>${agg.tally.tied}</td>
        <td>${agg.tally.lost}</td>
      </tr>
    `;
  }).join('');

  scoreCards.addEventListener('click', (e) => {
    const btn = e.target.closest('.info-toggle');
    if (!btn) return;
    const info = btn.closest('.score-card').querySelector('.score-info');
    info.dataset.open = String(info.dataset.open !== 'true');
  });

  scoreboardToggle.addEventListener('click', () => {
    const open = scoreboardToggle.dataset.open !== 'true';
    scoreboardToggle.dataset.open = String(open);
    scoreboardPanel.dataset.open = String(open);
    scoreboardToggle.lastChild.textContent = open ? ' hide scoreboard' : ' show scoreboard';
  });

  lessonInfoToggle.addEventListener('click', () => {
    const open = lessonInfoToggle.dataset.open !== 'true';
    lessonInfoToggle.dataset.open = String(open);
    lessonInfoPanel.dataset.open = String(open);
    lessonInfoToggle.lastChild.textContent = open ? ' hide lesson info' : ' show lesson info';
  });

  // ---------- Rationale panel resize ----------

  const splitEl = document.querySelector('.split');
  const resizeHandle = document.getElementById('resizeHandle');
  const MIN_RAIL = 280;
  const MAX_RAIL = 640;

  resizeHandle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    splitEl.classList.add('is-resizing');

    const onMove = (moveEvent) => {
      const width = Math.min(MAX_RAIL, Math.max(MIN_RAIL, window.innerWidth - moveEvent.clientX));
      splitEl.style.setProperty('--rail-width', `${width}px`);
    };
    const onUp = () => {
      splitEl.classList.remove('is-resizing');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  render();
</script>
