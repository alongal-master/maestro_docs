er outputs meet the six required mastery standards.\n\n---\n\n## Teaching Instructions\n\n### 1. Anchor in Part 1 Work (Immediate Recall)\n- Briefly review the student's part 1 analysis: ethical concerns they flagged (unfair rankings, lack of explanation), stakeholders named, and business pressure described.\n- Affirm what they got right: they spotted real issues and understood the urgency.\n- Frame part 2 as the \"constrained defense\" — now they must do the analytical heavy lifting under time pressure, just like a PM in a real launch meeting.\n\n### 2. Core Ethical Issue — One Sentence\n- Ask: \"In one sentence, what is the fundamental right-vs.-wrong question about launching HireView as-is?\"\n- Expect answers around fairness (some candidates systematically ranked lower), transparency (candidates don't know why they're rejected), or accountability (company hasn't tested bias or explained it to clients).\n- **Do not accept multiple issues.** Push for a single prioritized statement, e.g., \"Should we launch an AI hiring tool that disadvantages non-native speakers and candidates with disabilities without disclosure to job seekers?\"\n- Validate that the issue is genuinely ethical (involves harm, fairness, rights, or duty violation), not operational (not just \"we're short on time\").\n\n### 3. Key Trade-Off and Stakeholder Map (Three Stakeholders)\n- Ask: \"What do we gain if we launch? What do we lose? What do we gain if we delay? What do we lose?\"\n- Expected gains (launch): revenue, client satisfaction, competitive parity, market opportunity.\n- Expected losses (launch): liability/legal risk, reputational harm if bias surfaces, harm to candidates.\n- Expected gains (delay): time to test, fix bias, build client confidence in fairness.\n- Expected losses (delay): lost revenue, disappointed client, competitive disadvantage.\n- **Identify three most important stakeholders:** Likely candidates: job candidates, HireView leadership/company, client employers. Or: candidates, recruiters, HireView executives. Ensure the student maps **at least one low-power stakeholder** (candidates have no voice in the launch decision).\n- For each stakeholder, ask: what do they gain or lose from launch vs. delay?\n\n### 4. Select and Apply One Ethical Framework\n- Ask: \"Which of the four frameworks—consequentialist, deontological, virtue ethics, or stakeholder theory—best fits the core issue you identified?\"\n- **Do not require all four.** If they pick consequentialism, have them map outcomes for all stakeholders and decide whether the greatest good is served by launching or delaying. If they pick deontology, have them identify the duties and rights at stake (e.g., duty of transparency, right to fair consideration). If they pick virtue ethics, have them ask: \"What would an honest, responsible product manager do?\"\n- **Require a one-sentence justification** for their framework choice (e.g., \"Consequentialism fits because the decision turns on whether the harm to candidates outweighs the business benefit\").\n- Have them produce a **one-sentence verdict** using that framework (e.g., \"Because candidates will be systematically disadvantaged, and the company has not tested or disclosed this, consequentialism favors delay\"; or \"Deontology prohibits deploying a tool that violates candidates' right to fair evaluation without disclosure\").\n\n### 5. AI Ethics Components — Two Most Significant\n- Ask: \"Which two of the five AI ethics components—bias, fairness, transparency, accountability, privacy—are most at risk in the HireView launch?\"\n- **Expect bias and fairness or transparency and accountability.** Do not require all five.\n- For each component, ask: \"What specifically is going wrong?\" Push for concrete detail:\n  - **Bias:** \"Training data encoded historical hiring patterns; non-native accents and limited facial mobility are now flagged as lower 'hireability.' The company hasn't tested this or disclosed it.\"\n  - **Fairness:** \"Candidates with disabilities are systematically scored lower on 'engagement' (facial expression); non-native speakers are penalized. This is equal-treatment unfairness (same process for everyone) but creates unequal outcomes for protected groups.\"\n  - **Transparency:** \"Candidates don't know the AI scored them. They don't know why they were rejected. They can't challenge the decision.\"\n  - **Accountability:** \"No one at HireView has formally tested for bias. The data science lead says the model can't be fixed before launch. There's no clear owner responsible for monitoring outcomes post-launch.\"\n\n### 6. EEOC Disparate Impact Assessment\n- Ask: \"Does launching HireView as described create EEOC disparate impact risk? Yes or no?\"\n- **Require a clear answer.** (The answer is almost certainly yes, but the student must commit.)\n- Ask: \"Which protected group(s) are at risk?\" (Candidates with disabilities; possibly non-native speakers if national-origin discrimination applies; potentially age if facial-recognition systems age-bias candidates.)\n- Ask: \"In plain terms, how does the AI disadvantage that group?\" (E.g., \"Candidates with limited facial mobility will be automatically flagged as 'low engagement' and rejected at higher rates than non-disabled candidates, even if they would be equally good hires. This creates a disparate impact on the basis of disability.\")\n- **Do not require knowledge of EEOC burden-of-proof procedures or remedies.** Just confirm that the described practice shows disparate impact on a protected class.\n\n### 7. Integration and Closure\n- Ask: \"If you were the PM and had to make a decision today, would you launch, delay, launch with conditions, or stop deployment? Defend your choice in one paragraph using your framework, the key trade-off, and the EEOC risk.\"\n- Do not require a full written recommendation. A verbal summary is sufficient.\n- Affirm that their analysis meets the six required mastery outputs: core issue (1 sentence), trade-off (gains/losses), three stakeholders (interests), one framework (with verdict), two AI ethics components (with specific harms), EEOC assessment (yes/no, group, justification).\n- Close by asking: \"What do you think is the hardest part of this decision — the part where frameworks don't fully resolve the tension?\"\n\n---\n\n**End of Lesson Plan**", "scores": {"section_structure": 0.875, "golden_similarity": 0.8504555504627422, "golden_agreement": 0.85, "instruction_adherence": 1, "pairwise_preference": 0, "retrieval_grounding": 1}, "reasoning": {"section_structure": "Matched 7/8 sections, missing: Student teaching preferences summary", "golden_agreement": "The candidate reproduces the reference's mastery outcomes verbatim, matches the topics, scope constraints (one framework, two AI-ethics components, plain-language EEOC verdict), 'no new concepts' decision, and a nearly identical teaching sequence. Minor deviations: its closing step asks the student to defend a launch/delay recommendation, which the reference explicitly places outside scope (final recommendation writing is future content), and it omits a few reference cues (iTutor Group precedent, bias entry points, table-based capture).", "instruction_adherence": "The plan faithfully uses the HireView case facts as specified, enforces the six-required-outputs constraint, explicitly forbids applying all four frameworks or all five AI ethics components, and tests defensible prioritization rather than completeness—fully consistent with both unit and lesson-level guidance.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A's Teaching Instructions are a scripted, step-by-step lesson with expected answers and model verdicts, directly violating the high-level-only requirement, while Plan B keeps all eight sections compliant, grounds its personalisation in the summaries (tables, consequentialism default, iTutor precedent), and maintains tight scope discipline. Plan B covers all outcomes with far less padding.", "retrieval_grounding": "Every claim about the student traces to the summaries: intermediate mastery in the part 1 lesson (2026-08-26) with its specific strengths and the power/voice/relational-pressure gaps, the equal-treatment fairness default from the fairness lesson, prior mastery of frameworks, B-F-P-T-A components, EEOC disparate impact, stakeholder/trade-off skills with accurate dates (2026-06-23 through 2026-08-10), and the accurate note that no learning preferences are recorded. No unsupported claims of prior mastery or fabricated struggles/preferences were found."}}}}, {"id": "c5ef6a2d-a24e-4044-b938-994cc8ae95f5", "course": "Business ethics & AI governance", "fingerprint": "e0028ae57e18", "production": "1. **Topics**\n   • Surface-level ethical unease in the HireView AI launch scenario  \n   • Stakeholder identification (direct, indirect, “silent/voiceless”)  \n   • Mapping the decision being pushed (full rollout vs. any alternative)  \n   • Pressures driving urgency (business, competitive, relational)  \n   • Professional articulation of first-reaction concerns (plain language)\n\n2. **Scope Envelope**\n   Allowed (this lesson):  \n   1. Describing what “feels wrong” about HireView, in everyday language  \n   2. Listing and briefly describing at least three affected stakeholders, incl. one without decision-room power  \n   3. Stating the concrete decision under discussion, who is pushing for it, and why it is time-sensitive  \n   4. Identifying types of pressure: business metrics, market competition, interpersonal/relational expectations\n\n   Forbidden (out-of-scope for this lesson):  \n   • Applying or even naming formal ethical frameworks (consequentialism, deontology, virtue ethics, stakeholder theory, justice/fairness, rights, etc.)  \n   • Running the full ethical evaluation workflow or trade-off analysis  \n   • Using the AI-ethics 5-component checklist (bias, fairness, privacy, transparency, accountability)  \n   • Detailed legal / regulatory analysis (EEOC, FTC, EU AI Act, disparate-impact tests)  \n   • Governance structures, compliance programs, whistleblowing mechanics  \n   • Any solution proposals, mitigations, or model-retraining tactics  \n   • Quantitative risk matrices, cost-benefit spreadsheets, or technical deep dives  \n   • Previewing content from Final Case Study – Part 2 or Part 3\n\n3. **Mastery Outcomes**\n   • Identify at least two things that feel ethically problematic about the HireView scenario before any formal analysis — describe the unease in plain terms, not framework language.  \n   • Name at least three stakeholders who might be affected by the platform going live, including at least one who has no voice in the launch decision.  \n   • Articulate what decision is being pushed, who is pushing it, and what pressures — business, competitive, and relational — are driving the urgency.\n\n4. **New Concepts Introduced**\n   • Pressure taxonomy (business vs. competitive vs. relational pressure) — simple labels to help the student name why the timetable feels urgent.  \n   No other new concepts are introduced; stakeholder terminology is prior knowledge.\n\n5. **General remarks / tips**\n   • Keep the discussion conversational and exploratory; the goal is emotional and situational awareness, not analysis.  \n   • Invite the student to “trust their gut” and narrate discomfort in everyday words first, then capture it succinctly.  \n   • Use open prompts (“What jumps out as unfair or risky?”) before moving to stakeholder listing.  \n   • Encourage breadth: nudge for less-obvious or low-power stakeholders once obvious ones are named.  \n   • When discussing pressures, model the three labels (business, competitive, relational) with one short example each, then let the student supply their own.  \n   • Capture answers in a visible list or lightweight table only if the student seems to think best that way; otherwise free text is fine.  \n   • Refrain from correcting small imprecisions now; depth and precision come in Parts 2–3.\n\n6. **Things to Avoid**\n   • Do NOT mention ethical frameworks, legal standards, or the evaluation workflow taught just now (2026-08-27T14:13:45.173Z).  \n   • Avoid jargon such as “disparate impact,” “utilitarian trade-off,” or “bias entry point.”  \n   • Do not drift into recommending fixes or verdicts.  \n   • No references to future lessons or graded criteria.  \n   • Skip reinforcement of toolkit steps learned within the past 2 h.\n\n7. **Student teaching preferences summary**\n   • No explicit preferences provided.  \n   • Observed patterns: student is comfortable with structured lists/tables and benefits from prompts that broaden perspective; tends to default to binary classifications and may overlook less-visible stakeholders.  \n   • Encouraged approach: start open-ended, then scaffold with a light structure only if needed.\n\n8. **Teaching instructions**\n   High-level guidance for the teaching agent:  \n   1. Warm-start with a brief scenario recap (30 s) to place the student back “in role” as Product Manager.  \n   2. Prompt for gut-level ethical unease: “What, if anything, makes you uncomfortable about rolling this out next month?” Elicit at least two concrete concerns.  \n   3. Transition to stakeholder brainstorming; aim for a list ≥ 3, steering toward inclusion of one voiceless group (e.g., disabled applicants).  \n   4. Ask the student to pinpoint the exact decision being driven (full launch now) and name the primary advocate(s) and their stated or implied pressures, labeling each pressure with the business/competitive/relational taxonomy.  \n   5. Summarize the student’s inputs aloud, checking for accuracy, then close by noting that deeper analysis comes later.", "lessonTitle": "Final case study, part 1", "unitTitle": "Professional judgment in practice", "masteryOutcomes": ["Identify at least two things that feel ethically problematic about the HireView scenario before any formal analysis — describe the unease in plain terms, not framework language.", "Name at least three stakeholders who might be affected by the platform going live, including at least one who has no voice in the launch decision.", "Articulate what decision is being pushed, who is pushing it, and what pressures — business, competitive, and relational — are driving the urgency."], "instructions": {"unit": "Shared case study used across the three final case-study lessons (parts 1–3): HireView AI — the student is a Product Manager at HireView AI, which sells an AI video-interview platform that scores candidates ('hireability score') from speech, facial expressions, and word choice. Business context: clients report ~60% reduction in hiring time; a major national retail client wants full rollout next month; competitors already offer similar tools. Internal concerns: non-native accents score lower; candidates with disabilities (e.g. limited facial mobility) are flagged 'low engagement'; the model was trained on past 'successful hires' (historical bias risk). Stakeholder positions: Legal — 'no clear EEOC violation yet, but disparate-impact risk exists'; CEO — 'if we delay, we lose the client'; Data science lead — 'we can improve the model, but not before launch.' Use these facts only when the individual lesson's tutorInstructions reference the HireView case.", "lesson": "Scope: this lesson comes before any analytical work — frameworks and the evaluation workflow are not introduced here. The student's task is to react as a professional, not to perform a structured exercise.\n\nScenario: You are a Product Manager at HireView AI. Your team has built an AI-powered video interview platform used by large employers to screen job candidates. How the system works: candidates record video answers to interview questions; the AI analyzes speech patterns, facial expressions, and word choice; the system assigns a 'hireability score'; recruiters use this score to decide who moves forward. Business context: clients report a 60% reduction in hiring time and lower recruiting costs; a major client (national retail chain) wants full rollout next month; competitors already offer similar tools. Internal concerns your team has seen: candidates with non-native accents score lower on average; candidates with disabilities (e.g., limited facial mobility) are flagged as 'low engagement'; the model was trained mostly on past 'successful hires,' introducing historical bias risk. Legal team says: 'No clear EEOC violation yet — but risk exists if outcomes show disparate impact.' CEO says: 'If we delay, we lose the client.' Data science lead says: 'We can improve the model — but not before launch.'"}, "models": {"luna": {"output": "# Topics\n\n- Initial ethical unease about the HireView AI platform\n- Stakeholders affected by the launch\n- The launch decision and pressures driving urgency\n\n# Scope Envelope\n\n**Allowed:**\n- Plain-language identification of at least two ethical concerns in the HireView scenario\n- Identification of at least three affected stakeholders, including a stakeholder without a voice in the launch decision\n- Description of the decision being pushed, the person or group pushing it, and the business, competitive, and relational pressures involved\n- Professional reaction and perspective-taking before formal ethical analysis\n\n**Forbidden:**\n- Formal ethical evaluation workflows\n- Structured stakeholder analysis involving power, interest, influence, vulnerability, or conflicts\n- Ethical frameworks, including consequentialism, deontology, virtue ethics, and stakeholder theory\n- Trade-off analysis or weighing gains against ethical costs\n- Formal identification of the core ethical issue in one sentence\n- AI ethics component analysis using bias, fairness, privacy, transparency, or accountability as an evaluative checklist\n- EEOC disparate-impact analysis or legal classification\n- FTC enforcement or other regulatory analysis\n- EU AI Act risk classification or compliance obligations\n- Governance structures, internal oversight, or external regulation\n- Whistleblowing, protected disclosures, or escalation strategies\n- Final recommendations about whether to launch, delay, conditionally launch, or stop deployment\n- Professional ethical communication requiring a defended recommendation\n- Toolkit inventory or professional identity as an ethical actor\n\n# Mastery Outcomes\n\n- Identify at least two things that feel ethically problematic about the HireView scenario before any formal analysis — describe the unease in plain terms, not framework language.\n- Name at least three stakeholders who might be affected by the platform going live, including at least one who has no voice in the launch decision.\n- Articulate what decision is being pushed, who is pushing it, and what pressures — business, competitive, and relational — are driving the urgency.\n\n# New Concepts Introduced\n\n- **Scenario immersion:** Responding first to the human and professional significance of a situation, before applying formal analytical tools.\n- **Ethical unease:** A plain-language sense that something may be harmful, unfair, exclusionary, or troubling, without yet naming a formal ethical framework.\n- **Silent or voiceless stakeholder:** A person or group affected by a decision but not represented in the decision-making conversation. This concept has been practiced previously, most recently at **2026-08-08T06:04:53.613Z**; because it was practiced more than 24 hours ago, it may be briefly reinforced if naturally useful.\n- **Launch pressure:** The combination of commercial, competitive, and relationship-based forces that makes a decision feel urgent.\n\n# General remarks / tips\n\n- Treat this as an immersive opening to a shared case, not as a formal analysis exercise.\n- The student has previously shown strong ability to identify stakeholders, including less powerful or voiceless groups, and has recognized hiring-AI concerns involving accents, disability, and unfair screening. Invite independent reactions before supplying labels.\n- Keep prompts open-ended and concrete: ask what feels troubling, who could experience consequences, and why the company feels pressure to move quickly.\n- Encourage plain language such as “qualified people may be screened out for reasons unrelated to their ability” rather than framework terminology.\n- Do not ask the student to rank stakeholders, assess legal exposure, choose a framework, calculate trade-offs, or recommend a launch decision.\n- Distinguish facts stated in the scenario from the student’s interpretation. The scenario facts include the reported 60% reduction in hiring time, the client’s desired rollout next month, competitor activity, lower average scores for non-native accents, disability-related “low engagement” flags, historical training data, and the views of Legal, the CEO, and the data science lead.\n- Use brief reflection pauses and ask the student to explain why a concern or stakeholder matters. This will test understanding without turning the lesson into a structured analysis.\n- If the student immediately proposes a recommendation, acknowledge it but redirect: “We will decide what should happen later; for now, let’s understand what feels wrong, who is affected, and why the pressure exists.”\n\n# Things to Avoid\n\n- Do not introduce or preview the analytical work from later case-study lessons.\n- Do not use framework language to describe the student’s initial reaction.\n- Do not turn stakeholder identification into a power-interest or vulnerability matrix.\n- Do not ask for a complete list of every stakeholder or a formal stakeholder register.\n- Do not frame the lesson as a compliance or regulatory exercise.\n- Do not make unsupported claims that the platform definitely violates a law or that discrimination is proven.\n- Do not minimize the concerns because competitors offer similar tools or because the system improves hiring speed.\n- Do not reuse examples from earlier lessons that contain out-of-scope analytical constructs.\n- Do not address spelling, personal issues, or unrelated matters.\n- Do not use closed-question widgets; this lesson is intended to elicit an open professional reaction.\n\n# Student teaching preferences summary\n\nNo specific learning preferences are recorded. Use a flexible, conversational approach with short scenario prompts, reflection, and concise follow-up questions. Adapt pacing to the student’s responses and favor plain-language explanations before terminology.\n\n# Teaching instructions\n\n- Begin by presenting the HireView scenario clearly and allowing the student to react without interruption or formal vocabulary.\n- Ask the student to name at least two things that feel troubling or ethically problematic, then probe each concern with a simple “Who might be affected?” or “What seems wrong about that?” question.\n- Ask the student to identify at least three affected stakeholders. Ensure at least one is a group such as job applicants—especially applicants with non-native accents or disabilities—that has no direct voice in the launch decision.\n- Ask the student to describe what is being pushed, who is pushing it, and the pressures behind the urgency. Elicit the CEO’s client and revenue concern, the competitive pressure from similar products, and the relationship pressure created by the national retail client’s deadline.\n- Keep the interaction focused on observation and professional reaction. Close by briefly recapping the student’s concerns, stakeholders, and sources of urgency without evaluating the eventual right answer.", "scores": {"section_structure": 1, "golden_similarity": 0.9080878846583569, "instruction_adherence": 1, "golden_agreement": 0.9, "retrieval_grounding": 0.7, "pairwise_preference": 0.5}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan faithfully reflects the HireView case facts and the lesson's specific scope: it keeps the in claim. The difference is modest since Plan B is leaner and equally covers the outcomes."}}, "nano": {"output": "## Topics  \n- Ethical “first reactions” to the HireView AI hiring scenario (plain-language unease)  \n- Stakeholder identification for a product launch (including silent stakeholders)  \n- Launch pressures: what decision is being pushed, by whom, and why now  \n\n## Scope Envelope  \n- **Allowed:**  \n  - Identify ethically problematic features of the HireView scenario before formal analysis (plain terms, not framework language)  \n  - Name at least three stakeholders affected by the platform going live, including at least one with no voice in the launch decision  \n  - Articulate the pushed decision, who is pushing it, and pressures driving urgency (business, competitive, relational)  \n  - Use scenario facts provided for the HireView case (non-native accents, disability “low engagement” flags, historical bias training, legal team caution, CEO urgency, data science lead limits)  \n- **Forbidden:**  \n  - Introducing any formal ethical evaluation frameworks or step-by-step ethical workflow (stakeholder/option/framework/trade-off analysis beyond identification)  \n  - Privacy, transparency, accountability deep-dives as “evaluation criteria” (no component-by-component scoring)  \n  - EEOC/FTC legal classification work or “is it disparate impact?” determinations  \n  - Any “how to fix” model changes, mitigation plans, or governance recommendations  \n\n## Mastery Outcomes  \n- Identify at least two things that feel ethically problematic about the HireView scenario before any formal analysis — describe the unease in plain terms, not framework language.  \n- Name at least three stakeholders who might be affected by the platform going live, including at least one who has no voice in the launch decision.  \n- Articulate what decision is being pushed, who is pushing it, and what pressures — business, competitive, and relational — are driving the urgency.  \n\n## New Concepts Introduced  \n- **Ethical “unease” as a pre-analysis signal:** treating discomfort as a legitimate starting data point (what feels off, and why it feels off) without yet proving it formally.  \n- **“No voice” stakeholders:** distinguishing stakeholders who are affected but not represented in the decision room (silent stakeholders).  \n\n## General remarks / tips  \n- Keep responses **fast and honest** at first: “Here’s what makes me uneasy” before “Here’s the argument.”  \n- Use **scenario-grounding**: every claim about ethical concern or stakeholder impact should tie back to a fact in the HireView description (not generic AI talk).  \n- When listing stakeholders, include at least one **less-obvious affected group** (someone who doesn’t sit in launch meetings).  \n- For “pressures driving urgency,” separate three sources:  \n  - **Business** (e.g., client rollout next month)  \n  - **Competitive** (competitors already have similar tools)  \n  - **Relational** (internal pressure among CEO, legal, and data science leadership)  \n\n## Things to Avoid  \n- Don’t start defending or “proving” outcomes with a framework yet; the task here is **reaction + identification**, not adjudication.  \n- Don’t over-focus only on the most obvious stakeholder (e.g., “candidates” alone).  \n- Don’t turn this into a legal compliance checklist or an EEOC-risk conclusion.  \n- Don’t propose technical fixes or launch conditions yet (that belongs in later case-study parts).  \n\n## Student teaching preferences summary  \n- The student has shown strong ability to:  \n  - identify stakeholders and consider less obvious affected parties (generally confident)  \n  - distinguish ethical issues from preference/factual disputes  \n  - recall and use AI risk vocabulary at a high level (bias/fairness, etc.)  \n- Likely productive approach for this lesson:  \n  - short, structured prompts that elicit **plain-language unease** and **stakeholder lists**, followed by brief “why now” pressure mapping  \n  - avoid lengthy framework instruction; prioritize **quick retrieval + scenario-specific statements**  \n- Caution based on prior performance:  \n  - ensure the student does not jump prematurely into “formal analysis” language or legal determinations.  \n\n## Teaching instructions  \n- Start by immersing the student in the HireView scenario and prompt them to write **two separate plain-language unease points** about what could be ethically troubling, without naming frameworks.  \n- Then have the student produce a **stakeholder list (3+ people/groups)**, making sure they include **at least one silent stakeholder** (affected but without decision power). Ask them to state, in one clause, how each stakeholder could be affected.  \n- Finish with a “launch urgency” mapping:  \n  - **What decision is being pushed** (e.g., whether to roll out the platform fully next month)  \n  - **Who is pushing it** (at least CEO/business-side leadership vs. other internal voices)  \n  - **What pressures** are driving urgency (business, competitive, relational), each in a short phrase tied to the scenario facts.  \n- Provide brief feedback that checks only for mastery-outcome alignment:  \n  - Were ethical concerns stated in **plain unease terms**?  \n  - Did they include a **no-voice** stakeholder?  \n  - Did they clearly name **decision + pusher + pressures**?", "scores": {"section_structure": 1, "golden_similarity": 0.9281746677451441, "instruction_adherence": 1, "golden_agreement": 0.85, "retrieval_grounding": 0.95, "pairwise_preference": 0.25}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan faithfully uses the HireView case facts as specified, keeps the task at reaction/identification level, and explicitly forbids frameworks, evaluation workflow, legal classification, and fixes—precisely matching the lesson's scope constraints. It reflects the lesson-specific guidance (plain-language unease, silent stakeholders, urgency mapping) rather than reading as a generic ethics plan.", "golden_agreement": "The candidate matches the reference on topics, ordering, scope boundaries, identical mastery outcomes, pressure taxonomy usage, and the teaching sequence (gut reactions → stakeholders → decision/pressure mapping). Minor deviations: it labels 'unease' and 'no-voice stakeholders' as new concepts while omitting pressure taxonomy as the sole new concept, and its student profile claims strong stakeholder-identification ability, mildly contradicting the reference's note that the student tends to overlook less-visible stakeholders.", "retrieval_grounding": "The plan's claims about the student—confident stakeholder identification including silent/less-obvious stakeholders, distinguishing ethical questions from preference/factual disputes, and strong AI risk vocabulary (bias/fairness)—are all directly traceable to the summaries. The only minor stretch is the inferred preference for 'short, structured prompts and quick retrieval,' which is not explicitly evidenced but is a mild pedagogical inference rather than a fabricated mastery claim.", "pairwise_preference": "Both orders agreed (0.25 / 0.25). Both plans satisfy the eight-section structure, copy the mastery outcomes verbatim, and stay in scope, but Plan B's forbidden list is more explicit and complete (including framework naming, the recent workflow lesson, and Part 2/3 previews), and its personalisation claims are more carefully grounded in the retrieved summaries. Plan A asserts specific HireView scenario details not supported by any provided material, a small grounding risk."}}, "haiku": {"output": "# Lesson Plan: Final Case Study, Part 1\n\n---\n\n## Topics\n\n- Recognizing ethical unease in an AI hiring platform scenario (HireView)\n- Stakeholder identification in a time-pressured business decision\n- Understanding decision drivers: business pressure, competitive urgency, and relational tension\n\n---\n\n## Scope Envelope\n\n**Allowed:**\n- Plain-language ethical intuition and recognition of unease (no frameworks required)\n- Stakeholder mapping with attention to power, voice, and affected parties\n- Business context analysis: identifying who is pushing a decision and why\n- Bias, fairness, transparency, and accountability as ethical concerns in AI hiring systems\n- EEOC and regulatory risk as contextual awareness (not deep legal analysis)\n\n**Forbidden:**\n- Formal application of ethical frameworks (consequentialism, deontology, virtue ethics, stakeholder theory)\n- Detailed fairness analysis or competing definitions of fairness\n- Privacy-specific analysis or data-minimization principles\n- Governance evaluation or internal ethics structures\n- Recommendations on whether to launch, delay, or stop\n- Whistleblowing or dissent strategies\n- Any analytical workflow or structured evaluation methodology\n\n---\n\n## Mastery Outcomes\n\n- Identify at least two things that feel ethically problematic about the HireView scenario before any formal analysis — describe the unease in plain terms, not framework language.\n- Name at least three stakeholders who might be affected by the platform going live, including at least one who has no voice in the launch decision.\n- Articulate what decision is being pushed, who is pushing it, and what pressures — business, competitive, and relational — are driving the urgency.\n\n---\n\n## New Concepts Introduced\n\n- **Gut-level ethical intuition vs. analytical judgment**: The lesson emphasizes that recognizing something feels \"wrong\" is a valid starting point, distinct from and prior to formal analysis. This is the threshold concept that moral seriousness begins with discomfort, not frameworks.\n- **Silent stakeholders in high-stakes decisions**: Parties affected by a deployment decision who have no seat at the launch table—in this case, candidates being evaluated by the system and potentially workers displaced by hiring efficiency.\n- **Business pressure as an ethical force**: The recognition that urgency, competitive threat, and client expectations shape decision-making in ways that can obscure ethical concerns.\n\n---\n\n## General Remarks / Tips\n\n- **This is a reaction lesson, not an analysis lesson.** The student should articulate what troubles them *before* picking up tools. Frameworks come in Part 2.\n- **Honor the student's intuition.** If they say something feels unfair or risky, that is the right starting point. Do not push them toward a predetermined analytical conclusion.\n- **Stakeholder identification here is broad, not deep.** The student names *who* is affected and *how*, but does not yet map power, interest, or apply normative theory.\n- **Business context is not background—it is central.** The CEO's \"we lose the client\" pressure, the competitor threat, and the data science lead's timeline constraint are not obstacles to ethics; they are part of the ethical problem.\n- **Avoid premature framework language.** If the student reaches for terms like \"consequentialist,\" gently redirect: \"Say that in plain terms—what value are you weighing?\"\n- **The student has strong prior experience** with stakeholder identification (six prior lessons), whistleblowing dilemmas, and AI bias recognition. Leverage this foundation without repeating it.\n\n---\n\n## Things to Avoid\n\n- Do not introduce formal frameworks or ask the student to apply them.\n- Do not ask for a recommendation or final judgment (\"Should they launch?\").\n- Do not present the business case as background only; center it as an ethical pressure.\n- Do not allow the student to dismiss bias and fairness concerns as \"technical issues to solve later.\"\n- Do not push the student toward a single \"correct\" list of ethical concerns; unease is individual and legitimate.\n- Do not introduce governance, compliance, or regulatory enforcement mechanisms beyond acknowledging legal risk exists.\n- Do not present any stakeholder as having a transparent, singular interest; real people have conflicting internal motivations.\n- Do not reuse lengthy prior examples; the HireView scenario itself is the case.\n\n---\n\n## Student Teaching Preferences Summary\n\nNo specific learning preferences documented. Proceed with direct, scenario-driven engagement and expect intermediate-to-high engagement with stakeholder and ethical reasoning tasks based on prior lesson performance.\n\n---\n\n## Teaching Instructions\n\n**Opening (immersion):**\nBegin by reading the HireView scenario aloud or displaying it. Do not interpret or frame it. Ask the student to sit with it for 30 seconds in silence, then ask: *\"What's your first gut feeling—does something about this situation bother you? Don't overthink it; just tell me what's uncomfortable or risky.\"*\n\n**First mastery outcome — ethical unease:**\nListen to their initial reaction without validating or correcting. If they hesitate, offer a prompt: *\"Think about the candidates recording videos. Think about the data being analyzed. Think about how the decision gets made. What concerns jump out?\"* \n\nEncourage them to describe unease in everyday language, not jargon. If they say \"This seems unfair,\" ask: *\"Unfair to whom, and in what way?\"* If they mention \"bias,\" ask: *\"What kind of bias, and where do you think it comes from in this system?\"*\n\nRequire at least two distinct concerns. Do not require them to be the \"biggest\" or \"most important\" by your judgment—only that they feel real and can be stated plainly.\n\n**Second mastery outcome — stakeholder identification:**\nOnce unease is articulated, shift to *who is affected*. Say: *\"Now let's map out everyone who is touched by this decision—directly or indirectly.\"*\n\nGuide them to think beyond the obvious (CEO, clients, product team). Use scaffolding if needed:\n- *\"Who are the people being evaluated by the system?\"*\n- *\"Who benefits if hiring gets faster?\"*\n- *\"Who might lose something if this rolls out?\"*\n- *\"Who is not in the room where this decision is being made, but will live with the consequences?\"*\n\nRequire at least three stakeholders, with at least one who has low or no voice in the launch decision. Encourage specificity: *\"Not just 'candidates'—which kinds of candidates? Not just 'employees'—which roles?\"*\n\n**Third mastery outcome — decision pressure and drivers:**\nName the decision explicitly: *\"What exactly is being decided right now? What's the 'yes' and what would 'no' look like?\"*\n\nThen map the pressure: *\"Who is pushing this forward? What are they afraid will happen if they wait? What is the business case they are making?\"*\n\nHave the student name at least three pressures: the major client's timeline, competitive threat (competitors already offer similar tools), and the internal friction between wanting to improve the model and needing to meet the launch date. Do not require the student to evaluate which pressure is most powerful—only to see that they are all real and in tension.\n\n**Closing:**\nSummarize: *\"You've identified what troubles you, who gets affected, and what's driving the urgency. In the next lesson, we'll bring tools to analyze this more systematically. For now, you've done the hardest work: noticing that something matters here and why.\"*\n\nDo not ask for a recommendation or next step.\n\n---\n\n**Note on Prior Knowledge:**\nThe student has demonstrated intermediate competence in stakeholder identification (lessons on 2026-08-08, 2026-08-01, 2026-06-27), strong recognition of ethical dimensions in AI systems (especially bias and fairness in hiring contexts, 2026-08-16, 2026-08-21), and solid articulation of ethical dilemmas including whistleblowing and competing loyalties (2026-08-22). This lesson assumes these competencies and builds on them by asking the student to apply them in a *live, unstructured scenario* without frameworks.", "scores": {"section_structure": 1, "golden_similarity": 0.8643666222442846, "instruction_adherence": 1, "golden_agreement": 0.7, "retrieval_grounding": 0.97, "pairwise_preference": 0}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan faithfully uses the HireView case facts as specified, respects the pre-analytical scope (no frameworks, no recommendation, reaction not structured exercise), centers business pressure as an ethical force, and covers all lesson-specific stakeholder/unease/decision-driver goals while explicitly forbidding what the instructions rule out.", "golden_agreement": "The candidate reproduces the reference's mastery outcomes verbatim, matches the topic sequence, plain-language intuition approach, pressure taxonomy, stakeholder breadth including voiceless groups, and the ban on formal frameworks and recommendations. However, it contradicts the reference by allowing bias/fairness/transparency/accountability concerns and EEOC/regulatory risk in scope (the reference explicitly forbids the AI-ethics checklist and legal analysis), and it previews the next lesson in the closing, which the reference prohibits.", "retrieval_grounding": "All claims about the student trace to the summaries: intermediate stakeholder identification across roughly six prior lessons (2026-06-27, 2026-07-10, two on 2026-08-01, 2026-08-08), AI bias/fairness recognition in hiring contexts (2026-08-16, 2026-08-21), and whistleblowing/competing-loyalties experience (2026-08-22). The plan correctly states no learning preferences are documented rather than inventing any, and treats no unverified concept as mastered.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A's Teaching Instructions are a scripted, step-by-step lesson with verbatim prompts and phase-by-phase choreography, which the instructions explicitly call a violation, while Plan B keeps its guidance high-level. Plan B also grounds its personalisation notes in the retrieved summaries (binary defaults, missed indirect stakeholders) and has an equally disciplined, explicit scope envelope."}}}}, {"id": "068d284c-7bce-46e9-8d0c-cece70483fff", "course": "Essentials of public speaking", "fingerprint": "e0028ae57e18", "production": "### 1. Topics  \n• Types of supporting material (data, example, expert testimony, story/narrative)  \n• Matching support to a single-sentence central idea and a defined audience  \n• Two-test credibility check: (a) accuracy / source quality, (b) audience acceptance  \n• Practice: apply the above to the student’s discussion-board speech idea  \n\n### 2. Scope Envelope  \nAllowed (in-scope):  \n1. Central-idea recall & use as a decision filter  \n2. Selecting and blending support types named in the mastery outcome  \n3. Credibility / accuracy evaluation of potential evidence  \n4. Audience-fit reasoning for chosen support  \n\nForbidden (out-of-scope; do NOT teach or reference):  \n- Speech outlining formats, signposting, or organizational patterns  \n- Delivery skills (eye contact, pacing, posture, virtual-room techniques)  \n- Visual aids or slide design  \n- Persuasive argument structures (claim–warrant, counterargument, ethical persuasion) beyond today’s accuracy/credibility test  \n- Group discussion tactics, Q&A response patterns  \n- Managing speaking anxiety routines  \n- Any Unit 2 topics (informative message design, persuasive strategies, visual support, etc.)  \n- Recording setups, video upload instructions, course exam logistics  \n\n### 3. Mastery Outcomes  \n• Select a mix of support (data, example, expert testimony, story/narrative) that advances the central idea for the discussion board speech.  \n• Evaluate your evidence on two tests: is it accurate and well-sourced, and will this audience accept it as credible?  \n\n### 4. New Concepts Introduced  \n• “Support Mix Matrix” – a quick grid the student fills to see whether each main point has at least one form of data/example/testimony/story.  \n• “Audience Credibility Lens” – a short checklist (relevance, expertise match, incentive/COI, accessibility) applied to every source.  \n\n### 5. General remarks / tips  \n• Re-use the student’s finalized Lucian central idea as the running example unless the student volunteers a new one.  \n• Emphasize trimming sources that do not carry the central idea forward, avoiding the previous overload tendency.  \n• Encourage the student to articulate why a source passes BOTH tests before locking it in.  \n• Where possible, model thinking aloud: “Does this statistic meet the Lens? Will gamers/AI-enthusiast peers accept a 2nd-century author as credible without modern context?”  \n\n### 6. Things to Avoid  \n• Quoting long academic passages; keep spoken evidence concise and paraphrased where wording is not critical.  \n• Drifting into outline formatting or slide design.  \n• Treating any single support type (e.g., data) as automatically stronger; keep focus on fit and credibility.  \n• Introducing future persuasive frameworks (logos/pathos/ethos balance, Toulmin, etc.).  \n\n### 7. Student teaching preferences summary  \nNo explicit preferences given; student consistently engages well with analytical breakdowns, enjoys real-time critique of examples, and benefits from concise decision tools (grids, checklists).  \n\n### 8. Teaching instructions  \n1. Begin by asking the student to restate or share their current central idea; jot it where both can see it.  \n2. Briefly review the four support categories with one spoken example each; keep it conversational.  \n3. Introduce the Support Mix Matrix and have the student populate it for their speech on the spot.  \n4. Walk through the Audience Credibility Lens using one of their chosen sources; nudge revisions as needed.  \n5. End by having the student verbalize (a) their final support mix and (b) one reason each source passes both credibility tests.", "lessonTitle": "Challenge: Selecting credible supporting material", "unitTitle": "Foundations of audience-centered speaking", "masteryOutcomes": ["Select a mix of support (data, example, expert testimony, story/narrative) that advances a the central idea for the discussion board speech.", "Evaluate your evidence on two tests: is it accurate and well-sourced, and will this audience accept it as credible?"], "instructions": {"course": "For this course take the role of a speech coach - focus on guidance and building confidence more than exactness with formatting", "unit": "Each Unit 1 lesson must be startable fresh: the tutor supplies context in-lesson. If the learner already has a draft or artifact from an earlier lesson, the tutor may reuse it as an illustrative example, or generate a fresh short speech topic (informative or exploratory, learner-appropriate) on the spot. Any continuity across lessons is optional, never required.", "lesson": "This is a practical lesson that builds on the student's central idea from lesson 5 for their discussion board speeches. Ask the student to share their idea before starting."}, "models": {"luna": {"output": "## Topics\n\n- Matching supporting material to a central idea\n- Four support types: data, examples, expert testimony, and stories/narratives\n- Accuracy, source quality, and audience credibility\n- Applying support to the discussion board speech\n\n## Scope Envelope\n\n- **Allowed:**\n  - Selecting data, examples, expert testimony, and stories/narratives that directly advance the central idea\n  - Evaluating evidence for accuracy and source quality\n  - Evaluating whether an audience is likely to accept a source or claim as credible\n  - Connecting support to the audience-centered central idea\n  - Using the student’s finalized central idea about Lucian of Samosata’s *A True Story* as an optional working example\n\n- **Forbidden:**\n  - Full speech organization, signposted outlines, main-point sequencing, and transitions as a formal outlining system\n  - Delivery techniques, rehearsal, pacing, eye contact, posture, vocal presence, and anxiety management\n  - Virtual-speaking adaptation and technical recording or YouTube-upload procedures\n  - Informative-message design strategies such as analogy, definition, comparison, demonstration, or plain-language jargon reduction as formal concepts\n  - Persuasive argument construction, reasoning chains, counterarguments, refutation, accommodation, and debate strategy\n  - Ethical persuasion versus manipulation as a standalone lesson topic\n  - Visual-support design, slides, diagrams, live demonstrations, and language-choice rules\n  - Group discussion, impromptu-answer patterns, and responding to audience disagreement\n  - Self-assessment of a completed speech or final-review preparation\n  - Any concepts from later course lessons, including speech organization, delivery basics, virtual speeches, managing speaking anxiety, informative-message design, complex-topic explanation, persuasive arguments, counterarguments, ethical persuasion strategies, visual support, group discussion, and self-assessment\n\n## Mastery Outcomes\n\n- Select a mix of support (data, example, expert testimony, story/narrative) that advances a the central idea for the discussion board speech.\n\n- Evaluate your evidence on two tests: is it accurate and well-sourced, and will this audience accept it as credible?\n\n## New Concepts Introduced\n\n- **Support type:** A category of material used to advance a central idea. The four permitted types in this lesson are data, example, expert testimony, and story/narrative.\n- **Evidence/support fit:** The degree to which a piece of support directly helps the audience understand, believe, feel, or act in line with the central idea.\n- **Accuracy and source quality test:** Checking whether a claim is factually sound, traceable to a source, appropriately represented, and supported by adequate methods or documentation.\n- **Audience credibility test:** Asking whether this particular audience will view the source and material as trustworthy, relevant, qualified, and appropriately presented.\n- **Validated versus merely claimed credibility:** A credential, institutional label, statistic, or partnership can signal credibility without proving it. Stronger support is traceable, relevant to the claim, and specific about its basis.\n\n## General remarks / tips\n\n- Begin by asking the student to share their central idea from lesson 5 before teaching. If they do not have it available, supply a fresh, short speech topic and invite them to create a one-sentence central idea.\n- Treat the student as already confident with central-idea decision filtering, audience adaptation, claim/evidence/explanation distinctions, and source scrutiny. These concepts were last practiced at **2026-08-27T13:58:20.902Z** for the central idea and **2026-08-27T02:10:04.771Z** for evidence credibility; do not present them as brand-new or redundantly reteach them.\n- Use the student’s finalized idea as an optional working case: “By the end of my talk, I want you to see Lucian of Samosata’s *A True Story* as an early work of science fiction—and be curious enough to read it yourself and decide whether you agree.”\n- Invite the student to choose a small mix rather than collecting every possible kind of support. Emphasize that each item must earn its place by advancing the central idea.\n- A useful selection frame is: **What does this support help the audience understand or decide? Why is this source appropriate for this audience?**\n- Encourage a balanced mix, such as one vivid example or story plus one well-sourced factual claim or expert source, when each serves a distinct purpose.\n- Have the student explain the role of every selected item rather than merely naming a source. For example, a vivid Moon-Men episode may create interest, while a reliable literary-history source may support classification as early science fiction.\n- Preserve the distinction between rhetorical effectiveness and evidentiary strength. Interesting or persuasive material is not automatically accurate or well-supported.\n- Ask the student lection and the two evaluation tests.", "retrieval_grounding": "Every claim about the student — the finalized Lucian central idea, high confidence with decision filtering, audience adaptation, claim/evidence/explanation distinctions, and source credibility analysis (with matching timestamps), the need to verify literary/historical comparisons, and interests in AI/technology/literature and mixed technical audiences — traces directly to the retrieved summaries. The stated preferences (concrete cases, decision filters, source audits, justifying choices) are also grounded in demonstrated prior behavior.", "golden_agreement": "The candidate matches the reference on nearly every substantive decision: same topics and order, same in/out-of-scope boundaries, identical mastery outcomes, the same two credibility tests, reuse of the Lucian central idea, emphasis on trimming excess sources, and the same lesson flow ending with justification of each source. The main gap is that it does not introduce the reference's two named tools (Support Mix Matrix and Audience Credibility Lens), though it substitutes functionally similar checklists and a sorting activity, and it makes the Lucian example optional rather than default.", "pairwise_preference": "Both orders agreed (0.25 / 0.25). Both plans hit all eight sections, cover the outcomes verbatim, and stay in scope, but Plan A pads heavily with restated tips and includes confusing artifacts (e.g., the 'previous two hours' timestamp rule) that could mislead the teaching agent. Plan B delivers the same grounded personalisation and scope discipline more concisely, though its numbered teaching instructions edge slightly toward step-by-step."}}, "nano": {"output": "## Topics\n- Your discussion-board central idea (quick refresh)\n- Choosing a *mix* of credible support (data, example, expert testimony, story/narrative)\n- Credibility checks: **accurate + well-sourced** and **audience-believable**\n- Upgrading weak support into stronger support (fast revision)\n\n## Scope Envelope\n- Allowed:\n  1. Selecting supporting material types to advance a central idea (data / example / expert / story)\n  2. Evaluating evidence using two tests: accuracy & sourcing, plus audience credibility\n  3. Applying the selection decision filter to trim or replace weak content\n  4. Planning revisions to your current discussion-board support\n- Forbidden:\n  - Creating or revising an outline / organization pattern\n  - Writing delivery techniques or rehearsal strategies\n  - Managing speaking anxiety routines\n  - Introducing topics/evidence types that aren’t part of the lesson’s mastery outcomes\n\n## Mastery Outcomes\n- Select a mix of support (data, example, expert testimony, story/narrative) that advances a the central idea for the discussion board speech.\n- Evaluate your evidence on two tests: is it accurate and well-sourced, and will this audience accept it as credible?\n\n## New Concepts Introduced\n- **Two-test credibility check** for any evidence:\n  1) **Accurate + well-sourced** (traceable, not vague, not unverifiable)  \n  2) **Audience credibility** (will this particular audience accept it given expertise match, incentives, and clarity of reasoning)\n- **Mixing support types** as a deliberate strategy (not random variety) to strengthen different dimensions of persuasion/understanding:\n  - **Data** for measured claims\n  - **Examples** for “how it looks in real life”\n  - **Expert testimony** for domain authority (when specific and verifiable)\n  - **Story/narrative** for human-scale meaning and retention\n\n## General remarks / tips\n- Keep your central idea as the “destination.” Every piece of support must answer: *Does this move the audience toward believing/feeling/doing what my central idea asks?*\n- Since you previously leaned slightly toward mixing too many elements into the central idea, treat this lesson as “support clarity”: build support around one job per sentence/paragraph.\n- Aim for **specificity** over cleverness: the credibility test rewards details you can point to (who, what, when, how measured).\n\n## Things to Avoid\n- Vague evidence like “people say,” “studies show” (without identifying the study, date, and what was actually measured).\n- Overconfident causal leaps from weak/unspecified evidence (e.g., “clearly will fix everything”).\n- Credibility theater: naming impressive-sounding credentials or organizations without a traceable connection to the actual claim.\n- Support that is *on topic* but doesn’t *advance the central idea* (interesting detour = wasted time).\n\n## Student teaching preferences summary\n- No specific preferences provided.\n- Tailor pacing to practical, decision-based work.\n- Use quick, confidence-building checkpoints (short selections + fast credibility passes).\n- Likely needs: continuing practice separating the central idea from evidence/examples, and increasing rigor about factual verification of claims.\n\n## Teaching instructions\n- **Open with the student’s central idea.** Ask them to paste their finalized central idea sentence for the discussion-board speech (or a near-final draft if not pasted yet).\n- **Quick setup (1-minute mindset):** Tell them this lesson is a “support upgrade sprint,” not a full rewrite—focus on selecting and validating support.\n- **Elicit their current support list (before teaching much):** Have them share 3–6 candidate support items they plan to use (each labeled as data / example / expert / story). If they don’t have them yet, have them propose at least one candidate in each category they think they can use.\n- **Coach the “mix” decision:** Guide them to ensure the support doesn’t repeat the same function. For example: if they already have one strong data point, don’t add 3 more data points that make the same claim—add an example and/or story to make it relatable.\n- **Apply the two-test credibility check to each item (interactive):**\n  - For the **accuracy & sourcing** test, coach them to check whether they can identify the source clearly enough to verify (not just “a reputable source,” but what the source is and what it actually supports).\n  - For the **audience credibility** test, coach them to consider whether the audience will trust the source/measurement/reasoning (domain match, incentives, clarity, and whether the claim is appropriately bounded).\n- **Find and fix one weakness per support item:** For each item they share, ask: “What would make an unconvinced reader doubt this—and how can you preempt that doubt using a better source or a better way of stating the claim?”\n- **Compression and trimming:** Coach them to cut (or replace) any support that fails either credibility test or doesn’t clearly advance the central idea.\n- **Close with an “evidence-ready” checklist they can reuse:** Have them output a final mini-plan: (a) central idea (1 sentence), (b) chosen support mix (at least 3 items), and (c) for each item, a one-line note showing how it passes both credibility tests.\n- **Homework (light):** Ask them to bring their revised support list to the next lesson (or to record it in their notes) so the next step can focus on organization/clarity rather than evidence hunting.", "scores": {"section_structure": 1, "golden_similarity": 0.894964758898462, "instruction_adherence": 0.85, "golden_agreement": 0.8, "pairwise_preference": 0, "retrieval_grounding": 0.95}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan opens by asking the student to share/paste their central idea from the discussion-board work, matching the lesson directive, and it takes a supportive coaching stance consistent with the course role. However, the unit instruction requires that the lesson be startable fresh with in-lesson context and a fallback if no prior draft exists; the plan does gesture at 'a near-final draft if not pasted yet' but does not clearly provide a fresh-topic fallback for a learner who has nothing from lesson 5, so continuity is treated as somewhat assumed rather than optional.", "golden_agreement": "The candidate matches the reference's core decisions: same topics and order, identical mastery outcomes, the two-test credibility check, using the student's central idea as running example, trimming weak support, and a closing where the student states their support mix with credibility justifications. It loses some points for a thinner scope envelope (omitting explicit exclusions like visual aids, persuasive frameworks, Unit 2 content, and logistics), not introducing the named decision tools (Support Mix Matrix, Audience Credibility Lens) as concise grids/checklists, and adding a homework step not in the reference.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan B keeps Teaching instructions genuinely high-level, gives a more complete forbidden-topics list, and grounds personalisation in the retrieved summaries (the Lucian central idea, analytical preferences). Plan A's Teaching instructions are a step-by-step lesson script with homework — exactly the detail the instructions forbid — and its preferences section invents ungrounded claims after admitting none were provided.", "retrieval_grounding": "Nearly all claims about the student trace to the summaries: the finalized central idea (Lucian talk), the tendency to overload the central idea with examples/evidence, and the need for factual-verification rigor are all documented, and the plan correctly states no learning preferences were provided. The only slightly unsupported detail is labeling the central idea specifically as being for a 'discussion-board speech,' which the summaries only loosely support via SPCH100's weekly discussion grading."}}, "haiku": {"output": "# Lesson Plan: Challenge: Selecting Credible Supporting Material\n\n## Topics\n\n- Selecting a mix of support types (data, example, expert testimony, story/narrative) for the discussion board speech\n- Evaluating evidence on two core tests: accuracy & sourcing, and audience credibility\n- Distinguishing credible sources from weak or manipulated evidence\n- Building confidence in evidence selection aligned to the central idea\n\n---\n\n## Scope Envelope\n\n### Allowed\n- Central idea refinement (from Lesson 5)\n- Mix of support types: data, examples, expert testimony, story/narrative\n- Source credibility assessment: domain expertise, conflicts of interest, verifiability\n- Ethical listening: omission, selective framing, weak support detection\n- Audience-centered credibility judgment (will this audience accept this as credible?)\n- Speech context: discussion board video submission, pre-recorded, audience is classmates and instructor\n\n### Forbidden\n- Persuasive argument construction (Unit 2)\n- Counterargument strategies (Unit 2)\n- Visual design or slide creation (Unit 2)\n- Organizational patterns beyond what supports central idea (reserved for Lesson 7)\n- Delivery techniques or rehearsal (reserved for Lesson 8)\n- Managing anxiety or pre-speech routines (reserved for Lesson 9)\n- AI-generated or unvetted summaries as evidence\n- Complex statistical analysis or methodology critique\n\n---\n\n## Mastery Outcomes\n\n- Select a mix of support (data, example, expert testimony, story/narrative) that advances the central idea for the discussion board speech.\n- Evaluate your evidence on two tests: is it accurate and well-sourced, and will this audience accept it as credible?\n\n---\n\n## New Concepts Introduced\n\n- **Evidence diversity as rhetorical strategy**: Understanding that different support types (data, example, expert testimony, narrative) serve different persuasive and explanatory functions, and that mixing them strengthens credibility rather than weakening it.\n- **The two-test credibility framework**: Separating the *objective test* (Is this source accurate, traceable, and well-sourced?) from the *audience test* (Will my specific audience—classmates in this course—see this as credible given their knowledge and values?).\n- **Red flags for weak or manipulated evidence**: Recognizing unnamed sources (\"leading researchers\"), unverifiable claims (\"noticeable improvements\"), missing methodology, unstated incentives, and cherry-picked timeframes or datasets.\n- **Claiming vs. verifying**: Understanding that a source making a claim is not the same as evidence supporting it, and practicing the habit of asking \"Where did this come from?\" before including it.\n\n---\n\n## General Remarks / Tips\n\n1. **Start with the student's central idea**: Before selecting any evidence, ask the student to share their finalized central idea from Lesson 5. This anchors all evidence choices to purpose and prevents irrelevant or tangential support.\n\n2. **Model source credibility as a spectrum, not binary**: Sources are rarely purely credible or non-credible. A personal anecdote from a peer can strengthen narrative connection even if it's not \"data.\" A news report is stronger if it cites methodology, but weak reporting may still raise awareness.\n\n3. **Connect to the student's existing strength in critical listening**: The student demonstrated advanced mastery of identifying manipulated or weak evidence (from the critical-and-ethical-listening lesson on 2026-08-27T02:10:04.771Z). Leverage this strength—they can already spot unnamed sources, missing methodology, and overconfident conclusions. Help them apply that same critical eye to *their own* evidence choices.\n\n4. **Emphasize the audience test**: The student is speaking to classmates and an instructor in a discussion board video. This is not a public or high-stakes audience. Help them consider: What will classmates already know or believe? What will feel credible to them? Do they need academic citations, or will a well-sourced example from a reputable publication suffice?\n\n5. **Encourage breadth over depth**: A mix of support types is stronger than relying solely on data or solely on narrative. Help the student identify at least one data point, one specific example, one authoritative voice or statistic, and one brief personal or illustrative story—even if some are modest in scope.\n\n6. **Anticipate the overload trap**: The student has shown a tendency to include too much supporting material when planning (from Lesson 5 feedback). Reinforce the decision filter: Does this evidence *advance the central idea*, or does it distract or dilute it?\n\n7. **Use the speech coach role**: This lesson prioritizes guidance and building confidence over formatting exactness. Help the student feel secure that their evidence choices are sound and credible, not perfect or exhaustively researched.\n\n---\n\n## Things to Avoid\n\n- **Do not require academic citations or formal bibliography formats** for a discussion board speech context. The focus is on credibility, not citation format.\n- **Do not introduce counterargument or refutation strategies**—those belong in Unit 2 lessons.\n- **Do not teach statistical significance testing or research methodology critique**—this is Unit 2 depth.\n- **Do not preview organizational patterns or outline structure**—that is Lesson 7.\n- **Do not ask the student to rehearse or deliver the speech**—that is Lesson 8.\n- **Do not suggest that all evidence must be from peer-reviewed sources or formal databases**—context matters; a well-sourced news article, credible blog post, or documented personal example can be appropriate for this audience.\n- **Do not assume the student has located all their evidence yet**—many students arrive with a central idea but no specific support. Be prepared to help them brainstorm or locate sources if needed.\n\n---\n\n## Student Teaching Preferences Summary\n\nNo specific learning preferences are documented. Teach for clarity, engagement, and practical application. Use the student's demonstrated strength in critical evidence evaluation and their emerging comfort with central idea refinement to build confidence. Avoid excessive jargon; prioritize actionable guidance.\n\n---\n\n## Teaching Instructions\n\n1. **Open by confirming the central idea**: Ask the student to share their finalized central idea from Lesson 5 (e.g., the student previously finalized: \"By the end of my talk, I want you to see Lucian of Samosata's *A True Story* as an early work of science fiction—and be curious enough to read it yourself and decide whether you agree.\"). If they no longer have it or have revised it, refine it together now.\n\n2. **Introduce the two-test framework**: Explain that credible evidence must pass *two* independent tests:\n   - **Test 1 (Accuracy & Sourcing)**: Is the claim factually accurate? Can you trace it to a credible source? Is the methodology clear (if data)? Are incentives and conflicts transparent?\n   - **Test 2 (Audience Credibility)**: Will your specific audience—classmates and your instructor in a discussion board—find this credible? Does it align with their values or prior knowledge? Does it feel trustworthy to them?\n\n3. **Show the evidence-diversity requirement**: Help the student identify support across at least these types: data (statistic, survey result, measurement), example (specific case, story, scenario), expert testimony (credible voice or authority), and narrative (personal anecdote or illustrative moment). Ask which types naturally fit their central idea and why.\n\n4. **Apply the red-flag checklist**: Teach the student to ask critical questions before including any piece of evidence:\n   - Who is the source? Are they named and credible?\n   - How do they know this? (Where is the methodology or evidence chain?)\n   - Do they have a conflict of interest? (Who benefits if this is believed?)\n   - Is this claim specific and verifiable, or vague and sweeping?\n   - Have they cherry-picked a timeframe, dataset, or comparison group?\n\n5. **Practice on the student's actual evidence**: Have the student list the evidence they plan to use (or brainstorm 3–4 candidates). Work through each piece using the two-test framework and red-flag checklist. Identify strengths and any gaps. Help them revise weak sources or locate alternatives if needed.\n\n6. **Reinforce the decision filter**: For each piece of evidence, ask: \"Does this advance your central idea, or does it distract?\" If it's tangential or over-lengthy, suggest cutting or compressing it.\n\n7. **Close with confidence-building**: Affirm that the student has strong critical-listening skills and can evaluate evidence rigorously. Confirm they feel confident in their evidence mix before moving to the next lesson (Lesson 7: organizing the speech).\n\n---", "scores": {"section_structure": 1, "golden_similarity": 0.8594907538055598, "instruction_adherence": 0.9, "retrieval_grounding": 1, "pairwise_preference": 0, "golden_agreement": 0.85}, "reasoning": {"section_structure": "Matched 8/8 sections", "instruction_adherence": "The plan strongly reflects the lesson-specific directive to build on the Lesson 5 central idea and explicitly opens by asking the student to share it, and it embodies the speech-coach role prioritizing confidence over formatting. It handles the unit's fresh-start concern reasonably by preparing to refine or reconstruct the idea if the student no longer has it and by offering to brainstorm evidence, though it leans on prior-lesson continuity more than the unit's 'startable fresh with in-lesson context' guidance ideally wants.", "retrieval_grounding": "Every claim about the student is traceable to the summaries: the finalized central idea quote matches the Lesson 5 (finding-a-focused-central-idea) summary verbatim, the advanced critical-listening/evidence-evaluation strength matches the critical-and-ethical-listening summary, the tendency to overload supporting material matches the noted Lesson 5 gap, and the statement that no learning preferences are documented is accurate.", "pairwise_preference": "Both orders agreed (0.00 / 0.00). Plan A breaks the Scope Envelope rule with six allow ght calculations and percentage reasoning  \n     • Gains clarity from concrete small-business examples  \n\n8. **Teaching instructions**  \n   - Open with a rapid Tasklane vignette contrasting two approaches: adding a “QA agent” to read every ticket (inspection) vs. redesigning the desktop-app invite flow (built-in quality).  \n   - Introduce Jidoka; immediately use show-video-widget with the provided URL to solidify the “stop-the-line” mindset.  \n   - Facilitate a mini-exercise: have the student state one recurring Tasklane defect, trace where it originates in the workflow, and propose an upstream design tweak.  \n   - Reinforce the “defects come from design” mantra by asking the student to rephrase it in their own words.  \n   - Close by summarizing how a single design change can eliminate whole classes of errors and free capacity, teeing up the next lesson on waste without previewing its content.", "lessonTitle": "Quality designed in, not inspected in", "unitTitle": "Improving the system", "masteryOutcomes": ["Distinguish designing quality into a process from inspecting quality at the end, using a small-business example.", "Explain why defects come from how the work is designed (not from people trying less hard), and identify one upstream design change that would prevent a recurring defect."], "instructions": {"unit": "Unit scenario — Tasklane, a team task-manager SaaS (think a simpler Trello/Asana: kanban boards, task assignments, due dates, comments, with both a desktop app and a web app). Tasklane has ~12,000 active users on a freemium plan and a 4-person support team (lead: Priya; agents: Sam, Noor, Jules) handling tickets in a shared inbox. Support volume has grown ~40% in the last quarter while headcount stayed flat. The top three ticket categories are onboarding confusion (new users can't find how to invite teammates to a board), a recurring sync bug between the desktop app and the web app, and billing/plan-change questions. First-response time has crept  throughput, or scheduling\n- Supplier management, inventory, forecasting, or uncertainty\n- Cross-functional leadership, stakeholder pushback, or adoption planning\n- Any later-unit lesson content not named in the mastery outcomes\n\n# Mastery Outcomes\n\n- Distinguish designing quality into a process from inspecting quality at the end, using a small-business example.\n- Explain why defects come from how the work is designed (not from people trying less hard), and identify one upstream design change that would prevent a recurring defect.\n\n# New Concepts Introduced\n\n- **Designed-in quality:** Building a process so the correct result is the natural and supported outcome.\n- **End-of-process inspection:** Checking completed work to detect defects after they have already been created.\n- **Upstream design change:** Altering an earlier step, interface, rule, or information source to prevent a later defect.\n- **Downstream correction:** Finding, reworking, or apologizing for an error after it reaches the customer.\n- **System-created defect:** A recurring error caused by unclear instructions, confusing interfaces, missing information, or unreliable handoffs rather than by employees simply failing to try.\n- **Prevention versus detection:** Prevention reduces the chance that a defect occurs; detection identifies it after it exists.\n- **Quality at the source:** Making the process produce acceptable work during the activity itself, illustrated briefly through the provided Jidoka video.\n\n# General remarks / tips\n\n- Use Tasklane as the central case: onboarding users cannot find how to invite teammates, the AI tool sends some users to the wrong article, and support agents then inspect or correct tickets after they arrive.\n- Begin by connecting to the student’s demonstrated understanding from **2026-08-27T12:05:26.881Z**: the student already understands upstream fixes and has proposed guided in-app steps for onboarding confusion. Do not reteach that concept as entirely new; deepen it by contrasting prevention with inspection.\n- Use the student’s strong systems-thinking pattern: repeatedly replace “the agent did not try hard enough” with “what in the workflow made this error likely?”\n- Ask the student to identify the point where quality is currently inspected and the earlier point where quality could be designed in.\n- Keep examples concrete and small. A useful comparison is:\n  - Inspection: an agent checks whether a ticket was answered correctly after it has been submitted.\n  - Designed-in quality: the product gives a new user a clear, visible invitation path before the support ticket is created.\n- Reinforce the causal chain explicitly: confusing design → user error or incorrect AI guidance → support ticket/rework → customer frustration.\n- Include the video using the `show-video-widget` tool with the exact URL: `https://www.youtube.com/watch?v=vCpjW-rnplc`. Use it to illustrate stopping or correcting a defect at the point where it appears, without expanding into later improvement-loop content.\n- Have the student compare at least two possible Tasklane responses and explain which is upstream:\n  - Add a second review step for every AI-generated reply.\n  - Restrict or redesign AI suggestions for onboarding questions and improve the in-product invitation flow.\n- Prompt the student to produce one concise answer using the structure: **recurring defect → design feature causing it → upstream prevention change → expected customer benefit**.\n- If using a closed question, specify whether it is single-select or multi-select, list every answer, mark the correct answer(s), and instruct the teaching agent to use the `show-closed-question-widget` tool.\n- Keep the focus on prevention and design. Do not drift into full root-cause analysis, waste identification, PDCA, or KPI selection.\n\n# Things to Avoid\n\n- Do not blame Sam, Noor, Jules, Priya, or Tasklane users for recurring mistakes.\n- Do not present additional inspection as equi
